'use strict';

/* =========================================================
   Round the Year — Lightboard kid game #7 (Life-style)
   One turn = one month. January to December. Each month has a
   shared holiday or life marker, then every player draws a
   personal event card: fun events, plus learning moments with a
   two-choice tap (dress for the weather, save or spend, share,
   needs vs wants, plant in spring and harvest in fall).
   The whole town re-skins by season. The year ends with a
   highlight-reel recap of everyone's year.
   Board space 1600x900; input = normalized taps via TouchSource.
   ========================================================= */

const W = 1600, H = 900;
const FONT = 'Sniglet, "Trebuchet MS", "Segoe UI", system-ui, sans-serif';
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let dpr = 1, scale = 1, ox = 0, oy = 0, vw = 0, vh = 0;

/* ---------------- utils ---------------- */
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20261);
const lerp = (a,b,t) => a + (b-a)*t;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const ease = {
  inOut: t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2,
  out: t => 1 - Math.pow(1-t, 3),
  in: t => t*t,
  lin: t => t,
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }
};
function hexRgb(h){ const n = parseInt(h.slice(1), 16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const [r,g,b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; }
function shade(h,f){ const [r,g,b] = hexRgb(h);
  const m = v => Math.round(clamp(f < 0 ? v*(1+f) : v + (255-v)*f, 0, 255));
  return `rgb(${m(r)},${m(g)},${m(b)})`; }
function mixHex(a, b, t){ const A = hexRgb(a), B = hexRgb(b); return `rgb(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))})`; }
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function text(str,x,y,size,color,align='center',c=ctx){
  c.font = `${size}px ${FONT}`; c.textAlign = align; c.textBaseline = 'middle'; c.fillStyle = color; c.fillText(str,x,y);
}
function outlined(str,x,y,size,fill,stroke,lw=6,align='center',c=ctx){
  c.font = `${size}px ${FONT}`; c.textAlign = align; c.textBaseline = 'middle';
  c.lineJoin = 'round'; c.lineWidth = lw; c.strokeStyle = stroke; c.strokeText(str,x,y);
  c.fillStyle = fill; c.fillText(str,x,y);
}
function emoji(ch,x,y,size,c=ctx){
  c.font = `${size}px ${EMOJI}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.fillText(ch,x,y);
}
const glowCache = {};
function glowSprite(color){
  if (glowCache[color]) return glowCache[color];
  const s = 128, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d'), gr = g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0, rgba(color,1)); gr.addColorStop(0.2, rgba(color,0.55)); gr.addColorStop(0.5, rgba(color,0.15)); gr.addColorStop(1, rgba(color,0));
  g.fillStyle = gr; g.fillRect(0,0,s,s); return glowCache[color] = c;
}
function glowTo(c,x,y,r,color,a){ if (a <= 0.003 || r <= 0) return; c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = clamp(a,0,1); c.drawImage(glowSprite(color), x-r, y-r, r*2, r*2); c.restore(); }
const glow = (x,y,r,color,a=1) => glowTo(ctx,x,y,r,color,a);
function starPath(c,x,y,r,rot,pts=5,inner=0.45){
  c.beginPath();
  for (let k = 0; k < pts*2; k++){ const a = rot + k*Math.PI/pts, rad = k % 2 ? r*inner : r; c.lineTo(x + Math.cos(a)*rad, y + Math.sin(a)*rad); }
  c.closePath();
}

/* ---------------- tweens ---------------- */
const tweens = [];
function tween(ms, fn, e = ease.inOut){ return new Promise(res => tweens.push({ start: performance.now(), ms, fn, e, res })); }
const wait = ms => tween(ms, () => {});
function updateTweens(now){
  for (let i = tweens.length - 1; i >= 0; i--){
    const tw = tweens[i]; const t = Math.min(1, (now - tw.start) / tw.ms);
    tw.fn(tw.e(t)); if (t >= 1){ tweens.splice(i,1); tw.res(); }
  }
}

/* ---------------- settings + audio ---------------- */
const settings = { slow: false, sound: true, voice: true };
const sfx = {
  ac: null, master: null,
  unlock(){
    try {
      if (!this.ac){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        this.ac = new AC(); this.master = this.ac.createGain(); this.master.gain.value = 0.5; this.master.connect(this.ac.destination); }
      if (this.ac.state === 'suspended') this.ac.resume();
    } catch (e) {}
  },
  ok(){ return settings.sound && this.ac && this.ac.state === 'running'; },
  tone(f, dur=0.25, type='sine', vol=0.2, when=0, slide=1){
    if (!this.ok()) return;
    const a = this.ac, t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide !== 1) o.frequency.exponentialRampToValueAtTime(f*slide, t+dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.05);
  },
  noise(dur=0.3, vol=0.15, f0=800, f1=800, when=0, type='bandpass'){
    if (!this.ok()) return;
    const a = this.ac, len = Math.max(1, Math.floor(a.sampleRate*dur)), buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random()*2-1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type; f.Q.value = 1;
    const t = a.currentTime + when;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t+dur);
    const g = a.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t+dur+0.05);
  },
  tap(){ this.tone(1100, 0.06, 'triangle', 0.06); },
  flip(){ this.noise(0.25, 0.08, 800, 4000); this.tone(1319, 0.2, 'sine', 0.06, 0.12); },
  reveal(){ [659, 784, 988].forEach((f,i) => this.tone(f, 0.3, 'triangle', 0.09, i*0.06)); },
  star(n = 0){ const s = [988, 1175, 1319, 1568, 1760]; this.tone(s[n % s.length], 0.22, 'triangle', 0.1); this.tone(s[n % s.length]*2, 0.12, 'sine', 0.03); },
  coin(){ this.tone(1568, 0.08, 'square', 0.05); this.tone(2093, 0.22, 'square', 0.05, 0.07); },
  good(){ [523, 659, 784, 1047].forEach((f,i) => this.tone(f, 0.2, 'triangle', 0.1, i*0.07)); },
  oops(){ this.tone(392, 0.18, 'triangle', 0.1); this.tone(330, 0.25, 'triangle', 0.1, 0.14); },
  place(){ this.tone(330, 0.1, 'triangle', 0.12, 0, 1.5); this.noise(0.08, 0.06, 900, 300); },
  month(){ [392, 523, 659, 784].forEach((f,i) => this.tone(f, 0.28, 'triangle', 0.1, i*0.1)); this.tone(1047, 0.4, 'sine', 0.06, 0.4); },
  turn(){ this.tone(784, 0.12, 'triangle', 0.08); this.tone(1175, 0.18, 'triangle', 0.07, 0.09); },
  pop(){ this.tone(300, 0.1, 'sine', 0.2, 0, 2.5); },
  boom(){ this.noise(0.5, 0.2, 2500, 150, 0, 'lowpass'); this.tone(90, 0.4, 'sine', 0.15, 0, 0.5); for (let i = 0; i < 8; i++) this.tone(1800 + Math.random()*2400, 0.15, 'triangle', 0.03, 0.15 + i*0.04); },
  bell(){ [1047, 1319, 1568].forEach((f,i) => this.tone(f, 0.9, 'sine', 0.07, i*0.05)); },
  bus(){ this.tone(300, 0.12, 'square', 0.05); this.tone(240, 0.12, 'square', 0.05, 0.2); },
  gobble(){ for (let i = 0; i < 6; i++) this.tone(500 + Math.random()*200, 0.06, 'sawtooth', 0.04, i*0.06, 0.6); },
  bat(){ this.tone(2400, 0.06, 'sine', 0.02); },
  rain(){ this.noise(0.6, 0.05, 3000, 6000, 0, 'highpass'); },
  sparkle(){ this.tone(2400 + Math.random()*1600, 0.1, 'sine', 0.025, 0, 1.3); },
  season(){ [523, 659, 784, 1047, 1319].forEach((f,i) => this.tone(f, 0.4, 'sine', 0.08, i*0.08)); },
  yearEnd(){ [523, 659, 784, 1047].forEach((f,i) => this.tone(f, 0.5, 'triangle', 0.1, i*0.12)); this.noise(1.2, 0.08, 400, 4000, 0.4); },
  win(){ const m = [523, 659, 784, 659, 784, 1047, 988, 1319];
    m.forEach((f,i) => { this.tone(f, 0.28, 'triangle', 0.12, i*0.12); this.tone(f/2, 0.28, 'sine', 0.08, i*0.12); });
    for (let i = 0; i < 12; i++) this.tone(1800 + Math.random()*2000, 0.16, 'sine', 0.04, 1.2 + i*0.07); },
  start(){ [523, 659, 784, 1047].forEach((f,i) => this.tone(f, 0.24, 'triangle', 0.09, i*0.08)); },
  join(i){ this.tone([523, 659, 784, 988][i%4], 0.22, 'triangle', 0.12, 0, 1.4); }
};
let speechUnlocked = false;
function speak(str){
  if (!settings.voice || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(str); u.rate = 1.0; u.pitch = 1.2; speechSynthesis.speak(u); } catch (e) {}
}
function unlockAll(){
  sfx.unlock();
  if (!speechUnlocked && 'speechSynthesis' in window){ speechUnlocked = true;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {} }
}

function guaranteedEvents(p, m){
  const q = [];
  if (p.bMonth === m) q.push('birthday');
  if (m === 5 && p.fund >= 2 && !p.bike) q.push('bikeday');

}

function applyRes(p, res, flag){

  if (flag === 'seeds') p.seeds = true;
  if (flag === 'fund') p.fund = 2;

}

function toBoard(cx,cy){ return { x: (cx-ox)/scale, y: (cy-oy)/scale }; }
class PointerSource {
  constructor(el){
    this.el = el; this.slow = false; this.dwell = 650; this.active = new Map(); this.handlers = [];
    el.addEventListener('pointerdown', e => this.down(e));
    el.addEventListener('pointermove', e => this.move(e));
    el.addEventListener('pointerup', e => this.up(e));
    el.addEventListener('pointercancel', e => this.active.delete(e.pointerId));
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  onTap(fn){ this.handlers.push(fn); }
  emit(bx,by){ const ev = { x: bx/W, y: by/H, type: 'tap' }; for (const f of this.handlers) f(ev); }
  down(e){
    e.preventDefault(); unlockAll();
    const p = toBoard(e.clientX, e.clientY);
    this.active.set(e.pointerId, { x: p.x, y: p.y, sx: p.x, sy: p.y, start: performance.now(), fired: false, moved: false });
    try { this.el.setPointerCapture(e.pointerId); } catch (_) {}
  }
  move(e){
    const a = this.active.get(e.pointerId); if (!a) return;
    const p = toBoard(e.clientX, e.clientY); a.x = p.x; a.y = p.y;
    if (Math.hypot(a.x-a.sx, a.y-a.sy) > 30){
      if (this.slow){ a.sx = a.x; a.sy = a.y; a.start = performance.now(); a.fired = false; } else a.moved = true;
    }
  }
  up(e){ const a = this.active.get(e.pointerId); this.active.delete(e.pointerId); if (a && !this.slow && !a.moved) this.emit(a.sx, a.sy); }
  update(now){
    if (!this.slow) return;
    for (const a of this.active.values()) if (!a.fired && now - a.start >= this.dwell){ a.fired = true; this.emit(a.sx, a.sy); }
  }
}

async function runEvent(p, idx, id, gid){
  const ev = EV[id];
  phase = 'busy'; statusMsg = '';
  sfx.turn(); speak(`${p.name}, tap the card!`);
  cardState = { ev, id, x: CARD.x, y: CARD.y, w: CARD.w, h: CARD.h, flip: 0, stamp: null, sc: 1, mini: false, pop: 0 };
  const cs = cardState;
  await tween(400, t => { cs.sc = 0.6 + 0.4*ease.back(t); }, ease.out);
  phase = 'flip';
  await waitFor('card');
  if (gid !== gameId) return;
  phase = 'busy';
  sfx.flip();
  await tween(520, t => { cs.flip = t; });
  sfx.reveal(); speak(ev.say);
  sparkleAt(CARD.x, CARD.y, '#ffffff', 22, 260);
  await wait(500);
  let opt = null, res = ev.res || {}, flag = ev.flag, item = ev.item, line = null;
  if (ev.kind === 'choice'){
    choiceOpts = ev.opts; phase = 'choose';
    const k = await waitFor('choice', ev.opts.length);
    if (gid !== gameId) return;
    opt = ev.opts[k]; choiceOpts = []; phase = 'busy';
    res = opt.res; flag = opt.flag; item = opt.item; line = opt.say;
    cs.picked = k;
    sfx.tap();
  } else {
    phase = 'ok';
    await waitFor('ok');
    if (gid !== gameId) return;
    phase = 'busy'; sfx.tap(); line = null;
  }
  // payoff
  const before = { s: p.stars, c: p.coins };
  const d = applyRes(p, res, flag);
  p.starBump = d.s ? 1 : p.starBump; p.coinBump = d.c ? 1 : p.coinBump;
  const good = opt ? opt.good !== false && (d.s >= 2 || opt.good) : true;
  if (opt){ if (opt.good) sfx.good(); else sfx.oops(); }
  const stampTxt = [d.s ? `${d.s > 0 ? '+' : ''}${d.s}⭐` : '', d.c ? `${d.c > 0 ? '+' : ''}${d.c}🪙` : ''].filter(Boolean).join('  ');
  cs.stamp = { txt: stampTxt || '👍', t: 0, good };
  if (line) speak(line);
  const r = yardRect(idx);
  for (let k = 0; k < Math.max(0, d.s); k++) flyers.push({ kind: 'star', sx: CARD.x, sy: CARD.y, tx: r.x + 258, ty: r.y + 36, t: -k*0.14 });
  for (let k = 0; k < Math.abs(d.c); k++) flyers.push({ kind: 'coin', sx: d.c > 0 ? CARD.x : r.x + 318, sy: d.c > 0 ? CARD.y : r.y + 36, tx: d.c > 0 ? r.x + 318 : CARD.x, ty: d.c > 0 ? r.y + 36 : CARD.y, t: -k*0.12 });
  if (d.s > 0) sfx.star(1); if (d.c > 0) sfx.coin();
  await tween(500, t => { cs.stamp.t = t; }, ease.out);
  await wait(1100);
  if (gid !== gameId) return;
  // card flies to the yard, item lands
  const rc = yardRect(idx);
  const target = { x: rc.x + 220, y: rc.y + 190 };
  const sx = cs.x, sy = cs.y;
  await tween(650, t => { cs.x = lerp(sx, target.x, t); cs.y = lerp(sy, target.y, t); cs.sc = 1 - 0.85*t; }, ease.inOut);
  cardState = null;
  const icon = item || ev.e;
  if (flag === 'seeds'){ sfx.place(); sparkleAt(rc.x + 90, rc.y + 240, '#8fdc7a', 20, 200); }
  else { addYardItem(p, icon); sfx.place(); sparkleAt(target.x, target.y, p.color, 16, 200); }
  p.history.push({ m: month, e: opt ? opt.e : ev.e });
  await wait(700);
}

function addYardItem(p, icon){
  const used = p.items.length;
  const slot = used % SLOTS.length;
  const it = { e: icon, slot, born: performance.now()/1000 };
  const existing = p.items.findIndex(q => q.slot === slot);
  if (existing >= 0) p.items.splice(existing, 1);
  p.items.push(it);
}

async function yearEnd(gid){
  phase = 'busy'; statusMsg = '';
  banner = { icon: '🎉', title: 'The year is over!', sub: 'Let’s see everyone’s year', t: 0 };
  sfx.yearEnd(); speak('The year is over! Let us see everyone’s year!');
  await tween(2800, t => { banner.t = t; }, ease.lin);
  banner = null;
  if (gid !== gameId) return;
  screen = 'recap'; phase = 'recap';
  recap = { reveal: 0, count: 0, done: false, winner: false };
  let lastR = 0;
  await tween(3200, t => { recap.reveal = t*12; const ri = Math.floor(recap.reveal); if (ri !== lastR){ lastR = ri; sfx.star(ri % 5); } }, ease.lin);
  recap.reveal = 12;

  const names = winners.map(w => w.name);
  speak(names.length > 1 ? `${names.slice(0,-1).join(', ')} and ${names[names.length-1]} had the best year! Hooray!` : `${names[0]} had the best year! Hooray!`);
  for (let i = 0; i < 50; i++) sparks.push({ x: Math.random()*W, y: -Math.random()*300, vx: (Math.random()-0.5)*80, vy: 100 + Math.random()*200, life: 0, max: 4, s: 6 + Math.random()*8, col: pick(['#ffd166', '#ff8ac1', '#5ee6d0', '#b98cff', '#ffffff']), conf: true });
  recap.done = true; phase = 'done';
}

let T = 0, last = performance.now(), nextAmb = 3, nextFw = 2;
function update(dt, now){
  T = now/1000;
  for (const c of clouds){ c.x += c.sp*dt; if (c.x > W + 160) c.x = -160; }
  const sm = screen === 'menu' ? 0 : month, se = MONTHS[sm].season;
  // weather particles
  const cnt = t => parts.filter(p => p.type === t).length;
  if (screen !== 'menu' || true){
    if (se === 0 && cnt('snow') < 80 && Math.random() < dt*40) parts.push({ type: 'snow', x: Math.random()*W, y: -10, vy: 50 + Math.random()*70, ph: Math.random()*6, r: 2 + Math.random()*3.5, life: 0, max: 20 });
    if (se === 1 && sm !== 2 && cnt('petal') < 30 && Math.random() < dt*6) parts.push({ type: 'petal', x: Math.random()*W, y: -10, vy: 40 + Math.random()*40, ph: Math.random()*6, life: 0, max: 20, col: pick(['#ffc1dc', '#ffffff', '#ffd6e8']) });
    if (sm === 2 && cnt('rain') < 120 && Math.random() < dt*90) parts.push({ type: 'rain', x: Math.random()*W, y: -10, vy: 700 + Math.random()*200, life: 0, max: 3 });
    if (se === 3 && cnt('leaf') < (sm === 10 ? 60 : 32) && Math.random() < dt*(sm === 10 ? 9 : 5)) parts.push({ type: 'leaf', x: Math.random()*W, y: -10, vy: 50 + Math.random()*60, ph: Math.random()*6, life: 0, max: 20, col: pick(['#e8862a', '#d9482a', '#f2c23a', '#c0602a']) });
  }
  for (let i = parts.length-1; i >= 0; i--){
    const p = parts[i]; p.life += dt;
    if (p.type === 'heart'){ p.y += p.vy*dt; p.x += Math.sin(T*2 + p.ph)*30*dt; }
    else if (p.type === 'rain'){ p.y += p.vy*dt; p.x -= 60*dt; }
    else { p.y += p.vy*dt; p.x += Math.sin(T*1.6 + p.ph)*40*dt; }
    if (p.y > H + 20 || p.y < -60 || p.life > p.max) parts.splice(i, 1);
  }
  if (sm === 2 && screen !== 'menu' && Math.random() < dt*0.4) sfx.rain();
  if ((sm === 6 || sm === 0) && screen === 'play' && !paused && Math.random() < dt*0.3 && (sm === 6)) firework();
  for (let i = sparks.length-1; i >= 0; i--){
    const s = sparks[i]; s.life += dt; if (s.life > s.max){ sparks.splice(i,1); continue; }
    if (s.conf){ s.x += (s.vx + Math.sin(T*3 + s.s)*30)*dt; s.y += s.vy*dt; if (s.y > H + 30) sparks.splice(i,1); continue; }
    s.vx *= 0.97; s.vy = s.vy*0.97 + (s.grav ? 220 : 40)*dt; s.x += s.vx*dt; s.y += s.vy*dt;
  }
  for (const f of butterflies){ f.x += f.sp*dt; f.y += Math.sin(T*2 + f.ph)*40*dt; if (f.x > W + 30){ f.x = -30; f.y = 200 + Math.random()*300; } }
  for (let i = pops.length-1; i >= 0; i--){ pops[i].t += dt; if (pops[i].t > 1.2) pops.splice(i,1); }
  for (let i = taps.length-1; i >= 0; i--){ taps[i].t += dt; if (taps[i].t > 0.5) taps.splice(i,1); }
  for (let i = flyers.length-1; i >= 0; i--){
    const f = flyers[i]; f.t += dt/0.85; if (f.t >= 1){ flyers.splice(i,1); if (f.kind === 'star') sfx.star(2); else sfx.coin(); continue; }
    if (f.t < 0) continue; const t = ease.inOut(f.t); f.x = lerp(f.sx, f.tx, t); f.y = lerp(f.sy, f.ty, t) - Math.sin(Math.PI*t)*140;
  }
  for (const p of players){ p.starBump = Math.max(0, p.starBump - dt*2.5); p.coinBump = Math.max(0, p.coinBump - dt*2.5); p.bounce = Math.max(0, p.bounce - dt*3); }
  if (sm === 8 && screen === 'play'){ busX += 130*dt; if (busX > W + 220) busX = -300; }
  if (sm === 10 && screen === 'play'){ turkeyX += 40*dt; if (turkeyX > W + 80) turkeyX = -100; }
  if (T > nextAmb){ sfx.sparkle(); nextAmb = T + 3 + Math.random()*4; }
}

  if (!source.slow) return;
  for (const a of source.active.values()){
    if (a.fired) continue;
    const k = clamp((now - a.start)/source.dwell, 0, 1);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 9; ctx.beginPath(); ctx.arc(a.sx, a.sy, 42, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = '#ff8a3d'; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(a.sx, a.sy, 42, -Math.PI/2, -Math.PI/2 + k*Math.PI*2); ctx.stroke(); ctx.lineCap = 'butt';
  }
}

/* ---------------- buttons / taps ---------------- */
function buttons(){
  const B = [];
  if (screen === 'menu'){
    KIDS.forEach((c, i) => B.push({ x: TILE_X[i], y: 420, w: 214, h: 244, silent: true, on: () => {
      joined[i] = !joined[i]; if (joined[i]){ sfx.join(i); sparkleAt(TILE_X[i], 400, c.color, 22, 260); } else sfx.tap(); } }));
    for (const t of TOGGLES) B.push({ x: t.x, y: 624, w: 226, h: 76, on: () => { settings[t.key] = !settings[t.key]; applySettings(); } });
    B.push({ x: 800, y: 770, w: 350, h: 110, on: () => { if (joined.some(Boolean)) startGame(); } });
  } else if (paused){
    B.push({ x: 800, y: 370, w: 390, h: 100, on: () => { paused = false; } });
    for (const t of TOGGLES) B.push({ x: t.x, y: 490, w: 226, h: 76, on: () => { settings[t.key] = !settings[t.key]; applySettings(); } });
    B.push({ x: 800, y: 610, w: 390, h: 90, on: toMenu });
  } else if (screen === 'recap'){
    if (recap && recap.done){ B.push({ x: 640, y: 850, w: 300, h: 84, on: startGame }); B.push({ x: 960, y: 850, w: 300, h: 84, on: toMenu }); }
  } else if (screen === 'play'){
    B.push({ x: 1540, y: 54, w: 96, h: 96, on: () => { paused = true; } });
  }
  return B;
}
function handleTap(ev){
  const x = ev.x*W, y = ev.y*H;
  taps.push({ x, y, t: 0 });
  for (const b of buttons()){
    if (Math.abs(x - b.x) <= b.w/2 && Math.abs(y - b.y) <= b.h/2){ if (!b.silent) sfx.tap(); b.on(); return; }
  }
  if (screen !== 'play' || paused || !inputWait) return;
  if (inputWait.kind === 'card' && cardState){
    if (Math.abs(x - cardState.x) < cardState.w/2 + 30 && Math.abs(y - cardState.y) < cardState.h/2 + 30){ const r = inputWait; inputWait = null; r.resolve(); }
  } else if (inputWait.kind === 'ok'){
    if (Math.abs(x - 800) < 200 && Math.abs(y - CHOICE_Y) < 70){ const r = inputWait; inputWait = null; r.resolve(); }
  } else if (inputWait.kind === 'choice'){
    for (let i = 0; i < inputWait.count; i++){ const b = optRect(i, inputWait.count);
      if (Math.abs(x - b.x) < b.w/2 + 10 && Math.abs(y - b.y) < b.h/2 + 14){ const r = inputWait; inputWait = null; r.resolve(i); return; } }
  }
}
function applySettings(){
  source.slow = settings.slow;
  if (!settings.voice && 'speechSynthesis' in window) try { speechSynthesis.cancel(); } catch (e) {}
}

/* ---------------- main loop ---------------- */
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth; vh = window.innerHeight;
  cv.width = Math.round(vw*dpr); cv.height = Math.round(vh*dpr);
  cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
  scale = Math.min(vw/W, vh/H); ox = (vw - W*scale)/2; oy = (vh - H*scale)/2;
  buildScenes();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => buildScenes());
resize();

function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  updateTweens(now);
  source.update(now);
  update(dt, now);

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#8fd3ff'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr*scale, 0, 0, dpr*scale, dpr*ox, dpr*oy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

  if (screen === 'recap'){ drawSceneBase(); drawRecap(); drawSparks(); }
  else {
    drawSceneBase();
    drawSunAndClouds();
    drawMonthDecor();
    drawParts();
    if (screen !== 'menu'){ players.forEach(drawYard); }
    drawCard();
    drawChoices();
    drawOk();
    drawFlyers();
    drawSparks();
    drawCalendar();
    drawTurnBanner();
    drawBannerBig();
    if (screen === 'menu') drawMenu();
    if (paused) drawPause();
  }
  drawTaps(now);
  ctx.restore();

  if (vh > vw*1.05){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `16px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(60,40,20,0.85)';
    ctx.fillText('Turn your phone sideways for a bigger town', vw/2, Math.max(24, oy/2));
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
