<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05061a">
<title>Orbit Bump</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#05061a;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

/* =========================================================
   Orbit Bump — Lightboard kid game #4 (Trouble-style)
   Tap the dome to roll. Roll a 1 or 6 to launch a rocket.
   Race once around the planet ring, then dock at home.
   Land on another rocket to bump it back to its hangar.
   Space stations are safe. A 6 means roll again.
   Board space 1600x900; input = normalized taps via TouchSource.
   ========================================================= */

const W = 1600, H = 900;
const FONT = 'Righteous, "Trebuchet MS", "Segoe UI", system-ui, sans-serif';
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let dpr = 1, scale = 1, ox = 0, oy = 0, vw = 0, vh = 0;

/* ---------------- utils ---------------- */
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(777);
const lerp = (a,b,t) => a + (b-a)*t;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const ease = {
  inOut: t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2,
  out: t => 1 - Math.pow(1-t, 3),
  in: t => t*t,
  lin: t => t,
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }
};
function hexRgb(h){ const n = parseInt(h.slice(1), 16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const [r,g,b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; }
function shade(h,f){ const [r,g,b] = hexRgb(h);
  const m = v => Math.round(clamp(f < 0 ? v*(1+f) : v + (255-v)*f, 0, 255));
  return `rgb(${m(r)},${m(g)},${m(b)})`; }
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function text(str,x,y,size,color,align='center',c=ctx){
  c.font = `${size}px ${FONT}`; c.textAlign = align; c.textBaseline = 'middle'; c.fillStyle = color; c.fillText(str,x,y);
}
function emoji(ch,x,y,size){
  ctx.font = `${size}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(ch,x,y);
}
const glowCache = {};
function glowSprite(color){
  if (glowCache[color]) return glowCache[color];
  const s = 128, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d'), gr = g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0, rgba(color,1)); gr.addColorStop(0.2, rgba(color,0.55)); gr.addColorStop(0.5, rgba(color,0.15)); gr.addColorStop(1, rgba(color,0));
  g.fillStyle = gr; g.fillRect(0,0,s,s); return glowCache[color] = c;
}
function glowTo(c,x,y,r,color,a){ if (a <= 0.003) return; c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = clamp(a,0,1); c.drawImage(glowSprite(color), x-r, y-r, r*2, r*2); c.restore(); }
const glow = (x,y,r,color,a=1) => glowTo(ctx,x,y,r,color,a);

/* ---------------- tweens ---------------- */
const tweens = [];
function tween(ms, fn, e = ease.inOut){ return new Promise(res => tweens.push({ start: performance.now(), ms, fn, e, res })); }
const wait = ms => tween(ms, () => {});
function updateTweens(now){
  for (let i = tweens.length - 1; i >= 0; i--){
    const tw = tweens[i]; const t = Math.min(1, (now - tw.start) / tw.ms);
    tw.fn(tw.e(t)); if (t >= 1){ tweens.splice(i,1); tw.res(); }
  }
}

/* ---------------- settings + audio ---------------- */
const settings = { slow: false, sound: true, voice: true, rockets: 4 };
const sfx = {
  ac: null, master: null,
  unlock(){
    try {
      if (!this.ac){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        this.ac = new AC(); this.master = this.ac.createGain(); this.master.gain.value = 0.5; this.master.connect(this.ac.destination); }
      if (this.ac.state === 'suspended') this.ac.resume();
    } catch (e) {}
  },
  ok(){ return settings.sound && this.ac && this.ac.state === 'running'; },
  tone(f, dur=0.25, type='sine', vol=0.2, when=0, slide=1){
    if (!this.ok()) return;
    const a = this.ac, t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide !== 1) o.frequency.exponentialRampToValueAtTime(f*slide, t+dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.05);
  },
  noise(dur=0.3, vol=0.15, f0=800, f1=800, when=0, type='bandpass'){
    if (!this.ok()) return;
    const a = this.ac, len = Math.max(1, Math.floor(a.sampleRate*dur)), buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random()*2-1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type; f.Q.value = 1;
    const t = a.currentTime + when;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t+dur);
    const g = a.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t+dur+0.05);
  },
  tap(){ this.tone(1400, 0.05, 'square', 0.04); },
  pop(){ this.tone(260, 0.12, 'sine', 0.3, 0, 2.2); this.noise(0.08, 0.12, 3000, 800); },
  rattle(){ for (let i = 0; i < 7; i++) this.tone(900 + Math.random()*700, 0.05, 'square', 0.035, i*0.09); },
  land(){ this.tone(520, 0.14, 'square', 0.07); this.tone(780, 0.18, 'sine', 0.08, 0.05); },
  step(n){ this.noise(0.12, 0.07, 600 + n*120, 2500, 0, 'bandpass'); this.tone(330 + n*55, 0.08, 'triangle', 0.06); },
  launch(){ this.noise(1.0, 0.22, 200, 3000, 0, 'bandpass'); this.tone(110, 0.9, 'sawtooth', 0.06, 0, 4); },
  bump(){ this.tone(1600, 0.45, 'sawtooth', 0.08, 0, 0.08); this.tone(900, 0.4, 'square', 0.05, 0.02, 0.12); this.noise(0.3, 0.15, 4000, 300); },
  dock(){ [784, 988, 1175, 1568].forEach((f,i) => this.tone(f, 0.3, 'triangle', 0.09, i*0.07)); },
  six(){ [523, 784, 1047].forEach((f,i) => this.tone(f, 0.16, 'square', 0.06, i*0.07)); },
  none(){ this.tone(330, 0.2, 'triangle', 0.1); this.tone(262, 0.3, 'triangle', 0.1, 0.18); },
  turn(){ this.tone(880, 0.1, 'sine', 0.08); this.tone(1320, 0.14, 'sine', 0.07, 0.08); },
  blip(){ this.tone(1800 + Math.random()*1200, 0.06, 'sine', 0.02); this.tone(1200 + Math.random()*800, 0.06, 'sine', 0.018, 0.09); },
  win(){ const m = [392, 523, 659, 784, 1047, 1319, 1568];
    m.forEach((f,i) => { this.tone(f, 0.3, 'triangle', 0.1, i*0.09); this.tone(f*1.5, 0.2, 'sine', 0.03, i*0.09 + 0.04); });
    this.noise(1.4, 0.08, 300, 4000, 0.6); },
  start(){ this.launch(); },
  join(i){ this.tone([523,659,784,988][i%4], 0.25, 'square', 0.05, 0, 1.5); }
};
let speechUnlocked = false;
function speak(str){
  if (!settings.voice || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(str); u.rate = 1.05; u.pitch = 1.15; speechSynthesis.speak(u); } catch (e) {}
}
function unlockAll(){
  sfx.unlock();
  if (!speechUnlocked && 'speechSynthesis' in window){ speechUnlocked = true;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {} }
}

/* ---------------- board geometry ---------------- */
const C = { x: 800, y: 470 }, RING_R = 330, NRING = 28, LANE = 4, DOME_R = 66;
const START = [3, 10, 17, 24];
const STATIONS = new Set(START.map(s => (s + 4) % NRING));
const PLANET_COLS = ['#6ec6ff', '#ffb86b', '#b6f27a', '#d9a8ff', '#ff9eb5', '#7ff0e0', '#ffe27a'];
function ringAngle(i){ return -Math.PI/2 + (i + 0.5)*2*Math.PI/NRING; }
function ringPos(i){ const a = ringAngle(i); return { x: C.x + Math.cos(a)*RING_R, y: C.y + Math.sin(a)*RING_R }; }
const LANE_R = [262, 212, 162, 112];
function lanePos(seat, j){ const a = ringAngle(START[seat]); return { x: C.x + Math.cos(a)*LANE_R[j], y: C.y + Math.sin(a)*LANE_R[j] }; }
const HANGAR = [{ x: 1250, y: 175 }, { x: 1250, y: 765 }, { x: 350, y: 765 }, { x: 350, y: 175 }];
const SLOT = [[-34,-30],[34,-30],[-34,30],[34,30]];
function hangarSlot(seat, n){ return { x: HANGAR[seat].x + SLOT[n][0], y: HANGAR[seat].y + SLOT[n][1] }; }
const ringPlanets = [];
for (let i = 0; i < NRING; i++) ringPlanets.push({ col: PLANET_COLS[i % PLANET_COLS.length], ph: R()*6.28, sp: 0.3 + R()*0.6, band: R() < 0.5 });

/* ---------------- decor ---------------- */
const stars = [], comets = [], puffs = [], bursts = [], taps = [];
for (let i = 0; i < 90; i++) stars.push({ x: R()*W, y: R()*H, r: 0.6 + R()*1.8, ph: R()*6.28, sp: 0.6 + R()*2.5 });

/* ---------------- background prerender ---------------- */
const bg = document.createElement('canvas');
function buildBackground(){
  const k = scale*dpr;
  bg.width = Math.max(1, Math.round(W*k)); bg.height = Math.max(1, Math.round(H*k));
  const b = bg.getContext('2d'); b.setTransform(k,0,0,k,0,0);
  const g = b.createRadialGradient(800, 470, 50, 800, 470, 950);
  g.addColorStop(0, '#16163f'); g.addColorStop(1, '#04051a');
  b.fillStyle = g; b.fillRect(0,0,W,H);
  glowTo(b, 260, 300, 420, '#7a3cff', 0.22); glowTo(b, 1350, 620, 460, '#00b3a6', 0.18);
  glowTo(b, 900, 120, 300, '#ff4fa0', 0.12); glowTo(b, 500, 820, 320, '#3c7bff', 0.14);
  const sr = rng(5);
  for (let i = 0; i < 380; i++){ b.fillStyle = `rgba(255,255,255,${0.15 + sr()*0.5})`; b.beginPath(); b.arc(sr()*W, sr()*H, sr()*1.2 + 0.2, 0, Math.PI*2); b.fill(); }
  // orbit line
  b.strokeStyle = 'rgba(160,190,255,0.22)'; b.lineWidth = 3; b.setLineDash([4, 10]);
  b.beginPath(); b.arc(C.x, C.y, RING_R, 0, Math.PI*2); b.stroke(); b.setLineDash([]);
  // gas giant (left)
  const gx = 120, gy = 470;
  b.save(); b.beginPath(); b.arc(gx, gy, 78, 0, Math.PI*2); b.clip();
  const pg = b.createLinearGradient(gx, gy - 78, gx, gy + 78);
  ['#ffcf8a','#f29b5c','#ffd9a8','#e07b4a','#ffc27a','#d8683f'].forEach((c,i,arr) => pg.addColorStop(i/(arr.length-1), c));
  b.fillStyle = pg; b.fillRect(gx - 80, gy - 80, 160, 160);
  b.fillStyle = 'rgba(0,0,30,0.35)'; b.beginPath(); b.arc(gx + 34, gy + 20, 80, 0, Math.PI*2); b.fill();
  b.restore();
  b.strokeStyle = 'rgba(255,220,170,0.7)'; b.lineWidth = 6;
  b.beginPath(); b.ellipse(gx, gy, 120, 26, -0.35, 0.15*Math.PI, 0.95*Math.PI + Math.PI*0.02, true); b.stroke();
}

/* ---------------- input: TouchSource ---------------- */
function toBoard(cx,cy){ return { x: (cx-ox)/scale, y: (cy-oy)/scale }; }
class PointerSource {
  constructor(el){
    this.el = el; this.slow = false; this.dwell = 650; this.active = new Map(); this.handlers = [];
    el.addEventListener('pointerdown', e => this.down(e));
    el.addEventListener('pointermove', e => this.move(e));
    el.addEventListener('pointerup', e => this.up(e));
    el.addEventListener('pointercancel', e => this.active.delete(e.pointerId));
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  onTap(fn){ this.handlers.push(fn); }
  emit(bx,by){ const ev = { x: bx/W, y: by/H, type: 'tap' }; for (const f of this.handlers) f(ev); }
  down(e){
    e.preventDefault(); unlockAll();
    const p = toBoard(e.clientX, e.clientY);
    this.active.set(e.pointerId, { x: p.x, y: p.y, sx: p.x, sy: p.y, start: performance.now(), fired: false, moved: false });
    try { this.el.setPointerCapture(e.pointerId); } catch (_) {}
  }
  move(e){
    const a = this.active.get(e.pointerId); if (!a) return;
    const p = toBoard(e.clientX, e.clientY); a.x = p.x; a.y = p.y;
    if (Math.hypot(a.x-a.sx, a.y-a.sy) > 30){
      if (this.slow){ a.sx = a.x; a.sy = a.y; a.start = performance.now(); a.fired = false; } else a.moved = true;
    }
  }
  up(e){ const a = this.active.get(e.pointerId); this.active.delete(e.pointerId); if (a && !this.slow && !a.moved) this.emit(a.sx, a.sy); }
  update(now){
    if (!this.slow) return;
    for (const a of this.active.values()) if (!a.fired && now - a.start >= this.dwell){ a.fired = true; this.emit(a.sx, a.sy); }
  }
}
const source = new PointerSource(cv);
source.onTap(handleTap);
window.Lightboard = { tap: (nx, ny) => handleTap({ x: nx, y: ny, type: 'tap' }) };

/* ---------------- game state ---------------- */
const PILOTS = [
  { name: 'Flamingo', emoji: '🦩', color: '#ff7eb6' },
  { name: 'Snake',    emoji: '🐍', color: '#57e389' },
  { name: 'Octopus',  emoji: '🐙', color: '#b98cff' },
  { name: 'Monkey',   emoji: '🐵', color: '#ffa94d' }
];
const TILE_X = [440, 680, 920, 1160];
let joined = [true, true, false, false];
let screen = 'menu', paused = false, phase = 'idle';
let players = [], turn = 0, gameId = 0, winner = null, moves = [], lastRoll = 0, statusMsg = '';
const dome = { val: 6, pop: 0, spin: 0, sc: 1 };

/* ---------- pure rules ---------- */
function ringIndexOf(seat, prog){ return (START[seat] + prog) % NRING; }
function occupantsAtRing(ri){
  const out = [];
  for (const pl of players) for (const pc of pl.pieces) if (pc.prog >= 0 && pc.prog < NRING && ringIndexOf(pl.seat, pc.prog) === ri) out.push({ pl, pc });
  return out;
}
function ownBlocked(pl, pc, to){
  if (to < NRING && STATIONS.has(ringIndexOf(pl.seat, to))) return false;
  return pl.pieces.some(q => q !== pc && q.prog === to);
}
function legalMoves(pl, roll){
  const out = []; let launch = false;
  for (const pc of pl.pieces){
    if (pc.prog < 0){
      if ((roll === 6 || roll === 1) && !launch && !ownBlocked(pl, pc, 0)){ out.push({ pc, to: 0 }); launch = true; }
      continue;
    }
    const to = pc.prog + roll;
    if (to > NRING + LANE - 1) continue;
    if (ownBlocked(pl, pc, to)) continue;
    out.push({ pc, to });
  }
  return out;
}
function posOf(pl, pc, prog = pc.prog){
  if (prog < 0) return hangarSlot(pl.seat, pc.n);
  if (prog < NRING) return ringPos(ringIndexOf(pl.seat, prog));
  return lanePos(pl.seat, prog - NRING);
}

function startGame(){
  gameId++;
  players = PILOTS.map((c,i) => ({ ...c, seat: i })).filter(c => joined[c.seat]).map(c => ({
    ...c, pieces: Array.from({ length: settings.rockets }, (_, n) => {
      const p = hangarSlot(c.seat, n); return { n, prog: -1, x: p.x, y: p.y, ang: 0, flame: 0, moving: false, sc: 1 }; })
  }));
  turn = 0; winner = null; moves = []; screen = 'play'; paused = false; phase = 'await'; statusMsg = '';
  sfx.start();
  setTimeout(() => announceTurn(true), 500);
}
function toMenu(){ gameId++; screen = 'menu'; paused = false; phase = 'idle'; players = []; moves = []; }
function announceTurn(first){
  const p = players[turn]; if (!p || screen !== 'play') return;
  sfx.turn(); statusMsg = '';
  speak(first ? `${p.name}, tap the dome to roll!` : `${p.name}'s turn!`);
}

async function doRoll(){
  if (phase !== 'await' || screen !== 'play') return;
  phase = 'busy';
  const gid = gameId, pl = players[turn];
  const val = 1 + Math.floor(Math.random()*6);
  sfx.pop(); sfx.rattle();
  await tween(160, t => { dome.sc = 1 - t*0.12; }, ease.out);
  let lastK = -1;
  await tween(900, t => {
    dome.sc = 0.88 + ease.back(Math.min(1, t*1.4))*0.12; dome.spin = t*Math.PI*3; dome.pop = Math.sin(t*Math.PI*4)*(1 - t)*14;
    const k = Math.floor(t*12); if (k !== lastK){ lastK = k; dome.val = t < 0.9 ? 1 + Math.floor(Math.random()*6) : val; }
  }, ease.out);
  if (gid !== gameId) return;
  dome.val = val; dome.spin = 0; dome.pop = 0; dome.sc = 1; lastRoll = val;
  burstStars(C.x, C.y, pl.color, 18, 220);
  moves = legalMoves(pl, val);
  if (!moves.length){
    const allHome = pl.pieces.every(p => p.prog < 0);
    statusMsg = allHome ? 'Roll a 1 or 6 to launch!' : 'No moves this time';
    speak(`${val}. ${allHome ? 'You need a 1 or a 6 to launch!' : 'No moves this time.'}`); sfx.none();
    await wait(1600);
    if (gid !== gameId) return;
    endTurn(val, gid); return;
  }
  // collapse moves that do the same thing (e.g., several parked rockets)
  if (moves.length === 1){
    speak(String(val)); statusMsg = '';
    phase = 'show'; await wait(700);
    if (gid !== gameId) return;
    await doMove(pl, moves[0], gid); return;
  }
  speak(`${val}! Pick a rocket.`);
  statusMsg = ''; phase = 'choose';
}

async function doMove(pl, mv, gid){
  phase = 'busy'; moves = [];
  const pc = mv.pc;
  pc.moving = true; pc.flame = 1;
  if (pc.prog < 0){
    sfx.launch(); speak(`Blast off, ${pl.name}!`);
    const s = { x: pc.x, y: pc.y }, d = posOf(pl, pc, 0);
    for (let k = 0; k < 10; k++) puffs.push({ x: s.x + (Math.random()-0.5)*30, y: s.y + 20, vx: (Math.random()-0.5)*60, vy: 30 + Math.random()*40, r: 6 + Math.random()*8, life: 0, max: 0.9 });
    await tween(900, t => {
      const q = { x: lerp(s.x, d.x, t), y: lerp(s.y, d.y, t) - Math.sin(Math.PI*t)*140 };
      pc.ang = Math.atan2(q.y - pc.y, q.x - pc.x) + Math.PI/2; pc.x = q.x; pc.y = q.y;
    }, ease.inOut);
    pc.prog = 0;
  } else {
    let n = 0;
    for (let prog = pc.prog + 1; prog <= mv.to; prog++){
      if (gid !== gameId) return;
      const s = { x: pc.x, y: pc.y }, d = posOf(pl, pc, prog);
      const ang = Math.atan2(d.y - s.y, d.x - s.x) + Math.PI/2;
      sfx.step(n++);
      await tween(210, t => { pc.x = lerp(s.x, d.x, t); pc.y = lerp(s.y, d.y, t); pc.ang = lerp(pc.ang, ang, Math.min(1, t*2)); }, ease.inOut);
      pc.prog = prog;
      if (Math.random() < 0.8) puffs.push({ x: pc.x, y: pc.y, vx: 0, vy: 0, r: 5 + Math.random()*5, life: 0, max: 0.6 });
    }
  }
  if (gid !== gameId) return;
  pc.moving = false; pc.flame = 0;
  tween(300, t => { pc.ang = lerp(pc.ang, 0, t); });
  sfx.land(); burstStars(pc.x, pc.y, pl.color, 10, 120);
  // bump?
  if (pc.prog < NRING){
    const ri = ringIndexOf(pl.seat, pc.prog);
    if (!STATIONS.has(ri)){
      const victims = occupantsAtRing(ri).filter(o => o.pl !== pl);
      for (const v of victims){
        speak(`Bump! ${v.pl.name}'s rocket goes back to base!`); sfx.bump();
        burstStars(pc.x, pc.y, '#ffffff', 30, 320); burstStars(pc.x, pc.y, v.pl.color, 20, 260);
        await sendHome(v.pl, v.pc, gid);
        if (gid !== gameId) return;
      }
    } else if (occupantsAtRing(ri).some(o => o.pl !== pl)) { speak('Safe at the space station!'); }
  } else {
    sfx.dock(); if (pc.prog === NRING + LANE - 1 || pl.pieces.filter(q => q.prog >= NRING).length > 0) speak('Docked!');
  }
  if (pl.pieces.every(q => q.prog >= NRING)){ await doWin(pl, gid); return; }
  await wait(350);
  if (gid !== gameId) return;
  endTurn(lastRoll, gid);
}

async function sendHome(pl, pc, gid){
  pc.moving = true;
  const s = { x: pc.x, y: pc.y }; pc.prog = -1; const d = posOf(pl, pc);
  await tween(1000, t => {
    const x = lerp(s.x, d.x, t), y = lerp(s.y, d.y, t) - Math.sin(Math.PI*t)*180;
    pc.x = x + Math.cos(t*12)*30*(1 - t); pc.y = y + Math.sin(t*12)*30*(1 - t); pc.ang = t*Math.PI*6;
  }, ease.inOut);
  pc.ang = 0; pc.moving = false; pc.x = d.x; pc.y = d.y;
}

function endTurn(roll, gid){
  if (gid !== gameId) return;
  if (roll === 6){
    sfx.six(); speak('Six! Roll again!'); statusMsg = 'Six! Roll again!';
    phase = 'await'; return;
  }
  turn = (turn + 1) % players.length;

}

async function doWin(pl, gid){

}

/* ---------------- particles ---------------- */
function burstStars(x, y, color, n, speed){
  for (let i = 0; i < n; i++){
    const a = Math.random()*Math.PI*2, v = speed*(0.3 + Math.random()*0.7);
    bursts.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, rot: Math.random()*6, vr: (Math.random()-0.5)*8, life: 0, max: 0.7 + Math.random()*0.6, color, s: 5 + Math.random()*7 });
  }
}

/* ---------------- update ---------------- */
let T = 0, last = performance.now(), nextBlip = 4;
function update(dt, now){
  T = now/1000;
  for (let i = bursts.length-1; i >= 0; i--){ const b = bursts[i]; b.life += dt; if (b.life > b.max){ bursts.splice(i,1); continue; }
    b.vx *= 0.95; b.vy *= 0.95; b.x += b.vx*dt; b.y += b.vy*dt; b.rot += b.vr*dt; }
  for (let i = puffs.length-1; i >= 0; i--){ const p = puffs[i]; p.life += dt; if (p.life > p.max){ puffs.splice(i,1); continue; } p.x += p.vx*dt; p.y += p.vy*dt; p.r += 14*dt; }
  for (let i = taps.length-1; i >= 0; i--){ taps[i].t += dt; if (taps[i].t > 0.5) taps.splice(i,1); }
  if (Math.random() < dt*0.12) comets.push({ x: Math.random() < 0.5 ? -40 : W + 40, y: 60 + Math.random()*300, dir: 0, life: 0 });
  for (let i = comets.length-1; i >= 0; i--){ const c = comets[i]; if (!c.dir) c.dir = c.x < 0 ? 1 : -1; c.life += dt; c.x += c.dir*420*dt; c.y += 90*dt; if (c.life > 5) comets.splice(i,1); }
  // idle positions with stacking offsets
  for (const pl of players) for (const pc of pl.pieces){
    if (pc.moving) continue;
    let d = posOf(pl, pc);
    if (pc.prog >= 0 && pc.prog < NRING){
      const occ = occupantsAtRing(ringIndexOf(pl.seat, pc.prog)).filter(o => !o.pc.moving);
      if (occ.length > 1){ const k = occ.findIndex(o => o.pc === pc), a = k*2*Math.PI/occ.length; d = { x: d.x + Math.cos(a)*16, y: d.y + Math.sin(a)*12 }; }
    }
    const k = Math.min(1, dt*10); pc.x += (d.x - pc.x)*k; pc.y += (d.y - pc.y)*k;
  }
  if (screen === 'win' && Math.random() < dt*3) burstStars(200 + Math.random()*1200, 100 + Math.random()*600, ['#ff7eb6','#57e389','#b98cff','#ffa94d','#ffe27a'][Math.floor(Math.random()*5)], 18, 220);
  if (T > nextBlip){ sfx.blip(); nextBlip = T + 4 + Math.random()*6; }
}

  });
  drawToggles(628, true);
  pill(800, 772, 320, 100, 'Blast off!', '#ffe27a', joined.some(Boolean), true);
  text(settings.slow ? 'Slow touch acts like the camera: hold still until the ring fills.' : 'Roll a 1 or 6 to launch. Stations are safe. A 6 rolls again.', 800, 852, 21, 'rgba(255,255,255,0.65)');
}
function drawPause(){
  ctx.fillStyle = 'rgba(4,5,26,0.7)'; ctx.fillRect(0, 0, W, H);
  rr(ctx, 360, 190, 880, 520, 40); ctx.fillStyle = 'rgba(14,16,48,0.96)'; ctx.fill();
  ctx.strokeStyle = 'rgba(185,140,255,0.6)'; ctx.lineWidth = 3; ctx.stroke();
  text('Paused', 800, 262, 56, '#ffffff');
  pill(800, 370, 380, 92, 'Keep flying', '#ffe27a', true, true);
  for (const t of TOGGLES) if (t.key !== 'rockets') pill(t.x - 120, 490, 220, 70, settings[t.key] ? t.on : t.off, '#7ff0e0', settings[t.key]);
  pill(800, 610, 380, 80, 'New game', '#ff7eb6', true);
}
function drawWin(){
  ctx.fillStyle = 'rgba(4,5,26,0.45)'; ctx.fillRect(0, 0, W, H);
  const p = winner; if (!p) return;
  const a = T*1.6;
  glow(800, 360, 240, p.color, 0.45);
  drawRocket(800 + Math.cos(a)*170, 360 + Math.sin(a)*70, a + Math.PI, p.color, p.emoji, 1.6, 1, 0.4);
  emoji(p.emoji, 800, 360 - Math.abs(Math.sin(T*3))*20, 150);
  ctx.save(); ctx.font = `64px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = p.color; ctx.shadowBlur = 24; ctx.fillStyle = '#ffffff'; ctx.fillText(`${p.name} wins!`, 800, 540); ctx.restore();
  text('Every rocket docked', 800, 596, 28, rgba(p.color, 1));
  pill(640, 710, 300, 92, 'Play again', '#ffe27a', true, true);
  pill(960, 710, 300, 92, 'Menu', '#7ff0e0', true);
}
function drawTaps(now){
  for (const r of taps){ const k = r.t/0.5; ctx.strokeStyle = `rgba(255,255,255,${0.8*(1-k)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(r.x, r.y, 12 + k*46, 0, Math.PI*2); ctx.stroke(); }
  if (!source.slow) return;
  for (const a of source.active.values()){
    if (a.fired) continue;
    const k = clamp((now - a.start)/source.dwell, 0, 1);
    glow(a.sx, a.sy, 60, '#7ff0e0', 0.2 + k*0.4);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(a.sx, a.sy, 42, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = '#7ff0e0'; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(a.sx, a.sy, 42, -Math.PI/2, -Math.PI/2 + k*Math.PI*2); ctx.stroke(); ctx.lineCap = 'butt';
  }
}

/* ---------------- buttons / taps ---------------- */
function buttons(){
  const B = [];
  if (screen === 'menu'){
    PILOTS.forEach((c,i) => B.push({ x: TILE_X[i], y: 425, w: 214, h: 244, silent: true, on: () => {
      joined[i] = !joined[i]; if (joined[i]){ sfx.join(i); burstStars(TILE_X[i], 400, c.color, 20, 240); } else sfx.tap(); } }));
    for (const t of TOGGLES) B.push({ x: t.x, y: 628, w: 220, h: 76, on: () => {
      if (t.key === 'rockets') settings.rockets = settings.rockets >= 4 ? 2 : settings.rockets + 1; else settings[t.key] = !settings[t.key]; applySettings(); } });
    B.push({ x: 800, y: 772, w: 330, h: 110, on: () => { if (joined.some(Boolean)) startGame(); } });
  } else if (paused){
    B.push({ x: 800, y: 370, w: 390, h: 100, on: () => { paused = false; } });
    for (const t of TOGGLES) if (t.key !== 'rockets') B.push({ x: t.x - 120, y: 490, w: 220, h: 76, on: () => { settings[t.key] = !settings[t.key]; applySettings(); } });
    B.push({ x: 800, y: 610, w: 390, h: 90, on: toMenu });
  } else if (screen === 'play'){
    B.push({ x: 1540, y: 54, w: 96, h: 96, on: () => { paused = true; } });
    if (phase === 'await') B.push({ x: C.x, y: C.y, w: 190, h: 190, silent: true, on: doRoll });
  } else if (screen === 'win'){
    B.push({ x: 640, y: 710, w: 310, h: 100, on: startGame });
    B.push({ x: 960, y: 710, w: 310, h: 100, on: toMenu });
  }
  return B;
}
function handleTap(ev){
  const x = ev.x*W, y = ev.y*H;
  taps.push({ x, y, t: 0 });
  for (const b of buttons()){
    if (Math.abs(x - b.x) <= b.w/2 && Math.abs(y - b.y) <= b.h/2){ if (!b.silent) sfx.tap(); b.on(); return; }
  }
  if (screen === 'play' && !paused && phase === 'choose'){
    const pl = players[turn]; let best = null, bd = 1e9;
    for (const m of moves){
      const d1 = Math.hypot(x - m.pc.x, y - m.pc.y);
      const dp = posOf(pl, m.pc, m.to), d2 = Math.hypot(x - dp.x, y - dp.y);
      const d = Math.min(d1, d2); if (d < 46 && d < bd){ bd = d; best = m; }
    }
    if (!best){ // tapping any parked rocket picks the launch move
      const launch = moves.find(m => m.pc.prog < 0);
      if (launch && pl.pieces.some(pc => pc.prog < 0 && Math.hypot(x - pc.x, y - pc.y) < 46)) best = launch;
    }
    if (best){ sfx.tap(); doMove(pl, best, gameId); }
  }
}
function applySettings(){
  source.slow = settings.slow;
  if (!settings.voice && 'speechSynthesis' in window) try { speechSynthesis.cancel(); } catch (e) {}
}

/* ---------------- main loop ---------------- */
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth; vh = window.innerHeight;
  cv.width = Math.round(vw*dpr); cv.height = Math.round(vh*dpr);
  cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
  scale = Math.min(vw/W, vh/H); ox = (vw - W*scale)/2; oy = (vh - H*scale)/2;
  buildBackground();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  updateTweens(now);
  source.update(now);
  update(dt, now);

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#05061a'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr*scale, 0, 0, dpr*scale, dpr*ox, dpr*oy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

  ctx.drawImage(bg, 0, 0, W, H);
  drawSky();
  drawRing();
  drawDome();
  drawParticles();
  drawPieces();
  drawBanner();
  if (screen === 'menu') drawMenu();
  if (screen === 'win') drawWin();
  if (paused) drawPause();
  drawTaps(now);
  ctx.restore();

  if (vh > vw*1.05){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `16px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillText('Turn your phone sideways for a bigger galaxy', vw/2, Math.max(24, oy/2));
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
