(() => {
'use strict';

/* =========================================================
   Case of the Missing Cupcake — Lightboard kid game #9 (Clue-inspired)
   A co-op animal mystery. Someone took the cupcake! A secret thief
   (an animal), a secret place, and a secret cupcake flavor are picked
   at the start. Detectives take turns searching places for clues.
   Suspect clues are FUN FACTS about the thief ("has a pouch",
   "sleeps upside down"). Tap the suspects that DON'T fit to cross
   them out and learn animal facts. Clues about places and cupcake
   flavors work the same way. When only one answer is left in each
   group, solve the case together!
   Board space 1600x900; input = normalized taps via TouchSource.
   ========================================================= */

const W = 1600, H = 900;
const FONT = '"Patrick Hand", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif';
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let dpr = 1, scale = 1, ox = 0, oy = 0, vw = 0, vh = 0;

/* ---------------- utils ---------------- */
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(90909);
const lerp = (a,b,t) => a + (b-a)*t;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ease = {
  inOut: t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2,
  out: t => 1 - Math.pow(1-t, 3),
  in: t => t*t,
  lin: t => t,
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }
};
function hexRgb(h){ const n = parseInt(h.slice(1), 16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const [r,g,b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; }
function shade(h,f){ const [r,g,b] = hexRgb(h);
  const m = v => Math.round(clamp(f < 0 ? v*(1+f) : v + (255-v)*f, 0, 255));
  return `rgb(${m(r)},${m(g)},${m(b)})`; }
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function text(str,x,y,size,color,align='center'){
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color; ctx.fillText(str,x,y);
}
function outlined(str,x,y,size,fill,stroke,lw=6,align='center'){
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(str,x,y);
  ctx.fillStyle = fill; ctx.fillText(str,x,y);
}
function emoji(ch,x,y,size){
  ctx.font = `${size}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(ch,x,y);
}
function wrapLines(str, maxW, size){
  ctx.font = `${size}px ${FONT}`;
  const words = str.split(' '), lines = []; let line = '';
  for (const w of words){ const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line); return lines;
}
const glowCache = {};
function glowSprite(color){
  if (glowCache[color]) return glowCache[color];
  const s = 128, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d'), gr = g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0, rgba(color,1)); gr.addColorStop(0.2, rgba(color,0.55)); gr.addColorStop(0.5, rgba(color,0.15)); gr.addColorStop(1, rgba(color,0));
  g.fillStyle = gr; g.fillRect(0,0,s,s); return glowCache[color] = c;
}
function glowTo(c,x,y,r,color,a){ if (a <= 0.003 || r <= 0) return; c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = clamp(a,0,1); c.drawImage(glowSprite(color), x-r, y-r, r*2, r*2); c.restore(); }
const glow = (x,y,r,color,a=1) => glowTo(ctx,x,y,r,color,a);
function starPath(c,x,y,r,rot,pts=5,inner=0.45){
  c.beginPath();
  for (let k = 0; k < pts*2; k++){ const a = rot + k*Math.PI/pts, rad = k % 2 ? r*inner : r; c.lineTo(x + Math.cos(a)*rad, y + Math.sin(a)*rad); }
  c.closePath();
}

/* ---------------- tweens ---------------- */
const tweens = [];
function tween(ms, fn, e = ease.inOut){ return new Promise(res => tweens.push({ start: performance.now(), ms, fn, e, res })); }
const wait = ms => tween(ms, () => {});
function updateTweens(now){
  for (let i = tweens.length - 1; i >= 0; i--){
    const tw = tweens[i]; const t = Math.min(1, (now - tw.start) / tw.ms);
    tw.fn(tw.e(t)); if (t >= 1){ tweens.splice(i,1); tw.res(); }
  }
}

/* ---------------- settings + audio ---------------- */
const settings = { slow: false, sound: true, voice: true };
const sfx = {
  ac: null, master: null,
  unlock(){
    try {
      if (!this.ac){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        this.ac = new AC(); this.master = this.ac.createGain(); this.master.gain.value = 0.5; this.master.connect(this.ac.destination); }
      if (this.ac.state === 'suspended') this.ac.resume();
    } catch (e) {}
  },
  ok(){ return settings.sound && this.ac && this.ac.state === 'running'; },
  tone(f, dur=0.25, type='sine', vol=0.2, when=0, slide=1){
    if (!this.ok()) return;
    const a = this.ac, t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide !== 1) o.frequency.exponentialRampToValueAtTime(f*slide, t+dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.05);
  },
  noise(dur=0.3, vol=0.15, f0=800, f1=800, when=0, type='bandpass'){
    if (!this.ok()) return;
    const a = this.ac, len = Math.max(1, Math.floor(a.sampleRate*dur)), buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random()*2-1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type; f.Q.value = 1;
    const t = a.currentTime + when;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t+dur);
    const g = a.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t+dur+0.05);
  },
  tap(){ this.tone(1000, 0.05, 'triangle', 0.06); },
  step(){ this.noise(0.08, 0.07, 500, 250, 0, 'lowpass'); },
  magnify(){ this.tone(500, 0.5, 'sine', 0.06, 0, 2.2); this.tone(1000, 0.3, 'triangle', 0.04, 0.2); },
  clue(){ this.noise(0.25, 0.1, 900, 4000); [784, 988, 1319].forEach((f,i) => this.tone(f, 0.28, 'triangle', 0.09, 0.15 + i*0.07)); },
  cross(){ this.noise(0.18, 0.1, 2500, 1500, 0, 'highpass'); this.tone(880, 0.16, 'triangle', 0.1, 0.05); this.tone(1175, 0.22, 'triangle', 0.09, 0.14); },
  keep(){ this.tone(330, 0.16, 'triangle', 0.1); this.tone(294, 0.22, 'triangle', 0.1, 0.12); },
  help(){ [523, 659].forEach((f,i) => this.tone(f, 0.15, 'triangle', 0.08, i*0.08)); },
  done(){ [523, 659, 784, 1047].forEach((f,i) => this.tone(f, 0.22, 'triangle', 0.1, i*0.07)); },
  lock(){ this.tone(1568, 0.5, 'sine', 0.08); this.tone(2093, 0.6, 'sine', 0.06, 0.08); },
  drum(){ for (let i = 0; i < 14; i++) this.noise(0.06, 0.16 - i*0.006, 180, 110, i*0.07, 'lowpass'); },
  ta(){ [523, 659, 784, 1047].forEach((f,i) => { this.tone(f, 0.5, 'triangle', 0.1, i*0.02); this.tone(f/2, 0.5, 'sine', 0.06, i*0.02); }); },
  sorry(){ this.tone(392, 0.25, 'triangle', 0.09); this.tone(330, 0.4, 'triangle', 0.09, 0.22); },
  hearts(){ [988, 1319, 1568, 1976].forEach((f,i) => this.tone(f, 0.25, 'sine', 0.07, i*0.09)); },
  turn(){ this.tone(660, 0.12, 'triangle', 0.08); this.tone(990, 0.18, 'triangle', 0.07, 0.09); },
  win(){ const m = [523, 659, 784, 659, 784, 1047, 988, 1319];
    m.forEach((f,i) => { this.tone(f, 0.28, 'triangle', 0.1, i*0.12); this.tone(f/2, 0.28, 'sine', 0.07, i*0.12); });
    for (let i = 0; i < 12; i++) this.tone(1800 + Math.random()*2000, 0.16, 'sine', 0.04, 1.2 + i*0.07); },
  start(){ [392, 494, 587, 784].forEach((f,i) => this.tone(f, 0.24, 'triangle', 0.08, i*0.09)); },
  join(i){ this.tone([523, 659, 784, 988][i%4], 0.22, 'triangle', 0.11, 0, 1.4); },
  chirp(){ const f = 2400 + Math.random()*900; this.tone(f, 0.07, 'sine', 0.025, 0, 1.3); this.tone(f*1.15, 0.07, 'sine', 0.02, 0.09, 1.3); }
};
let speechUnlocked = false;
function speak(str){
  if (!settings.voice || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(str); u.rate = 1.0; u.pitch = 1.15; speechSynthesis.speak(u); } catch (e) {}
}
function unlockAll(){
  sfx.unlock();
  if (!speechUnlocked && 'speechSynthesis' in window){ speechUnlocked = true;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {} }
}

const CATS = {

/* ---------- pure rules ---------- */
function fits(attrId, candId){ return ATTRS[attrId].set.includes(candId); }
function planClues(cat, culprit){
  const all = CATS[cat].ids, facts = Object.keys(ATTRS).filter(k => ATTRS[k].cat === cat && fits(k, culprit));
  for (let tries = 0; tries < 400; tries++){
    const order = shuffle(facts); let rem = all.slice(), seq = [];
    for (const f of order){ const nr = rem.filter(c => fits(f, c)); if (nr.length < rem.length){ rem = nr; seq.push(f); } if (rem.length === 1) break; }
    if (rem.length === 1 && seq.length >= 2 && seq.length <= 4) return seq;
  }
  // fallback: any solving sequence
  let rem = all.slice(), seq = [];
  for (const f of facts){ const nr = rem.filter(c => fits(f, c)); if (nr.length < rem.length){ rem = nr; seq.push(f); } if (rem.length === 1) break; }
  return seq;
}
function newCase(){
  const c = { who: pick(ANIMALS).id, where: pick(PLACES).id, what: pick(FLAVORS).id };
  const plan = { who: planClues('who', c.who), where: planClues('where', c.where), what: planClues('what', c.what) };
  const queue = shuffle([...plan.who, ...plan.where, ...plan.what]);
  return { c, plan, queue, planned: queue.length };
}

}

/* ---------------- input: TouchSource ---------------- */
function toBoard(cx,cy){ return { x: (cx-ox)/scale, y: (cy-oy)/scale }; }
class PointerSource {
  constructor(el){
    this.el = el; this.slow = false; this.dwell = 650; this.active = new Map(); this.handlers = [];
    el.addEventListener('pointerdown', e => this.down(e));
    el.addEventListener('pointermove', e => this.move(e));
    el.addEventListener('pointerup', e => this.up(e));
    el.addEventListener('pointercancel', e => this.active.delete(e.pointerId));
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  onTap(fn){ this.handlers.push(fn); }
  emit(bx,by){ const ev = { x: bx/W, y: by/H, type: 'tap' }; for (const f of this.handlers) f(ev); }
  down(e){
    e.preventDefault(); unlockAll();
    const p = toBoard(e.clientX, e.clientY);
    this.active.set(e.pointerId, { x: p.x, y: p.y, sx: p.x, sy: p.y, start: performance.now(), fired: false, moved: false });
    try { this.el.setPointerCapture(e.pointerId); } catch (_) {}
  }
  move(e){
    const a = this.active.get(e.pointerId); if (!a) return;
    const p = toBoard(e.clientX, e.clientY); a.x = p.x; a.y = p.y;
    if (Math.hypot(a.x-a.sx, a.y-a.sy) > 30){
      if (this.slow){ a.sx = a.x; a.sy = a.y; a.start = performance.now(); a.fired = false; } else a.moved = true;
    }
  }
  up(e){ const a = this.active.get(e.pointerId); this.active.delete(e.pointerId); if (a && !this.slow && !a.moved) this.emit(a.sx, a.sy); }
  update(now){
    if (!this.slow) return;
    for (const a of this.active.values()) if (!a.fired && now - a.start >= this.dwell){ a.fired = true; this.emit(a.sx, a.sy); }
  }
}
const source = new PointerSource(cv);
source.onTap(handleTap);
window.Lightboard = { tap: (nx, ny) => handleTap({ x: nx, y: ny, type: 'tap' }) };

function startGame(){
  gameId++; const gid = gameId;
  dets = DETECTIVES.map((c, i) => ({ ...c, seat: i })).filter(c => joined[c.seat]);
  const cs = newCase(); C = cs.c; planned = cs.planned; queue = cs.queue.slice();
  alive = { who: CATS.who.ids.slice(), where: CATS.where.ids.slice(), what: CATS.what.ids.slice() };
  crossAnim = {}; for (const cat in CATS) for (const id of CATS[cat].ids) crossAnim[id] = { t: 0, shake: 0, sink: 0 };
  clueLog = []; clueCount = 0; visits = {}; PLACES.forEach(p => visits[p.id] = 0);
  turn = 0; statusMsg = ''; cross = null; sprite = null; cardAnim = null; accuse = null; reveal = null; results = null; ready = false;
  screen = 'play'; paused = false; phase = 'busy';
  sfx.start(); playCase(gid);
}
function toMenu(){ gameId++; screen = 'menu'; paused = false; phase = 'idle'; dets = []; cross = null; sprite = null; cardAnim = null; accuse = null; reveal = null; results = null; pickRes = null; }

async function playCase(gid){
  await wait(700);
  speak('Oh no! Someone took the cupcake! Detectives, let us find the thief!');
  await wait(3000);
  while (true){
    if (gid !== gameId) return;
    phase = 'pick'; sfx.turn(); statusMsg = '';
    if (dets.length > 1 || clueCount === 0) speak(clueCount === 0 ? `${dets[turn].name}, tap a place to search for clues!` : `${dets[turn].name}'s turn. Where will you search?`);
    const choice = await new Promise(res => { pickRes = res; });
    if (gid !== gameId) return;
    if (choice === 'accuse'){
      const ok = await accuseFlow(gid); if (gid !== gameId) return;
      if (ok){ await revealCase(gid); return; }
      continue;
    }
    const opened = await visit(choice, gid); if (gid !== gameId) return;
    if (opened === 'accuse'){ const ok = await accuseFlow(gid); if (gid !== gameId) return; if (ok){ await revealCase(gid); return; } continue; }
    turn = (turn + 1) % dets.length;
  }
}

async function visit(placeId, gid){
  phase = 'busy';
  const d = dets[turn], idx = PLACES.findIndex(p => p.id === placeId), pr = placeRect(idx);
  if (!queue.length){ speak('No more clues to find! Time to solve the case!'); await wait(2200); return 'accuse'; }
  visits[placeId]++;
  // walk
  const sx = 150 + turn*0 + (800 - (dets.length - 1)*100/2*0) , sy = 60;
  const bx = bannerChipX(turn), by = 52;
  const spr = sprite = { d, x: bx, y: by, s: 1, mag: 0, walk: true };
  speak(`${d.name} searches the ${NAME[placeId].name}!`);
  await tween(900, t => { spr.x = lerp(bx, pr.x - 70, t); spr.y = lerp(by, pr.y + 20, t) - Math.sin(Math.PI*t)*40; if (Math.random() < 0.15) sfx.step(); }, ease.inOut);
  if (gid !== gameId) return;
  spr.walk = false; sfx.magnify();
  await tween(1100, t => { spr.mag = t; }, ease.lin);
  if (gid !== gameId) return;
  // clue
  const attr = queue.shift(), A = ATTRS[attr];
  clueCount++;
  cardAnim = { attr, x: pr.x, y: pr.y, s: 0.2, flip: 0, w: 620, h: 360 };
  const ca = cardAnim;
  sfx.clue(); sparkle(pr.x, pr.y, '#ffe27a', 24, 260);
  await tween(650, t => { ca.x = lerp(pr.x, MAPC.x, t); ca.y = lerp(pr.y, MAPC.y - 20, t); ca.s = 0.2 + 0.8*ease.back(t); }, ease.out);
  if (gid !== gameId) return;
  speak(`Clue! ${A.text}`);
  await wait(2400);
  if (gid !== gameId) return;
  // cross out
  const cat = A.cat;
  const nonfit = () => alive[cat].filter(id => !fits(attr, id));
  cross = { attr, cat, idle: 0, first: true };
  if (nonfit().length === 0){
    speak('We already knew that one!'); await wait(1800);
  } else {
    tween(500, t => { ca.x = lerp(MAPC.x, MAPC.x, t); ca.y = lerp(MAPC.y - 20, MAPC.y - 20, t); ca.s = lerp(1, 0.001, t); }).then(() => {});
    phase = 'cross';
    speak(cat === 'who' ? 'Tap the animals that do NOT match!' : cat === 'where' ? 'Tap the places that do NOT match!' : 'Tap the cupcakes that do NOT match!');
    await new Promise(res => { cross.done = res; });
    if (gid !== gameId) return;
    phase = 'busy'; sfx.done();
  }
  cardAnim = null; sprite = null;
  clueLog.push({ attr, born: performance.now()/1000 });
  cross = null;
  statusMsg = '';
  if (alive.who.length === 1 && alive.where.length === 1 && alive.what.length === 1 && !ready){
    ready = true; sfx.lock(); speak('We know everything! Press Solve the case!');
    sparkle(SOLVE_BTN.x, SOLVE_BTN.y, '#ffe27a', 40, 400);
    await wait(2600);
  } else await wait(600);
  return 'ok';
}

function crossOut(cat, id, auto){
  const i = alive[cat].indexOf(id); if (i < 0) return;
  alive[cat].splice(i, 1);
  const ca = crossAnim[id]; sfx.cross();
  tween(600, t => { ca.t = t; }, ease.out);
  const r = rectOf(cat, id); sparkle(r.x, r.y, '#ff6a5f', 14, 220);
  pops.push({ x: r.x, y: r.y - r.h/2 - 6, str: 'Not the ' + NAME[id].name + '!', t: 0, color: '#ff6a5f' });
  const A = ATTRS[cross.attr];
  let line = `Not the ${NAME[id].name}!`;
  if (cat === 'who' && cross.first){ line += ' ' + NAME[id].fun; cross.first = false; }
  speak(line);
  cross.idle = 0;
  const left = alive[cat].filter(k => !fits(cross.attr, k));
  if (left.length === 0 && cross.done){ const d = cross.done; cross.done = null; setTimeout(() => d(), 900); }
}
function wrongTap(cat, id){
  const ca = crossAnim[id]; sfx.keep(); tween(500, t => { ca.shake = 1 - t; }, ease.lin);
  speak(`The ${NAME[id].name} does fit! Keep it in the case!`);
  const r = rectOf(cat, id); pops.push({ x: r.x, y: r.y - r.h/2 - 6, str: 'Keep it!', t: 0, color: '#3fae5a' });
  if (cross) cross.idle = 0;
}
function helpOne(){
  if (!cross || phase !== 'cross') return;
  const left = alive[cross.cat].filter(k => !fits(cross.attr, k)); if (!left.length) return;
  sfx.help(); crossOut(cross.cat, left[0], true);
}

/* ---------------- accusation ---------------- */
async function accuseFlow(gid){
  const sel = {};
  for (const cat in CATS) if (alive[cat].length === 1) sel[cat] = alive[cat][0];
  if (alive.who.length === 1 && alive.where.length === 1 && alive.what.length === 1){ return checkAccusation(sel); }
  accuse = { sel, msg: '' }; phase = 'accuse';
  speak('Pick who, where, and which cupcake. Then tap Accuse!');
  const ok = await new Promise(res => { accuse.res = res; });
  accuse = null;
  return ok;
}
function checkAccusation(sel){
  const okAll = sel.who === C.who && sel.where === C.where && sel.what === C.what;
  if (okAll) return true;
  // gentle correction: cross out wrong picks
  const wrong = [];
  for (const cat of ['who', 'where', 'what']) if (sel[cat] && sel[cat] !== C[cat] && alive[cat].includes(sel[cat])) wrong.push([cat, sel[cat]]);
  sfx.keep();
  speak(wrong.length ? `Not quite! It was not the ${NAME[wrong[0][1]].name}. Keep investigating!` : 'Not quite! Keep investigating!');
  for (const [cat, id] of wrong){ const i = alive[cat].indexOf(id); if (i >= 0){ alive[cat].splice(i, 1); const ca = crossAnim[id]; tween(600, t => { ca.t = t; }, ease.out); } }
  return false;
}

/* ---------------- reveal ---------------- */
async function revealCase(gid){
  phase = 'busy'; screen = 'reveal';
  const rv = reveal = { flip: [0, 0, 0], sorry: 0, share: 0, dim: 0 };
  await tween(500, t => { rv.dim = t; });
  speak('The case is solved! The thief is...'); sfx.drum();
  await wait(1900); if (gid !== gameId) return;
  for (let i = 0; i < 3; i++){
    sfx.ta(); await tween(650, t => { rv.flip[i] = t; }, ease.out); if (gid !== gameId) return;
    const cat = ['who', 'where', 'what'][i];
    const line = i === 0 ? `the ${NAME[C.who].name}!` : i === 1 ? `in the ${NAME[C.where].name}!` : `with a ${NAME[C.what].name} cupcake!`;
    speak(line); sparkle(560 + i*240 + 240, 360, '#ffe27a', 30, 320);
    await wait(2000);
  }
  speak(`The ${NAME[C.who].name} says sorry, and shares the cupcake with everyone!`);
  sfx.sorry();
  await tween(1200, t => { rv.sorry = t; }, ease.inOut); if (gid !== gameId) return;
  sfx.hearts();
  await tween(1800, t => { rv.share = t; }, ease.inOut); if (gid !== gameId) return;
  const used = clueCount, stars = used <= planned + 1 ? 3 : used <= planned + 3 ? 2 : 1;
  const rs = results = { stars, used, t: 0 };
  screen = 'results'; phase = 'results'; sfx.win();
  speak(`Case closed! You used ${used} clues. Great detective work!`);
  for (let i = 0; i < 70; i++) confetti.push({ x: Math.random()*W, y: -Math.random()*300, vx: (Math.random()-0.5)*80, vy: 100 + Math.random()*180, rot: Math.random()*6, vr: (Math.random()-0.5)*8, col: pick(['#ffd23a', '#ff6a5f', '#5ee6d0', '#b98cff', '#ffffff']), s: 8 + Math.random()*8 });
  await tween(1400, t => { rs.t = t; }, ease.out);
}

/* ---------------- effects ---------------- */
function sparkle(x, y, color, n, speed){
  for (let i = 0; i < n; i++){ const a = Math.random()*Math.PI*2, v = speed*(0.3 + Math.random()*0.7);
    sparks.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - speed*0.2, life: 0, max: 0.5 + Math.random()*0.6, s: 4 + Math.random()*7, col: color }); }
}

/* ---------------- update ---------------- */
let T = 0, last = performance.now(), nextAmb = 3;
function update(dt, now){
  T = now/1000;
  for (const c of clouds){ c.x += c.sp*dt; if (c.x > W + 200) c.x = -200; }
  for (const w of walkers){ w.x += w.sp*dt; if (w.x > W + 30) w.x = -30; }
  if (cross && phase === 'cross'){ cross.idle += dt; }
  for (let i = sparks.length - 1; i >= 0; i--){ const s = sparks[i]; s.life += dt; if (s.life > s.max){ sparks.splice(i, 1); continue; } s.vx *= 0.96; s.vy = s.vy*0.96 + 60*dt; s.x += s.vx*dt; s.y += s.vy*dt; }
  for (let i = pops.length - 1; i >= 0; i--){ pops[i].t += dt; if (pops[i].t > 1.3) pops.splice(i, 1); }
  for (let i = taps.length - 1; i >= 0; i--){ taps[i].t += dt; if (taps[i].t > 0.5) taps.splice(i, 1); }
  for (let i = confetti.length - 1; i >= 0; i--){ const c = confetti[i]; c.x += (c.vx + Math.sin(T*3 + c.rot)*30)*dt; c.y += c.vy*dt; c.rot += c.vr*dt; if (c.y > H + 30) confetti.splice(i, 1); }
  if (screen === 'results' && Math.random() < dt*5) confetti.push({ x: Math.random()*W, y: -20, vx: 0, vy: 130 + Math.random()*120, rot: Math.random()*6, vr: 5, col: pick(['#ffd23a', '#ff6a5f', '#5ee6d0', '#b98cff']), s: 8 + Math.random()*8 });
  if (T > nextAmb){ sfx.chirp(); nextAmb = T + 3 + Math.random()*4; }
}

function crossPulse(cat, id){

}
function drawPause(){
  ctx.fillStyle = 'rgba(30,18,8,0.72)'; ctx.fillRect(0, 0, W, H);
  rr(ctx, 380, 190, 840, 520, 44); ctx.fillStyle = 'rgba(255,247,226,0.98)'; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = '#d9a83a'; ctx.stroke();
  outlined('Paused', 800, 262, 76, '#ffb347', '#ffffff', 12);
  pill(800, 370, 380, 92, 'Keep going', '#ffb347', true, true);
  for (const t of TOGGLES) pill(t.x, 490, 226, 70, settings[t.key] ? t.on : t.off, '#3fae5a', settings[t.key]);
  pill(800, 610, 380, 80, 'New case', '#ff6a5f', true);
}
function drawEffects(){
  for (const s of sparks){ const k = 1 - s.life/s.max; glow(s.x, s.y, s.s*2.4*k + 2, s.col, k*0.6); starPath(ctx, s.x, s.y, s.s*k + 1, s.life*6, 4, 0.4); ctx.fillStyle = rgba(s.col, k); ctx.fill(); }
  for (const q of pops){ const k = q.t/1.3, sc = q.t < 0.15 ? ease.back(q.t/0.15) : 1; ctx.save(); ctx.globalAlpha = 1 - Math.max(0, (k - 0.6)/0.4); ctx.translate(q.x, q.y - k*36); ctx.scale(sc, sc); outlined(q.str, 0, 0, 34, '#ffffff', q.color, 8); ctx.restore(); }
  for (const c of confetti){ ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.scale(Math.cos(c.rot*1.7), 1); ctx.fillStyle = c.col; ctx.fillRect(-c.s/2, -c.s/3, c.s, c.s*0.66); ctx.restore(); }
}
function drawTaps(now){
  for (const r of taps){ const k = r.t/0.5; ctx.strokeStyle = `rgba(255,255,255,${0.8*(1-k)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(r.x, r.y, 12 + k*46, 0, Math.PI*2); ctx.stroke(); }
  if (!source.slow) return;
  for (const a of source.active.values()){
    if (a.fired) continue;
    const k = clamp((now - a.start)/source.dwell, 0, 1);
    glow(a.sx, a.sy, 60, '#ffb347', 0.2 + k*0.4);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(a.sx, a.sy, 42, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = '#ffb347'; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(a.sx, a.sy, 42, -Math.PI/2, -Math.PI/2 + k*Math.PI*2); ctx.stroke(); ctx.lineCap = 'butt';
  }
}

/* ---------------- buttons / taps ---------------- */
function buttons(){
  const B = [];
  if (screen === 'menu'){
    DETECTIVES.forEach((c, i) => B.push({ x: TILE_X[i], y: 450, w: 214, h: 240, silent: true, on: () => {
      joined[i] = !joined[i]; if (joined[i]){ sfx.join(i); sparkle(TILE_X[i], 430, c.color, 22, 260); } else sfx.tap(); } }));
    for (const t of TOGGLES) B.push({ x: t.x, y: 660, w: 226, h: 76, on: () => { settings[t.key] = !settings[t.key]; applySettings(); } });
    B.push({ x: 800, y: 786, w: 410, h: 110, on: () => { if (joined.some(Boolean)) startGame(); } });
  } else if (paused){
    B.push({ x: 800, y: 370, w: 390, h: 100, on: () => { paused = false; } });
    for (const t of TOGGLES) B.push({ x: t.x, y: 490, w: 226, h: 76, on: () => { settings[t.key] = !settings[t.key]; applySettings(); } });
    B.push({ x: 800, y: 610, w: 390, h: 90, on: startGame });
  } else if (screen === 'results'){
    B.push({ x: 640, y: 630, w: 310, h: 92, on: startGame }); B.push({ x: 960, y: 630, w: 310, h: 92, on: toMenu });
  } else if (screen === 'play'){
    B.push({ x: 1540, y: 54, w: 96, h: 96, on: () => { paused = true; } });
    if (phase === 'accuse' && accuse){
      B.push({ x: 1050, y: 762, w: 350, h: 84, on: () => { const s = accuse.sel; if (!['who', 'where', 'what'].every(c => s[c])) return; const r = accuse.res; const ok = checkAccusation(s); r(ok); } });
      B.push({ x: 550, y: 762, w: 270, h: 76, on: () => { const r = accuse.res; r(false); } });
    }
    if (phase === 'cross' && cross) B.push({ x: HELP_BTN.x, y: HELP_BTN.y, w: HELP_BTN.w + 20, h: HELP_BTN.h + 20, on: helpOne });
    if (phase === 'pick') B.push({ x: SOLVE_BTN.x, y: SOLVE_BTN.y, w: SOLVE_BTN.w + 20, h: SOLVE_BTN.h + 20, silent: true, on: () => { sfx.tap(); if (pickRes){ const r = pickRes; pickRes = null; r('accuse'); } } });
  }
  return B;
}
function handleTap(ev){
  const x = ev.x*W, y = ev.y*H;
  taps.push({ x, y, t: 0 });
  for (const b of buttons()){
    if (Math.abs(x - b.x) <= b.w/2 && Math.abs(y - b.y) <= b.h/2){ if (!b.silent) sfx.tap(); b.on(); return; }
  }
  if (screen !== 'play' || paused) return;
  if (phase === 'accuse' && accuse){
    for (const cat of ['who', 'where', 'what']){
      const ids = alive[cat], n = ids.length, sp = Math.min(150, 940/Math.max(1, n)), yy = { who: 290, where: 480, what: 660 }[cat];
      ids.forEach((id, k) => { const cx = 800 - (n-1)*sp/2 + k*sp; if (Math.abs(x - cx) < 68 && Math.abs(y - yy) < 58){ accuse.sel[cat] = id; sfx.tap(); } });
    }
  } else if (phase === 'pick' && pickRes){
    PLACES.forEach((p, i) => { const r = placeRect(i); if (Math.abs(x - r.x) < r.w/2 && Math.abs(y - r.y) < r.h/2){ sfx.tap(); const res = pickRes; pickRes = null; res(p.id); } });
  } else if (phase === 'cross' && cross){
    const cat = cross.cat;
    for (const id of alive[cat].slice()){ const r = rectOf(cat, id); if (Math.abs(x - r.x) < r.w/2 && Math.abs(y - r.y) < r.h/2){ if (fits(cross.attr, id)) wrongTap(cat, id); else crossOut(cat, id, false); return; } }
  }
}
function applySettings(){
  source.slow = settings.slow;
  if (!settings.voice && 'speechSynthesis' in window) try { speechSynthesis.cancel(); } catch (e) {}
}

/* ---------------- main loop ---------------- */
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth; vh = window.innerHeight;
  cv.width = Math.round(vw*dpr); cv.height = Math.round(vh*dpr);
  cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
  scale = Math.min(vw/W, vh/H); ox = (vw - W*scale)/2; oy = (vh - H*scale)/2;
  buildBackground();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  updateTweens(now);
  source.update(now);
  if (!paused) update(dt, now); else T = now/1000;

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#5a3a24'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr*scale, 0, 0, dpr*scale, dpr*ox, dpr*oy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

  if (screen === 'menu'){ if (!alive){ alive = { who: CATS.who.ids.slice(), where: CATS.where.ids.slice(), what: CATS.what.ids.slice() }; crossAnim = {}; for (const cat in CATS) for (const id of CATS[cat].ids) crossAnim[id] = { t: 0, shake: 0, sink: 0 }; }
    drawBoards(); drawMenu(); }
  else {
    drawBoards(); drawSprite(); drawClueCard(); drawCrossBar(); drawButtons(); drawBanner();
    if (screen === 'reveal' || screen === 'results') drawReveal();
    if (screen === 'results') drawResults();
    if (phase === 'accuse') drawAccuse();
  }
  drawEffects();
  if (paused) drawPause();
  drawTaps(now);
  ctx.restore();

  if (vh > vw*1.05){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `20px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText('Turn your phone sideways for a bigger case board', vw/2, Math.max(24, oy/2));
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
