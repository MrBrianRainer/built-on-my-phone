<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

/* =========================================================
   Wizard Race — Lightboard kid game #5 (Sorry!-style)
   Draw a spell card, cast it, race the wizards around the
   castle hall. Spells hop you ahead, swap places, zap a rival
   into a frog, shield you, or blow you back with a whoops wind.
   Board space 1600x900; input = normalized taps via TouchSource.
   ========================================================= */

const W = 1600, H = 900;
const FONT = 'MedievalSharp, "Palatino Linotype", "Book Antiqua", Georgia, serif';
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let dpr = 1, scale = 1, ox = 0, oy = 0, vw = 0, vh = 0;

/* ---------------- utils ---------------- */
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(1313);
const lerp = (a,b,t) => a + (b-a)*t;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const ease = {
  inOut: t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2,
  out: t => 1 - Math.pow(1-t, 3),
  in: t => t*t,
  lin: t => t,
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }
};
function hexRgb(h){ const n = parseInt(h.slice(1), 16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const [r,g,b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; }
function shade(h,f){ const [r,g,b] = hexRgb(h);
  const m = v => Math.round(clamp(f < 0 ? v*(1+f) : v + (255-v)*f, 0, 255));
  return `rgb(${m(r)},${m(g)},${m(b)})`; }
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function text(str,x,y,size,color,align='center'){
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color; ctx.fillText(str,x,y);
}
function outlined(str,x,y,size,fill,stroke,lw=6,align='center'){
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(str,x,y);
  ctx.fillStyle = fill; ctx.fillText(str,x,y);
}
function emoji(ch,x,y,size){
  ctx.font = `${size}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(ch,x,y);
}
const glowCache = {};
function glowSprite(color){
  if (glowCache[color]) return glowCache[color];
  const s = 128, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d'), gr = g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0, rgba(color,1)); gr.addColorStop(0.2, rgba(color,0.55)); gr.addColorStop(0.5, rgba(color,0.15)); gr.addColorStop(1, rgba(color,0));
  g.fillStyle = gr; g.fillRect(0,0,s,s); return glowCache[color] = c;
}
function glowTo(c,x,y,r,color,a){ if (a <= 0.003 || r <= 0) return; c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = clamp(a,0,1); c.drawImage(glowSprite(color), x-r, y-r, r*2, r*2); c.restore(); }
const glow = (x,y,r,color,a=1) => glowTo(ctx,x,y,r,color,a);
function starPath(c,x,y,r,rot,pts=4,inner=0.42){
  c.beginPath();
  for (let k = 0; k < pts*2; k++){ const a = rot + k*Math.PI/pts, rad = k % 2 ? r*inner : r; c.lineTo(x + Math.cos(a)*rad, y + Math.sin(a)*rad); }
  c.closePath();
}

/* ---------------- tweens ---------------- */
const tweens = [];
function tween(ms, fn, e = ease.inOut){ return new Promise(res => tweens.push({ start: performance.now(), ms, fn, e, res })); }
const wait = ms => tween(ms, () => {});
function updateTweens(now){
  for (let i = tweens.length - 1; i >= 0; i--){
    const tw = tweens[i]; const t = Math.min(1, (now - tw.start) / tw.ms);
    tw.fn(tw.e(t)); if (t >= 1){ tweens.splice(i,1); tw.res(); }
  }
}

/* ---------------- settings + audio ---------------- */
const settings = { slow: false, sound: true, voice: true, laps: 2 };
const sfx = {
  ac: null, master: null,
  unlock(){
    try {
      if (!this.ac){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        this.ac = new AC(); this.master = this.ac.createGain(); this.master.gain.value = 0.5; this.master.connect(this.ac.destination); }
      if (this.ac.state === 'suspended') this.ac.resume();
    } catch (e) {}
  },
  ok(){ return settings.sound && this.ac && this.ac.state === 'running'; },
  tone(f, dur=0.25, type='sine', vol=0.2, when=0, slide=1){
    if (!this.ok()) return;
    const a = this.ac, t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide !== 1) o.frequency.exponentialRampToValueAtTime(f*slide, t+dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.05);
  },
  noise(dur=0.3, vol=0.15, f0=800, f1=800, when=0, type='bandpass'){
    if (!this.ok()) return;
    const a = this.ac, len = Math.max(1, Math.floor(a.sampleRate*dur)), buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random()*2-1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type; f.Q.value = 1;
    const t = a.currentTime + when;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t+dur);
    const g = a.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t+dur+0.05);
  },
  tap(){ this.tone(1200, 0.06, 'triangle', 0.06); },
  draw(){ this.noise(0.4, 0.1, 500, 3800); [1319, 1760, 2349].forEach((f,i) => this.tone(f, 0.3, 'sine', 0.06, 0.15 + i*0.06)); },
  reveal(){ [659, 784, 988, 1319].forEach((f,i) => this.tone(f, 0.5, 'triangle', 0.09, i*0.06)); },
  step(n){ const s = [523, 587, 659, 784, 880, 988, 1175, 1319]; const f = s[n % s.length];
    this.tone(f, 0.16, 'triangle', 0.13); this.tone(f*2, 0.08, 'sine', 0.035); },
  back(n){ const s = [880, 784, 659, 587, 523, 440]; this.tone(s[n % s.length], 0.16, 'triangle', 0.1, 0, 0.9); },
  land(){ this.tone(392, 0.16, 'triangle', 0.1); this.tone(587, 0.22, 'sine', 0.08, 0.06); },
  star(){ [1568, 2093, 2637, 3136].forEach((f,i) => this.tone(f, 0.28, 'sine', 0.05, i*0.05)); },
  zapCharge(){ this.tone(300, 0.35, 'sawtooth', 0.05, 0, 4); },
  zap(){ this.noise(0.4, 0.22, 6000, 500, 0, 'bandpass'); this.tone(1800, 0.35, 'sawtooth', 0.09, 0, 0.12); this.tone(2400, 0.2, 'square', 0.04, 0.02, 0.2); },
  poof(){ this.noise(0.4, 0.2, 1500, 200, 0, 'lowpass'); this.tone(500, 0.18, 'sine', 0.1, 0, 0.4); },
  ribbit(){ this.tone(140, 0.16, 'sawtooth', 0.07, 0, 0.8); this.tone(120, 0.14, 'sawtooth', 0.06, 0.18, 0.8); },
  swap(){ for (let i = 0; i < 12; i++) this.tone(400*Math.pow(2, i/6), 0.14, 'sine', 0.06, i*0.07); },
  shield(){ [880, 1319, 1760].forEach((f,i) => this.tone(f, 0.7, 'sine', 0.08, i*0.09)); this.tone(220, 0.6, 'triangle', 0.08); },
  bonk(){ this.tone(1000, 0.25, 'triangle', 0.14, 0, 0.35); this.noise(0.15, 0.1, 3000, 800); },
  wind(){ this.noise(1.3, 0.25, 250, 1800, 0, 'bandpass'); this.tone(300, 1.1, 'sine', 0.05, 0, 0.5); },
  encore(){ [523, 659, 784, 1047, 1319].forEach((f,i) => this.tone(f, 0.22, 'square', 0.05, i*0.06)); },
  lap(){ [523, 659, 784].forEach((f,i) => this.tone(f, 0.3, 'sawtooth', 0.07, i*0.12)); this.tone(1047, 0.6, 'sawtooth', 0.08, 0.36); },
  turn(){ this.tone(784, 0.14, 'triangle', 0.09); this.tone(1175, 0.2, 'triangle', 0.08, 0.1); },
  giggle(){ [880, 1109, 1319, 1109].forEach((f,i) => this.tone(f, 0.08, 'sine', 0.06, i*0.06)); },
  sparkle(){ this.tone(2400 + Math.random()*1600, 0.1, 'sine', 0.025, 0, 1.3); this.tone(1800 + Math.random()*900, 0.1, 'sine', 0.02, 0.1, 1.3); },
  bubble(){ this.tone(200 + Math.random()*100, 0.12, 'sine', 0.05, 0, 2.2); },
  win(){ const m = [523, 523, 659, 784, 659, 784, 1047, 1319];
    const d = [0, 0.12, 0.24, 0.4, 0.64, 0.8, 0.96, 1.2];
    m.forEach((f,i) => { this.tone(f, 0.32, 'sawtooth', 0.07, d[i]); this.tone(f/2, 0.32, 'triangle', 0.09, d[i]); });
    for (let i = 0; i < 10; i++) this.tone(1800 + Math.random()*1800, 0.2, 'sine', 0.04, 1.4 + i*0.09); },
  start(){ [392, 523, 659, 784].forEach((f,i) => this.tone(f, 0.22, 'triangle', 0.09, i*0.08)); },
  join(i){ this.tone([523, 659, 784, 988][i%4], 0.25, 'triangle', 0.12, 0, 1.4); this.tone([1047, 1319, 1568, 1976][i%4], 0.3, 'sine', 0.05, 0.08); }
};
let speechUnlocked = false;
function speak(str){
  if (!settings.voice || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(str); u.rate = 1.0; u.pitch = 1.2; speechSynthesis.speak(u); } catch (e) {}
}
function unlockAll(){
  sfx.unlock();
  if (!speechUnlocked && 'speechSynthesis' in window){ speechUnlocked = true;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {} }
}

/* ---------------- track geometry ---------------- */
const TRK = { cx: 800, cy: 468, rx: 640, ry: 298 };
const NT = 24;                    // tiles per lap
const DENSE = [], NS = 960;
for (let i = 0; i <= NS; i++){ const a = Math.PI/2 + i*2*Math.PI/NS; DENSE.push({ x: TRK.cx + Math.cos(a)*TRK.rx, y: TRK.cy + Math.sin(a)*TRK.ry }); }
const CUM = [0];
for (let i = 1; i < DENSE.length; i++) CUM.push(CUM[i-1] + Math.hypot(DENSE[i].x - DENSE[i-1].x, DENSE[i].y - DENSE[i-1].y));
const PERIM = CUM[CUM.length - 1];
function sampleAt(d){
  d = ((d % PERIM) + PERIM) % PERIM;
  let lo = 0, hi = CUM.length - 1;
  while (hi - lo > 1){ const m = (lo + hi) >> 1; if (CUM[m] < d) lo = m; else hi = m; }
  const t = (d - CUM[lo]) / ((CUM[hi] - CUM[lo]) || 1);
  return { x: lerp(DENSE[lo].x, DENSE[hi].x, t), y: lerp(DENSE[lo].y, DENSE[hi].y, t) };
}
const TILES = [];
for (let i = 0; i < NT; i++){
  const d = i*PERIM/NT, p = sampleAt(d), a = sampleAt(d - 6), b = sampleAt(d + 6);
  let tx = b.x - a.x, ty = b.y - a.y; const L = Math.hypot(tx, ty) || 1; tx /= L; ty /= L;
  TILES.push({ x: p.x, y: p.y, tx, ty, ang: Math.atan2(ty, tx), star: i % 6 === 0 && i > 0, gate: i === 0 });
}
const GEM = ['#b98cff', '#5ee6d0', '#ffd166', '#ff8ac1', '#6cb6ff'];
const DECK_POS = { x: 585, y: 490, w: 150, h: 205 };
const DISC_POS = { x: 1015, y: 490, w: 128, h: 175 };
const REVEAL = { x: 800, y: 468 };
let TOTAL = NT*2;

/* ---------------- decor ---------------- */
const stars = [], candles = [], motes = [], bubblesC = [], steam = [];
for (let i = 0; i < 40; i++) stars.push({ x: R()*W, y: R()*120, r: 0.6 + R()*1.5, ph: R()*6.28, sp: 0.8 + R()*2.4 });
for (let i = 0; i < 26; i++){
  const x = 60 + R()*1480, y = 175 + R()*640;
  candles.push({ x, y, ph: R()*6.28, sp: 0.5 + R()*0.8, amp: 6 + R()*10, fl: R()*6.28, h: 24 + R()*14 });
}
for (let i = 0; i < 50; i++) motes.push({ x: R()*W, y: 160 + R()*720, ph: R()*6.28, sp: 0.3 + R()*0.7 });

/* ---------------- background prerender ---------------- */
const bg = document.createElement('canvas');
function buildBackground(){
  const k = scale*dpr;
  bg.width = Math.max(1, Math.round(W*k)); bg.height = Math.max(1, Math.round(H*k));
  const b = bg.getContext('2d'); b.setTransform(k,0,0,k,0,0);
  // floor
  let g = b.createRadialGradient(800, 480, 60, 800, 480, 1000);
  g.addColorStop(0, '#3a2a63'); g.addColorStop(0.6, '#241849'); g.addColorStop(1, '#120b2b');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  // flagstones
  const fr = rng(21);
  for (let y = 150; y < H; y += 74){
    const off = ((y - 150)/74 % 2) * 60;
    for (let x = -60 + off; x < W; x += 120){
      const v = fr()*0.06;
      b.fillStyle = `rgba(255,255,255,${0.02 + v})`; rr(b, x + 3, y + 3, 114, 68, 8); b.fill();
      b.strokeStyle = 'rgba(8,4,24,0.45)'; b.lineWidth = 3; b.stroke();
    }
  }
  // rune circle on the floor
  b.save(); b.translate(TRK.cx, TRK.cy);
  b.strokeStyle = 'rgba(190,150,255,0.35)'; b.lineWidth = 4;
  [250, 232, 176].forEach((r,i) => { b.beginPath(); b.arc(0, 0, r, 0, Math.PI*2); b.setLineDash(i === 1 ? [3, 12] : []); b.stroke(); }); b.setLineDash([]);
  b.strokeStyle = 'rgba(190,150,255,0.22)'; b.lineWidth = 3;
  for (let k = 0; k < 2; k++){ b.beginPath();
    for (let i = 0; i < 5; i++){ const a = k*Math.PI/5 + i*2*Math.PI*2/5 - Math.PI/2; b.lineTo(Math.cos(a)*176, Math.sin(a)*176); }
    b.closePath(); b.stroke(); }
  b.restore();
  // track glow
  b.save(); b.strokeStyle = 'rgba(160,110,255,0.22)'; b.lineWidth = 120; b.beginPath(); b.ellipse(TRK.cx, TRK.cy, TRK.rx, TRK.ry, 0, 0, Math.PI*2); b.stroke(); b.restore();
  b.save(); b.strokeStyle = 'rgba(20,10,50,0.55)'; b.lineWidth = 86; b.beginPath(); b.ellipse(TRK.cx, TRK.cy, TRK.rx, TRK.ry, 0, 0, Math.PI*2); b.stroke(); b.restore();
  // back wall
  g = b.createLinearGradient(0, 0, 0, 160); g.addColorStop(0, '#2b1f52'); g.addColorStop(1, '#3d2d70');
  b.fillStyle = g; b.fillRect(0, 0, W, 150);
  for (let x = 0; x < W; x += 80){ b.strokeStyle = 'rgba(10,5,30,0.4)'; b.lineWidth = 3; b.strokeRect(x, 0, 80, 50); b.strokeRect(x + 40, 50, 80, 50); b.strokeRect(x, 100, 80, 50); }
  // arched windows
  [200, 500, 1100, 1400].forEach(wx => {
    b.save(); b.beginPath(); b.moveTo(wx - 44, 138); b.lineTo(wx - 44, 66); b.arc(wx, 66, 44, Math.PI, 0); b.lineTo(wx + 44, 138); b.closePath(); b.clip();
    const sg = b.createLinearGradient(0, 20, 0, 140); sg.addColorStop(0, '#0a0e3a'); sg.addColorStop(1, '#4b2f8a');
    b.fillStyle = sg; b.fillRect(wx - 46, 10, 92, 132);
    const wr = rng(wx);
    for (let i = 0; i < 14; i++){ b.fillStyle = `rgba(255,255,255,${0.4 + wr()*0.6})`; b.beginPath(); b.arc(wx - 40 + wr()*80, 30 + wr()*100, wr()*1.4 + 0.4, 0, Math.PI*2); b.fill(); }
    if (wx === 500){ b.fillStyle = '#fff6d8'; b.beginPath(); b.arc(wx + 8, 60, 16, 0, Math.PI*2); b.fill(); b.fillStyle = '#3d2a78'; b.beginPath(); b.arc(wx + 16, 56, 14, 0, Math.PI*2); b.fill(); }
    b.strokeStyle = 'rgba(10,5,30,0.75)'; b.lineWidth = 4; b.beginPath(); b.moveTo(wx, 20); b.lineTo(wx, 142); b.moveTo(wx - 46, 88); b.lineTo(wx + 46, 88); b.stroke();
    b.restore();
    b.strokeStyle = '#c9a25a'; b.lineWidth = 6; b.beginPath(); b.moveTo(wx - 44, 140); b.lineTo(wx - 44, 66); b.arc(wx, 66, 44, Math.PI, 0); b.lineTo(wx + 44, 140); b.stroke();
  });
  // banners
  [[350, '#ff8ac1'], [800, '#5ee6d0'], [1250, '#ffd166']].forEach(([bx, col]) => {
    b.fillStyle = shade(col, -0.35); b.beginPath(); b.moveTo(bx - 34, 0); b.lineTo(bx + 34, 0); b.lineTo(bx + 34, 112); b.lineTo(bx, 90); b.lineTo(bx - 34, 112); b.closePath(); b.fill();
    b.fillStyle = col; b.beginPath(); b.moveTo(bx - 28, 0); b.lineTo(bx + 28, 0); b.lineTo(bx + 28, 100); b.lineTo(bx, 80); b.lineTo(bx - 28, 100); b.closePath(); b.fill();
    b.fillStyle = 'rgba(255,255,255,0.85)'; starPath(b, bx, 36, 14, -Math.PI/2, 5, 0.45); b.fill();
  });
  b.fillStyle = '#7a5a2c'; b.fillRect(0, 148, W, 8);
  b.fillStyle = '#c9a25a'; b.fillRect(0, 148, W, 3);
  // vignette
  g = b.createRadialGradient(800, 470, 420, 800, 470, 1050); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(6,2,20,0.55)');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
}

/* ---------------- input: TouchSource ---------------- */
function toBoard(cx,cy){ return { x: (cx-ox)/scale, y: (cy-oy)/scale }; }
class PointerSource {
  constructor(el){
    this.el = el; this.slow = false; this.dwell = 650; this.active = new Map(); this.handlers = [];
    el.addEventListener('pointerdown', e => this.down(e));
    el.addEventListener('pointermove', e => this.move(e));
    el.addEventListener('pointerup', e => this.up(e));
    el.addEventListener('pointercancel', e => this.active.delete(e.pointerId));
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  onTap(fn){ this.handlers.push(fn); }
  emit(bx,by){ const ev = { x: bx/W, y: by/H, type: 'tap' }; for (const f of this.handlers) f(ev); }
  down(e){
    e.preventDefault(); unlockAll();
    const p = toBoard(e.clientX, e.clientY);
    this.active.set(e.pointerId, { x: p.x, y: p.y, sx: p.x, sy: p.y, start: performance.now(), fired: false, moved: false });
    try { this.el.setPointerCapture(e.pointerId); } catch (_) {}
  }
  move(e){
    const a = this.active.get(e.pointerId); if (!a) return;
    const p = toBoard(e.clientX, e.clientY); a.x = p.x; a.y = p.y;
    if (Math.hypot(a.x-a.sx, a.y-a.sy) > 30){
      if (this.slow){ a.sx = a.x; a.sy = a.y; a.start = performance.now(); a.fired = false; } else a.moved = true;
    }
  }
  up(e){ const a = this.active.get(e.pointerId); this.active.delete(e.pointerId); if (a && !this.slow && !a.moved) this.emit(a.sx, a.sy); }
  update(now){
    if (!this.slow) return;
    for (const a of this.active.values()) if (!a.fired && now - a.start >= this.dwell){ a.fired = true; this.emit(a.sx, a.sy); }
  }
}
const source = new PointerSource(cv);
source.onTap(handleTap);
window.Lightboard = { tap: (nx, ny) => handleTap({ x: nx, y: ny, type: 'tap' }) };

/* ---------------- spells ---------------- */
const SPELLS = {
  hop:    { name: 'Hop',          kind: 'move',   n: 2,  count: 5, color: '#6ee7ff', icon: '🐰', say: 'Hop! Two steps!' },
  skip:   { name: 'Skip',         kind: 'move',   n: 3,  count: 5, color: '#b6f27a', icon: '🦘', say: 'Skip! Three steps!' },
  zoom:   { name: 'Zoom',         kind: 'move',   n: 4,  count: 4, color: '#ffe27a', icon: '💨', say: 'Zoom! Four steps!' },
  broom:  { name: 'Broom Dash',   kind: 'move',   n: 6,  count: 3, color: '#ffa94d', icon: '🧹', say: 'Broom dash! Six steps!' },
  super:  { name: 'Super Broom',  kind: 'move',   n: 8,  count: 2, color: '#ff7eb6', icon: '🌠', say: 'Super broom! Eight steps!' },
  wind:   { name: 'Whoops Wind',  kind: 'move',   n: -3, count: 3, color: '#9fb6ff', icon: '🌬️', say: 'Whoops wind! Back three!' },
  swap:   { name: 'Swap Spell',   kind: 'swap',   n: 0,  count: 3, color: '#d9a8ff', icon: '🔄', say: 'Swap spell! Pick a wizard to swap with!' },
  zap:    { name: 'Frog Zap',     kind: 'zap',    n: 0,  count: 3, color: '#fff26b', icon: '⚡', say: 'Frog zap! Pick a wizard!' },

  encore: { name: 'Magic Encore', kind: 'encore', n: 0,  count: 3, color: '#ff9ecf', icon: '✨', say: 'Magic encore! Draw again!' },
  star:   { name: 'Star Leap',    kind: 'star',   n: 0,  count: 2, color: '#ffd98a', icon: '⭐', say: 'Star leap!' }
};
const SPELL_TAG = { hop: '+2', skip: '+3', zoom: '+4', broom: '+6', super: '+8', wind: '−3', swap: '⇄', zap: '🐸', shield: '◯', encore: '×2', star: '★' };
const ZAP_BACK = 5;
function newDeck(){
  const d = [];
  for (const id in SPELLS) for (let k = 0; k < SPELLS[id].count; k++) d.push({ id });
  for (let i = d.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [d[i], d[j]] = [d[j], d[i]]; }
  return d;
}

/* ---------- pure rules ---------- */
function nextStar(pos){ let n = (Math.floor(pos/6) + 1)*6; return n; }
function starTarget(pos){ const n = nextStar(pos); return n >= TOTAL ? -1 : n; }
function padTarget(p, sp){ return clamp(p.pos + sp.n, 0, TOTAL); }

/* ---------------- game state ---------------- */
const WIZARDS = [
  { name: 'Cat',      emoji: '🐱', color: '#ff8ac1' },
  { name: 'Llama',    emoji: '🦙', color: '#5ee6d0' },
  { name: 'Hedgehog', emoji: '🦔', color: '#ffd166' },
  { name: 'Dragon',   emoji: '🐲', color: '#9ad25a' }
];
const TILE_X = [440, 680, 920, 1160];
let joined = [true, true, false, false];
let screen = 'menu', paused = false, phase = 'idle';
let players = [], turn = 0, gameId = 0, winner = null, statusMsg = '';
let deck = [], discard = [], cardAnim = null, targets = [], chooseResolve = null, bolt = null, hintSpell = null;
const sparks = [], puffs = [], taps = [], leaves = [], pops = [];

function tileXY(pos){ return TILES[pos >= TOTAL ? 0 : pos % NT]; }
function slotOf(p){
  const t = tileXY(p.pos);
  const same = players.filter(q => q.pos === p.pos && !q.moving);
  const n = same.length, k = same.indexOf(p);
  if (n <= 1 || k < 0) return { x: t.x, y: t.y };
  const off = (k - (n-1)/2)*34;
  return { x: t.x + t.tx*off, y: t.y + t.ty*off + (k % 2 ? 8 : -6) };
}
function drawFromDeck(){ if (!deck.length){ deck = newDeck(); discard = []; } return deck.pop(); }

function startGame(){
  gameId++;
  TOTAL = NT*settings.laps;
  players = WIZARDS.map((c,i) => ({ ...c, seat: i })).filter(c => joined[c.seat]).map(c => {
    const t = TILES[0];
    return { ...c, pos: 0, lapMax: 0, x: t.x, y: t.y, hop: 0, squash: 1, sc: 1, tilt: 0, form: 'wizard', shield: 0, moving: false, wand: 0 };
  });
  players.forEach((p, i) => { const s = slotOf(p); p.x = s.x; p.y = s.y; });
  turn = 0; winner = null; statusMsg = ''; deck = newDeck(); discard = []; cardAnim = null; targets = []; bolt = null; chooseResolve = null;
  screen = 'play'; paused = false; phase = 'await';
  sfx.start();
  setTimeout(() => announceTurn(true), 500);
}
function toMenu(){ gameId++; screen = 'menu'; paused = false; phase = 'idle'; players = []; cardAnim = null; targets = []; bolt = null; chooseResolve = null; }
function announceTurn(first){
  const p = players[turn]; if (!p || screen !== 'play') return;
  sfx.turn(); statusMsg = '';
  speak(first ? `${p.name}, tap the spellbook to draw a spell!` : `${p.name}'s turn!`);
}

async function doTurn(){
  if (phase !== 'await' || screen !== 'play') return;
  phase = 'busy';
  const gid = gameId, pl = players[turn];
  const card = drawFromDeck(), sp = SPELLS[card.id];
  statusMsg = '';
  sfx.draw();
  cardAnim = { card, x: DECK_POS.x, y: DECK_POS.y, w: DECK_POS.w, h: DECK_POS.h, flip: 0 };
  const ca = cardAnim;
  await tween(650, t => { ca.x = lerp(DECK_POS.x, REVEAL.x, t); ca.y = lerp(DECK_POS.y, REVEAL.y, t); ca.w = lerp(DECK_POS.w, 300, t); ca.h = lerp(DECK_POS.h, 410, t); ca.flip = t; });
  if (gid !== gameId) return;
  sfx.reveal(); sparkle(REVEAL.x, REVEAL.y, sp.color, 34, 300); speak(sp.say);
  pl.wand = 1; tween(500, t => { pl.wand = 1 - t; });
  await wait(1250);
  if (gid !== gameId) return;
  tween(480, t => { ca.x = lerp(REVEAL.x, DISC_POS.x, t); ca.y = lerp(REVEAL.y, DISC_POS.y, t); ca.w = lerp(300, DISC_POS.w, t); ca.h = lerp(410, DISC_POS.h, t); })
    .then(() => { discard.push(card); if (cardAnim === ca) cardAnim = null; });
  const again = await resolveCard(pl, card, sp, gid);
  if (gid !== gameId) return;
  if (pl.pos >= TOTAL){ await doWin(pl, gid); return; }
  await wait(300);
  if (gid !== gameId) return;
  if (again){ statusMsg = 'Magic Encore! Draw again!'; phase = 'await'; return; }
  turn = (turn + 1) % players.length;
  phase = 'await';
  announceTurn(false);
}

async function resolveCard(pl, card, sp, gid){
  if (sp.kind === 'move'){
    if (sp.n < 0) await windBack(pl, sp.n, gid); else await stepTo(pl, padTarget(pl, sp), gid, { ms: sp.n >= 6 ? 150 : 210, hopH: sp.n >= 6 ? 54 : 40 });
    return false;
  }
  if (sp.kind === 'star'){
    const t = starTarget(pl.pos);
    if (t < 0){ speak('No star ahead. A little hop instead!'); await stepTo(pl, clamp(pl.pos + 3, 0, TOTAL), gid, { ms: 200, hopH: 40 }); return false; }
    await stepTo(pl, t, gid, { ms: 130, hopH: 70, trail: true }); return false;
  }
  if (sp.kind === 'shield'){
    sfx.shield(); pl.shield = 0.01;
    sparkle(pl.x, pl.y - 30, '#6ee7b7', 30, 240);
    await tween(700, t => { pl.shield = 0.01 + t*0.99; }, ease.back);
    pl.shield = 1;
    return false;
  }
  if (sp.kind === 'encore'){
    sfx.encore(); sparkle(pl.x, pl.y - 30, '#ff9ecf', 40, 300); sparkle(DECK_POS.x, DECK_POS.y, '#ff9ecf', 30, 260);
    await wait(900); return true;
  }
  // targeted spells
  const cand = players.filter(q => q !== pl && (sp.kind === 'zap' ? q.pos > 0 : true));
  if (!cand.length){
    speak('Nobody to pick. The spell turns into a hop!');
    await stepTo(pl, clamp(pl.pos + 2, 0, TOTAL), gid, { ms: 210, hopH: 40 }); return false;
  }
  let target;
  if (cand.length === 1){ target = cand[0]; targets = [target]; statusMsg = `Casting on ${target.name}!`; await wait(900); }
  else {
    targets = cand; phase = 'choose'; statusMsg = 'Tap a wizard!';
    target = await new Promise(res => { chooseResolve = res; });
    if (gid !== gameId) return false;
    phase = 'busy';
  }
  targets = []; statusMsg = '';
  if (sp.kind === 'zap') await castZap(pl, target, gid); else await castSwap(pl, target, gid);
  return false;
}

async function stepTo(p, dest, gid, o = {}){
  const ms = o.ms || 210, hopH = o.hopH || 40;
  if (dest === p.pos) return;
  p.moving = true;
  let n = 0;
  const dir = dest > p.pos ? 1 : -1;
  while (p.pos !== dest){
    if (gid !== gameId) return;
    const nxt = p.pos + dir, a = { x: p.x, y: p.y }, b = tileXY(nxt);
    if (o.trail) sfx.star(); else if (dir > 0) sfx.step(n); else sfx.back(n);
    n++;
    await tween(ms, t => { p.x = lerp(a.x, b.x, t); p.y = lerp(a.y, b.y, t); p.hop = Math.sin(Math.PI*t)*hopH; p.squash = 1 + Math.sin(Math.PI*t)*0.14;
      if (o.trail && Math.random() < 0.6) sparkle(p.x, p.y - p.hop - 10, '#ffd98a', 1, 60); }, ease.inOut);
    p.pos = nxt; p.hop = 0; p.squash = 0.78;
    sparkle(b.x, b.y, p.color, 4, 80);
    if (dir > 0 && p.pos % NT === 0 && p.pos > 0 && p.pos < TOTAL && Math.floor(p.pos/NT) > p.lapMax){
      p.lapMax = Math.floor(p.pos/NT); sfx.lap(); speak(`${p.name} starts lap ${p.lapMax + 1}!`);
      for (let i = 0; i < 4; i++) sparkle(b.x + (Math.random()-0.5)*100, b.y - 40, ['#ffd166', '#ff8ac1', '#5ee6d0', '#b98cff'][i], 18, 260);
    }
  }
  p.lapMax = Math.max(p.lapMax, Math.floor(Math.min(p.pos, TOTAL - 1)/NT));
  p.moving = false;
  sfx.land();
  const t = tileXY(p.pos);
  if (p.pos < TOTAL && p.pos > 0 && p.pos % 6 === 0){ sfx.star(); sparkle(t.x, t.y, '#ffd98a', 26, 220); }
  else sparkle(t.x, t.y, p.color, 8, 120);
}

async function windBack(p, n, gid){
  const dest = clamp(p.pos + n, 0, TOTAL);
  sfx.wind();
  for (let i = 0; i < 28; i++) leaves.push({ x: p.x + 260 + Math.random()*260, y: p.y - 140 + Math.random()*160, vx: -(500 + Math.random()*400), vy: (Math.random()-0.5)*80, rot: Math.random()*6, life: 0, col: pick(['#ffb74d', '#f06292', '#aed581', '#ffd54f']) });
  await wait(450);
  await stepTo(p, dest, gid, { ms: 190, hopH: 22 });
  p.tilt = 0;
}

async function castZap(pl, tg, gid){
  sfx.zapCharge(); pl.wand = 1;
  await wait(350);
  if (gid !== gameId) return;
  const tip = wandTip(pl);
  bolt = { a: tip, tgt: tg, t: 0 };
  sfx.zap(); sparkle(tip.x, tip.y, '#fff26b', 20, 220);
  await tween(480, t => { bolt.t = t; }, ease.lin);
  bolt = null; pl.wand = 0;
  if (gid !== gameId) return;
  if (tg.shield){
    popShield(tg); speak('The shield blocked it!');
    await wait(900); return;
  }
  poof(tg.x, tg.y - 30, '#fff26b'); sfx.poof(); tg.form = 'frog'; speak(`Ribbit! ${tg.name} is a frog!`);
  tg.squash = 0.6; await wait(650);
  if (gid !== gameId) return;
  sfx.ribbit();
  const dest = Math.max(0, tg.pos - ZAP_BACK);
  await stepTo(tg, dest, gid, { ms: 150, hopH: 46 });
  if (gid !== gameId) return;
  await wait(250);
  poof(tg.x, tg.y - 30, '#ffffff'); sfx.poof(); tg.form = 'wizard'; tg.squash = 1.3;
  await wait(500);
}

async function castSwap(pl, tg, gid){
  if (tg.shield){
    bolt = null; sfx.zapCharge(); await wait(300);
    popShield(tg); speak('The shield blocked it!'); await wait(900); return;
  }
  if (pl.pos === tg.pos){ sparkle(pl.x, pl.y - 30, '#d9a8ff', 30, 240); speak('You are on the same spot!'); await wait(900); return; }
  sfx.swap(); speak(`Swap! ${pl.name} and ${tg.name} trade places!`);
  const a = { x: pl.x, y: pl.y }, b = { x: tg.x, y: tg.y };
  const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1, nx = -dy/L, ny = dx/L, arc = Math.min(160, 40 + L*0.25);
  pl.moving = true; tg.moving = true;
  await tween(1200, t => {
    const s = Math.sin(Math.PI*t);
    pl.x = lerp(a.x, b.x, t) + nx*arc*s; pl.y = lerp(a.y, b.y, t) + ny*arc*s - s*30;
    tg.x = lerp(b.x, a.x, t) - nx*arc*s; tg.y = lerp(b.y, a.y, t) - ny*arc*s - s*30;
    pl.tilt = Math.sin(t*Math.PI*8)*0.3; tg.tilt = -pl.tilt;
    if (Math.random() < 0.7){ sparkle(pl.x, pl.y - 30, '#d9a8ff', 1, 60); sparkle(tg.x, tg.y - 30, '#ff9ecf', 1, 60); }
  }, ease.inOut);
  if (gid !== gameId) return;
  const pp = pl.pos; pl.pos = tg.pos; tg.pos = pp;
  pl.tilt = 0; tg.tilt = 0; pl.moving = false; tg.moving = false;
  pl.lapMax = Math.max(pl.lapMax, Math.floor(Math.min(pl.pos, TOTAL - 1)/NT)); tg.lapMax = Math.max(tg.lapMax, Math.floor(Math.min(tg.pos, TOTAL - 1)/NT));
  sfx.land(); sparkle(pl.x, pl.y - 20, '#d9a8ff', 22, 200); sparkle(tg.x, tg.y - 20, '#ff9ecf', 22, 200);
  await wait(500);
}

function popShield(p){
  sfx.bonk(); sparkle(p.x, p.y - 34, '#6ee7b7', 40, 340); sparkle(p.x, p.y - 34, '#ffffff', 20, 240);
  p.shield = 0; pops.push({ x: p.x, y: p.y - 100, str: 'Blocked!', t: 0, color: '#6ee7b7' });
}
function wandTip(p){ return { x: p.x + 34, y: p.y - p.hop - 44 }; }

async function doWin(p, gid){
  phase = 'win'; winner = p;
  sfx.win(); speak(`${p.name} wins the wizard race! Hooray!`);
  const g = TILES[0];
  for (let i = 0; i < 7; i++){ sparkle(g.x + (Math.random()-0.5)*260, g.y - 60 - Math.random()*200, ['#ffd166', '#ff8ac1', '#5ee6d0', '#b98cff', '#ffffff'][i%5], 40, 400); await wait(240); }
  if (gid !== gameId) return;
  await wait(500);
  if (gid !== gameId) return;
  screen = 'win';
}

/* ---------------- particles ---------------- */
function sparkle(x, y, color, n, speed){
  for (let i = 0; i < n; i++){
    const a = Math.random()*Math.PI*2, v = speed*(0.25 + Math.random()*0.75);
    sparks.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - speed*0.15, rot: Math.random()*6, vr: (Math.random()-0.5)*8, life: 0, max: 0.6 + Math.random()*0.7, color, s: 4 + Math.random()*8 });
  }
}
function poof(x, y, color){
  for (let i = 0; i < 12; i++){ const a = Math.random()*Math.PI*2; puffs.push({ x, y, vx: Math.cos(a)*(60 + Math.random()*90), vy: Math.sin(a)*(60 + Math.random()*90) - 30, r: 16 + Math.random()*18, life: 0, max: 0.7 + Math.random()*0.3 }); }
  sparkle(x, y, color, 20, 260);
}

/* ---------------- update ---------------- */
let T = 0, last = performance.now(), nextAmb = 3;
function update(dt, now){
  T = now/1000;
  for (let i = sparks.length-1; i >= 0; i--){ const s = sparks[i]; s.life += dt; if (s.life > s.max){ sparks.splice(i,1); continue; }
    s.vx *= 0.94; s.vy = s.vy*0.94 + 40*dt; s.x += s.vx*dt; s.y += s.vy*dt; s.rot += s.vr*dt; }
  for (let i = puffs.length-1; i >= 0; i--){ const p = puffs[i]; p.life += dt; if (p.life > p.max){ puffs.splice(i,1); continue; } p.vx *= 0.94; p.vy *= 0.94; p.x += p.vx*dt; p.y += p.vy*dt; p.r += 30*dt; }
  for (let i = leaves.length-1; i >= 0; i--){ const l = leaves[i]; l.life += dt; l.x += l.vx*dt; l.y += (l.vy + Math.sin(T*8 + l.rot)*80)*dt; l.rot += 8*dt; if (l.x < -60 || l.life > 4) leaves.splice(i,1); }
  for (let i = pops.length-1; i >= 0; i--){ pops[i].t += dt; if (pops[i].t > 1.1) pops.splice(i,1); }
  for (let i = taps.length-1; i >= 0; i--){ taps[i].t += dt; if (taps[i].t > 0.5) taps.splice(i,1); }
  if (Math.random() < dt*3){ bubblesC.push({ x: 800 + (Math.random()-0.5)*60, y: 668, r: 3 + Math.random()*6, life: 0, max: 0.9 + Math.random()*0.6 }); }
  for (let i = bubblesC.length-1; i >= 0; i--){ const b = bubblesC[i]; b.life += dt; b.y -= 40*dt; if (b.life > b.max) bubblesC.splice(i,1); }
  if (Math.random() < dt*1.6) steam.push({ x: 800 + (Math.random()-0.5)*70, y: 640, r: 10, life: 0, max: 1.8 });
  for (let i = steam.length-1; i >= 0; i--){ const s = steam[i]; s.life += dt; s.y -= 34*dt; s.x += Math.sin(T*2 + s.r)*10*dt; s.r += 12*dt; if (s.life > s.max) steam.splice(i,1); }
  for (const p of players){
    p.squash += (1 - p.squash)*Math.min(1, dt*12);
    if (!p.moving){ const s = slotOf(p); const k = Math.min(1, dt*9); p.x += (s.x - p.x)*k; p.y += (s.y - p.y)*k; }
  }
  if (screen === 'win' && Math.random() < dt*5) sparkle(100 + Math.random()*1400, 100 + Math.random()*600, pick(['#ffd166', '#ff8ac1', '#5ee6d0', '#b98cff', '#ffffff']), 14, 240);
  if (T > nextAmb){ if (Math.random() < 0.5) sfx.sparkle(); else sfx.bubble(); nextAmb = T + 2.5 + Math.random()*4; }
}

/* ---------------- drawing ---------------- */
function drawRuneRing(){
  const cx = TRK.cx, cy = TRK.cy, syms = ['✦', '☽', '✧', '☼', '✶', '❂', '✺', '☾'];
  ctx.save(); ctx.translate(cx, cy);
  for (let ring = 0; ring < 2; ring++){
    const r = ring ? 232 : 176, n = ring ? 16 : 10, dir = ring ? -1 : 1;
    for (let i = 0; i < n; i++){
      const a = i*2*Math.PI/n + T*0.12*dir;
      const gl = 0.35 + 0.35*Math.sin(T*1.5 + i*0.9 + ring);
      ctx.save(); ctx.translate(Math.cos(a)*r, Math.sin(a)*r); ctx.rotate(a + Math.PI/2);
      ctx.globalAlpha = gl; ctx.fillStyle = ring ? '#c9a6ff' : '#ffe0a0'; ctx.font = `26px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(syms[(i + ring*3) % syms.length], 0, 0);
      ctx.restore();
    }
  }
  ctx.restore();
}
function drawTiles(){
  const cur = players[turn];
  for (let i = 0; i < NT; i++){
    const t = TILES[i], c = GEM[i % GEM.length], pul = 0.5 + 0.5*Math.sin(T*2 + i*0.7);
    ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(t.ang);
    const w = 96, h = 76;
    if (t.gate){
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; rr(ctx, -w/2 + 3, -h/2 + 7, w, h, 14); ctx.fill();
      rr(ctx, -w/2, -h/2, w, h, 14); ctx.save(); ctx.clip();
      for (let a = 0; a < 6; a++) for (let b = 0; b < 5; b++){ ctx.fillStyle = (a + b) % 2 ? '#ffffff' : '#241849'; ctx.fillRect(-w/2 + a*w/6, -h/2 + b*h/5, w/6 + 1, h/5 + 1); }
      ctx.restore();
      rr(ctx, -w/2, -h/2, w, h, 14); ctx.lineWidth = 5; ctx.strokeStyle = '#ffd166'; ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.38)'; rr(ctx, -w/2 + 3, -h/2 + 7, w, h, 16); ctx.fill();
      const g = ctx.createLinearGradient(0, -h/2, 0, h/2);
      g.addColorStop(0, shade(c, t.star ? 0.1 : -0.15)); g.addColorStop(1, shade(c, -0.55));
      rr(ctx, -w/2, -h/2, w, h, 16); ctx.fillStyle = t.star ? '#5a3f10' : g; ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = t.star ? '#ffd98a' : rgba(c, 0.85); ctx.stroke();
      glow(0, 0, 54, t.star ? '#ffd98a' : c, 0.22 + 0.14*pul);
      ctx.fillStyle = 'rgba(255,255,255,0.14)'; rr(ctx, -w/2 + 8, -h/2 + 6, w - 16, 12, 6); ctx.fill();
    }
    ctx.rotate(-t.ang);
    if (t.star){ ctx.fillStyle = '#ffd98a'; starPath(ctx, 0, 0, 24 + pul*3, T*0.5, 5, 0.45); ctx.fill(); glow(0, 0, 40, '#ffd98a', 0.35 + 0.25*pul); }
    else if (!t.gate){ ctx.strokeStyle = rgba('#ffffff', 0.35 + 0.3*pul); ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = rgba('#ffffff', 0.25 + 0.25*pul); starPath(ctx, 0, 0, 7, T, 4, 0.4); ctx.fill(); }
    ctx.restore();
  }
  // finish arch over the gate
  const g = TILES[0];
  ctx.save(); ctx.translate(g.x, g.y + 60);
  rr(ctx, -130, 0, 260, 40, 20); ctx.fillStyle = 'rgba(20,10,50,0.85)'; ctx.fill(); ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 3; ctx.stroke();
  text('START · FINISH', 0, 21, 22, '#ffe6a0');
  ctx.restore();
}
function drawCandle(c){

function drawBolt(){

}

    glow(a.sx, a.sy, 60, '#ffd166', 0.2 + k*0.4);
    ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(a.sx, a.sy, 42, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = '#ffd166'; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(a.sx, a.sy, 42, -Math.PI/2, -Math.PI/2 + k*Math.PI*2); ctx.stroke(); ctx.lineCap = 'butt';
  }
}

/* ---------------- buttons / taps ---------------- */
function buttons(){
  const B = [];
  if (screen === 'menu'){
    WIZARDS.forEach((c, i) => B.push({ x: TILE_X[i], y: 425, w: 214, h: 244, silent: true, on: () => {
      joined[i] = !joined[i]; if (joined[i]){ sfx.join(i); sparkle(TILE_X[i], 400, c.color, 26, 280); } else sfx.tap(); } }));
    for (const t of TOGGLES) B.push({ x: t.x, y: 628, w: 220, h: 76, on: () => {
      if (t.key === 'laps') settings.laps = settings.laps >= 3 ? 1 : settings.laps + 1; else settings[t.key] = !settings[t.key]; applySettings(); } });
    B.push({ x: 800, y: 772, w: 330, h: 110, on: () => { if (joined.some(Boolean)) startGame(); } });
  } else if (paused){
    B.push({ x: 800, y: 370, w: 390, h: 100, on: () => { paused = false; } });
    for (const t of TOGGLES) if (t.key !== 'laps') B.push({ x: t.x - 120, y: 490, w: 220, h: 76, on: () => { settings[t.key] = !settings[t.key]; applySettings(); } });
    B.push({ x: 800, y: 610, w: 390, h: 90, on: toMenu });
  } else if (screen === 'play'){
    B.push({ x: 1540, y: 54, w: 96, h: 96, on: () => { paused = true; } });
    if (phase === 'await') B.push({ x: DECK_POS.x, y: DECK_POS.y, w: DECK_POS.w + 70, h: DECK_POS.h + 70, silent: true, on: doTurn });
  } else if (screen === 'win'){
    B.push({ x: 640, y: 710, w: 310, h: 100, on: startGame });
    B.push({ x: 960, y: 710, w: 310, h: 100, on: toMenu });
  }
  return B;
}
function handleTap(ev){
  const x = ev.x*W, y = ev.y*H;
  taps.push({ x, y, t: 0 });
  for (const b of buttons()){
    if (Math.abs(x - b.x) <= b.w/2 && Math.abs(y - b.y) <= b.h/2){ if (!b.silent) sfx.tap(); b.on(); return; }
  }
  if (screen === 'play' && !paused && phase === 'choose' && chooseResolve){
    let best = null, bd = 1e9;
    for (const t of targets){ const d = Math.hypot(x - t.x, y - (t.y - 30 - t.hop)); if (d < 70 && d < bd){ bd = d; best = t; } }
    if (best){ sfx.tap(); const r = chooseResolve; chooseResolve = null; r(best); }
    return;
  }
  if (screen === 'play' && !paused && (phase === 'await')){
    for (const p of players){ if (Math.hypot(x - p.x, y - (p.y - 30)) < 50){ sfx.giggle(); p.squash = 0.6; sparkle(p.x, p.y - 40, p.color, 10, 160); return; } }
  }
}
function applySettings(){
  source.slow = settings.slow;
  if (!settings.voice && 'speechSynthesis' in window) try { speechSynthesis.cancel(); } catch (e) {}
}

/* ---------------- main loop ---------------- */
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth; vh = window.innerHeight;
  cv.width = Math.round(vw*dpr); cv.height = Math.round(vh*dpr);
  cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
  scale = Math.min(vw/W, vh/H); ox = (vw - W*scale)/2; oy = (vh - H*scale)/2;
  buildBackground();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { glowCache.__x = null; });
resize();

function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  updateTweens(now);
  source.update(now);
  update(dt, now);

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#1a1035'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr*scale, 0, 0, dpr*scale, dpr*ox, dpr*oy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

  ctx.drawImage(bg, 0, 0, W, H);
  for (const s of stars){ const a = 0.3 + 0.7*Math.pow(0.5 + 0.5*Math.sin(T*s.sp + s.ph), 3); if (s.y > 20 && s.y < 110){ ctx.fillStyle = `rgba(255,255,255,${a*0.0})`; ctx.fillRect(0,0,0,0); } }
  drawRuneRing();
  drawTiles();
  drawCauldron();
  for (const c of candles) drawCandle(c);
  drawDeckArea();
  drawWizards();
  drawBolt();
  drawParticles();
  progressChips();
  drawBanner();
  drawCardAnim();
  for (const m of motes){ const a = 0.15 + 0.25*Math.sin(T*m.sp + m.ph); glow(m.x + Math.sin(T*0.4 + m.ph)*20, m.y + Math.cos(T*0.3 + m.ph)*14, 12, '#d9c2ff', Math.max(0, a)); }
  if (screen === 'menu') drawMenu();
  if (screen === 'win') drawWin();
  if (paused) drawPause();
  drawTaps(now);
  ctx.restore();

  if (vh > vw*1.05){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `16px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText('Turn your phone sideways for a bigger castle', vw/2, Math.max(24, oy/2));
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
