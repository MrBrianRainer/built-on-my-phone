<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#5a1fc2; --bg2:#1d0647; --ink:#ffffff; --card:rgba(255,255,255,.13);
  --gold:#ffd23f; --pink:#ff3d9a; --cyan:#27e1ff; --green:#19c95f; --red:#ff3b55;
  --deep:#2a0a5e; --paper:#ffffff;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg1:#3c117f;--bg2:#0f0326;--card:rgba(255,255,255,.10)}
}
:root[data-theme="dark"]{--bg1:#3c117f;--bg2:#0f0326;--card:rgba(255,255,255,.10)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:var(--body);font-weight:700;
  background-color:var(--bg2);
  background-image:radial-gradient(120% 80% at 50% -15%,var(--bg1) 0%,var(--bg2) 70%);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";position:fixed;left:50%;top:-40%;width:200vmax;height:200vmax;margin-left:-100vmax;
  background:conic-gradient(from 0deg,transparent 0 8%,rgba(255,79,163,.22) 10%,transparent 13% 33%,rgba(39,225,255,.20) 35%,transparent 38% 58%,rgba(255,210,63,.20) 60%,transparent 63% 83%,rgba(255,79,163,.18) 85%,transparent 88%);
  animation:spin 40s linear infinite;pointer-events:none;z-index:0;
}
@keyframes spin{to{transform:rotate(360deg)}}
#app{position:relative;z-index:1;height:100%;max-width:1400px;margin:0 auto;padding:8px 12px;display:flex;flex-direction:column;gap:8px}

/* scoreboard */
#board{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;flex:none}
.team{display:flex;align-items:center;gap:8px;background:var(--card);border:3px solid transparent;border-radius:18px;padding:6px 10px;min-width:0;transition:transform .2s,border-color .2s,box-shadow .2s}
.team.t1{flex-direction:row-reverse;text-align:right}
.team.on{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,210,63,.25),0 0 30px rgba(255,210,63,.45);transform:scale(1.03)}
.team .em{font-size:clamp(26px,6vmin,56px);line-height:1}
.team .nmw{flex:1;min-width:0}
.team .nm{font-size:clamp(13px,2.6vmin,28px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .sc{font-family:var(--display);font-size:clamp(26px,6.5vmin,60px);color:var(--gold);line-height:1}
.team .sc.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.5)}100%{transform:scale(1)}}
.mid{align-self:center;font-family:var(--display);font-size:clamp(11px,2.2vmin,22px);background:var(--deep);border:2px solid var(--gold);color:var(--gold);padding:4px 10px;border-radius:999px;white-space:nowrap}

/* stage */
#stage{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;-webkit-overflow-scrolling:touch}
.pg{margin:auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vmin,22px);text-align:center;padding:4px 2px}
#stage.animate .pg{animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.75);opacity:0}100%{transform:scale(1);opacity:1}}
.kick{font-family:var(--display);color:var(--gold);font-size:clamp(16px,3.4vmin,34px);letter-spacing:.04em}
.bigemoji{font-size:clamp(70px,min(24vw,24vh),220px);line-height:1}
.title{font-family:var(--display);font-size:clamp(34px,min(10.5vw,10.5vh),108px);line-height:1.02;text-shadow:0 4px 0 rgba(0,0,0,.35);max-width:16ch}
.title.wide{max-width:none}
.title .yu{color:var(--gold)}
.sub{font-size:clamp(17px,min(4.4vw,4.4vh),42px);line-height:1.18;max-width:26ch;opacity:.95}
.sub.wide{max-width:34ch}
.chip{display:inline-block;background:var(--gold);color:var(--deep);font-family:var(--display);font-size:clamp(15px,3.2vmin,30px);padding:4px 16px;border-radius:999px}
.upline{font-family:var(--display);font-size:clamp(20px,4.4vmin,44px)}
.twist{background:var(--pink);color:#fff;font-family:var(--display);font-size:clamp(17px,4vmin,40px);line-height:1.1;padding:8px 18px;border-radius:16px;transform:rotate(-1.5deg);box-shadow:0 5px 0 rgba(0,0,0,.3);max-width:min(100%,900px);animation:wig 1.6s ease-in-out infinite}
@keyframes wig{50%{transform:rotate(1.5deg) scale(1.03)}}
.prompt{background:var(--paper);color:var(--deep);border-radius:28px;padding:clamp(12px,2.6vmin,32px) clamp(14px,3vmin,36px);box-shadow:0 10px 0 rgba(0,0,0,.3);width:100%;max-width:1100px;display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1vmin,12px)}
.prompt .pe{font-size:clamp(54px,min(17vw,17vh),170px);line-height:1}
.prompt .pt{font-family:var(--display);font-size:clamp(28px,min(8.2vw,8.2vh),92px);line-height:1.08}
.prompt.small .pe{font-size:clamp(40px,10vmin,100px)}
.prompt.small .pt{font-size:clamp(22px,5.4vmin,56px)}
.prompt.hush{background:var(--deep);color:#fff;border:4px dashed var(--gold)}
.timer{width:100%;max-width:900px;display:flex;flex-direction:column;align-items:center;gap:6px}
.tnum{font-family:var(--display);font-size:clamp(48px,14vmin,150px);line-height:1;color:var(--gold);text-shadow:0 4px 0 rgba(0,0,0,.35)}
.tnum.hot{color:var(--red);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}
.tbar{width:100%;height:clamp(12px,2.6vmin,26px);background:rgba(0,0,0,.35);border-radius:999px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));border-radius:999px}
.tbar i.hot{background:var(--red)}
.timeup{font-family:var(--display);font-size:clamp(28px,7vmin,70px);color:var(--red);animation:pulse .4s infinite alternate}
.okc{color:var(--green)}.nc{color:var(--red)}
.pts{font-family:var(--display);font-size:clamp(28px,7vmin,72px);color:var(--gold)}
.why{font-size:clamp(17px,min(4.2vw,4.2vh),38px);max-width:28ch;line-height:1.2}
.verdict{font-family:var(--display);font-size:clamp(40px,11vmin,120px);line-height:1}
.rl{font-family:var(--display);font-size:clamp(18px,4vmin,38px);background:var(--card);padding:6px 16px;border-radius:14px}

/* controls */
#ctl{flex:none;display:flex;flex-direction:column;gap:8px;width:100%;max-width:900px;margin:0 auto}
.btn{font-family:var(--display);font-size:clamp(22px,5.4vmin,44px);line-height:1.05;padding:clamp(13px,3vmin,26px) 12px;border:0;border-radius:22px;color:#fff;background:var(--pink);box-shadow:0 6px 0 rgba(0,0,0,.35);cursor:pointer;touch-action:manipulation;width:100%}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn:focus-visible,.tool:focus-visible,.pill:focus-visible,.ep:focus-visible{outline:4px solid var(--cyan);outline-offset:2px}
.btn.go{background:var(--gold);color:var(--deep)}
.btn.yes{background:var(--green)}
.btn.no{background:var(--red)}
.btn.alt{background:var(--cyan);color:var(--deep)}
.btn small{display:block;font-family:var(--body);font-size:.5em;opacity:.8}
.two,.four{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.tool{font-family:var(--body);font-weight:800;font-size:15px;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:14px;padding:8px 12px;cursor:pointer;touch-action:manipulation}
.tvon{font-size:14px;color:var(--cyan)}
.peek{touch-action:none;-webkit-touch-callout:none}

/* setup */
.logo{font-family:var(--display);font-size:clamp(40px,min(14vw,12vh),120px);line-height:.95;text-shadow:0 5px 0 rgba(0,0,0,.4);color:var(--gold)}
.panel{background:var(--card);border-radius:22px;padding:12px;width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px;text-align:left}
.trow{display:flex;align-items:center;gap:10px}
.trow .big{font-size:40px}
.trow input{flex:1;min-width:0;font-family:var(--display);font-size:26px;padding:8px 12px;border-radius:14px;border:3px solid transparent;background:#fff;color:var(--deep);-webkit-user-select:text;user-select:text}
.trow input:focus{outline:none;border-color:var(--cyan)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.ep{font-size:26px;background:rgba(255,255,255,.12);border:3px solid transparent;border-radius:12px;padding:2px 6px;cursor:pointer}
.ep.on{border-color:var(--gold);background:rgba(255,210,63,.25)}
.lab{font-size:16px;opacity:.9}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-family:var(--body);font-weight:800;font-size:17px;background:rgba(255,255,255,.14);color:#fff;border:3px solid transparent;border-radius:999px;padding:6px 14px;cursor:pointer;touch-action:manipulation}
.pill.on{background:var(--gold);color:var(--deep)}
.tvnote{font-size:14px;opacity:.85;max-width:44ch}

.ann{background:#fff;color:var(--deep);border-radius:20px;padding:8px 18px;font-size:clamp(15px,3.2vmin,30px);line-height:1.2;max-width:min(100%,900px);box-shadow:0 5px 0 rgba(0,0,0,.3)}
.sel{font-family:var(--body);font-weight:800;font-size:16px;max-width:100%;padding:7px 10px;border-radius:12px;border:3px solid transparent;background:#fff;color:var(--deep)}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.cf{position:absolute;top:-12vh;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(120vh) rotate(720deg)}}
#ov{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(15,3,38,.88);text-align:center;font-family:var(--display);font-size:clamp(34px,9vmin,90px);line-height:1.1;cursor:pointer}
#ov small{display:block;font-family:var(--body);font-size:.4em;margin-top:10px;color:var(--gold)}
@media (prefers-reduced-motion:reduce){body::before,.twist{animation:none}}
</style>
</head>

  var tw=T.tw?'<div class="twist">😈 PENALTY: '+esc(T.tw)+'</div>':'';
  if(S.phase==='ready'){
    var h='<div class="pg"><div class="chip">'+R.e+' '+R.name+'</div><div class="bigemoji">'+tm.e+'</div><div class="title wide">'+esc(tm.n)+'<br><span class="yu">YOU’RE UP!</span></div>'+tw+'<div class="sub wide">'+esc(fill(R.hint,i))+'</div>';
    if(R.secret)h+=promptBox(T,R);
    return h+'<div class="sub">⏱ '+R.secs+' seconds</div></div>';
  }
  var sec=S.timerEnd?Math.max(0,Math.ceil((S.timerEnd-Date.now())/1000)):R.secs;
  return '<div class="pg"><div class="upline">'+tm.e+' '+esc(tm.n)+' · '+R.e+' '+R.name+'</div>'+tw+promptBox(T,R)+
    (S.timeUp?'<div class="timeup">⏰ TIME’S UP!</div>':'')+
    '<div class="timer"><div class="tnum" id="tnum">'+sec+'</div><div class="tbar"><i id="tbar"></i></div></div>'+
    '<div class="sub wide">'+esc(fill(R.hint,i))+'</div></div>';
}
function resultHTML(){
  var T=cur(),R=ROUNDS[T.r],i=T.team,res=S.res,h;
  var small='<div class="prompt small"><div class="pe">'+T.item[0]+'</div><div class="pt">'+esc(fill(T.item[1],i))+'</div></div>';
  var pts=res.ok?'<div class="pts">+'+res.pts+(res.bonus?' ⚡ speed bonus!':'')+'</div>':'<div class="pts">+0</div>';
  if(R.k==='rf'){
    h='<div class="pg"><div class="bigemoji">'+(res.ok?'🎉':'😬')+'</div><div class="title '+(res.ok?'okc':'nc')+'">'+res.head+'</div>'+pts+small+
      '<div class="verdict '+(T.item[2]?'okc':'nc')+'">'+(T.item[2]?'✅ REAL!':'🚫 FAKE!')+'</div><div class="why">'+esc(T.item[3].replace(/^(REAL|FAKE)!\s*/,''))+'</div>'+
      '<div class="rl">'+esc(S.teams[i].n)+' said '+(res.said?'REAL':'FAKE')+'</div></div>';
  } else {
    h='<div class="pg"><div class="bigemoji">'+(res.ok?'🎉':'😬')+'</div><div class="title '+(res.ok?'okc':'nc')+'">'+res.head+'</div>'+pts+small+'<div class="why">'+esc(res.line)+'</div></div>';
  }
  return h;
}
function finalHTML(){
  var f=S.fin,T=S.teams,it=f.item;
  var stmt='<div class="prompt"><div class="pe">'+it[0]+'</div><div class="pt">'+esc(it[1])+'</div></div>';
  if(f.step==='w0'||f.step==='w1'){
    var i=f.step==='w0'?0:1;
    return '<div class="pg"><div class="kick">💰 FINAL SHOWDOWN</div><div class="bigemoji">'+T[i].e+'</div><div class="title wide">'+esc(T[i].n)+'</div><div class="sub wide">How much do you wager? Right = win it. Wrong = lose it!</div>'+(i===1?'<div class="rl">🔒 '+esc(T[0].n)+' locked in</div>':'')+'</div>';
  }
  if(f.step==='s0'||f.step==='s1'){
    var j=f.step==='s0'?0:1;
    return '<div class="pg"><div class="kick">💰 FINAL SHOWDOWN · wagers locked 🔒</div>'+stmt+'<div class="title wide">'+T[j].e+' '+esc(T[j].n)+'</div><div class="sub wide">REAL or FAKE? Whisper your answer to the host!</div></div>';
  }
  var rows=[0,1].map(function(i){ var r=f.res[i]; return '<div class="rl '+(r.ok?'okc':'nc')+'">'+T[i].e+' '+esc(T[i].n)+' said '+(f.a[i]?'REAL':'FAKE')+': '+(r.ok?'+':'−')+f.w[i]+(r.ok?' 🎉':' 😬')+'</div>'; }).join('');
  return '<div class="pg"><div class="kick">💰 THE ANSWER IS…</div>'+stmt+'<div class="verdict '+(it[2]?'okc':'nc')+'">'+(it[2]?'✅ REAL!':'🚫 FAKE!')+'</div><div class="why">'+esc(it[3].replace(/^(REAL|FAKE)!\s*/,''))+'</div>'+rows+'</div>';
}
function overHTML(){
  var a=S.teams[0],b=S.teams[1],tie=a.s===b.s,w=a.s>b.s?a:b;
  return '<div class="pg"><div class="bigemoji">🏆</div><div class="title wide">'+(tie?'IT’S A TIE!':w.e+' '+esc(w.n)+'<br><span class="yu">WIN!</span>')+'</div><div class="sub wide">'+(tie?'Everybody wins. Also, rematch.':rand(WIN_LINE))+'</div></div>';
}
function renderStage(){
  var st=$('#stage'),h='';
  switch(S.screen){
    case 'setup': h=isTV?tvWait():setupHTML(); break;
    case 'intro': h=introHTML(); break;
    case 'turn': h=turnHTML(); break;
    case 'final': h=finalHTML(); break;
    case 'over': h=overHTML(); break;
  }
  if(S.quip&&(S.screen==='intro'||S.screen==='final'||(S.screen==='turn'&&S.phase==='ready')))h=h.replace('<div class="pg">','<div class="pg"><div class="ann">🎤 '+esc(S.quip)+'</div>');
  var key=S.screen+'|'+S.phase+'|'+S.ti+'|'+(S.fin?S.fin.step:'');
  st.className='stage'+(key!==lastKey?' animate':''); lastKey=key;
  st.innerHTML=h;
}
function renderCtl(){
  var c=$('#ctl'); if(isTV){ c.style.display='none'; c.innerHTML=''; return; } c.style.display='';
  var m='',T=cur(),R=T?ROUNDS[T.r]:null,canRe=false;
  switch(S.screen){
    case 'setup': m='<button class="btn go" data-act="start">START THE SHOW 🎬</button>'; break;
    case 'intro': m='<button class="btn go" data-act="introgo">LET’S GO! ▶</button>'; break;
    case 'turn':
      if(S.phase==='ready'){ m='<button class="btn go" data-act="begin">START ⏱ '+R.secs+'s</button>'; canRe=true; }
      else if(S.phase==='live'){ canRe=true; m=R.k==='rf'
        ? '<div class="two"><button class="btn alt" data-act="say" data-v="1">✅ REAL</button><button class="btn" data-act="say" data-v="0">🚫 FAKE</button></div>'
        : '<div class="two"><button class="btn yes" data-act="grade" data-v="1">'+R.yes+'</button><button class="btn no" data-act="grade" data-v="0">'+R.no+'</button></div>'; }
      else m='<button class="btn go" data-act="next">NEXT ▶</button>';
      break;
    case 'final':
      var st=S.fin.step;
      if(st==='w0'||st==='w1') m='<div class="four">'+[[0,'0 🐔 chicken'],[100,'100'],[250,'250'],[500,'500 🔥']].map(function(x){ return '<button class="btn '+(x[0]===500?'no':x[0]===0?'alt':'go')+'" data-act="wager" data-v="'+x[0]+'">'+x[1]+'</button>'; }).join('')+'</div>';
      else if(st==='s0'||st==='s1') m='<div class="two"><button class="btn alt" data-act="fsay" data-v="1">✅ REAL</button><button class="btn" data-act="fsay" data-v="0">🚫 FAKE</button></div>';
      else m='<button class="btn go" data-act="crown">CROWN THE WINNER 👑</button>';
      break;
    case 'over': m='<div class="two"><button class="btn go" data-act="start">PLAY AGAIN 🔁</button><button class="btn alt" data-act="newsetup">NEW SETUP ⚙️</button></div>'; break;
  }
  var tools='<div class="tools">'+(tvConn()?'<span class="tvon">📺 TV connected</span>':'<button class="tool" data-act="tv">📺 TV view</button>')+
    '<button class="tool" data-act="sound" aria-label="Toggle sound effects">'+(S.sound?'🔊':'🔇')+'</button>'+
    '<button class="tool" data-act="voice" aria-label="Toggle announcer voice">'+(S.voice?'🗣️':'🤐')+'</button>'+
    (canRe?'<button class="tool" data-act="reroll">🔀 New prompt</button>':'')+
    (S.screen!=='setup'?'<button class="tool" data-act="quit">'+(quitArm?'Sure? Tap again':'🏠 Quit')+'</button>':'')+'</div>';
  c.innerHTML=m+tools;
}
function render(){
  renderBoard(); renderStage(); renderCtl();
  if(S.screen==='turn'&&S.phase==='result'&&S.res&&S.res.id!==lastResId){ lastResId=S.res.id; if(S.res.ok)burst(24); }
  if(S.screen==='final'&&S.fin&&S.fin.step==='rev'&&S.res&&S.res.id!==lastResId){ lastResId=S.res.id; burst(30); }
  if(S.screen==='over'){ if(!cfOn){ cfOn=true; burst(90); } } else cfOn=false;
}

/* ---------- EVENTS ---------- */
var A={
  emoji:function(b){ S.teams[+b.dataset.i].e=b.dataset.e; save(); render(); },
  hc:function(b){ S.hc=+b.dataset.v; save(); render(); },
  len:function(b){ S.len=+b.dataset.v; save(); render(); },
  sound:function(){ S.sound=!S.sound; save(); push(); },
  voice:function(){ S.voice=!S.voice; if(!S.voice){ try{ speechSynthesis.cancel(); }catch(e){} } save(); push(); },
  vtest:function(){ var o=S.voice; S.voice=true; speak(rand(TESTS)); S.voice=o; },
  start:start, introgo:goTurn, begin:begin, next:next, reroll:reroll, crown:crown, newsetup:toSetup,
  grade:function(b){ grade(b.dataset.v==='1'); },
  say:function(b){ say(b.dataset.v==='1'); },
  wager:function(b){ wager(+b.dataset.v); },
  fsay:function(b){ finalSay(b.dataset.v==='1'); },
  tv:function(){ try{ window.open(location.href.split('#')[0].split('?')[0]+'#tv','_blank'); }catch(e){} },
  quit:function(){ if(!quitArm){ quitArm=true; render(); setTimeout(function(){ quitArm=false; render(); },3000); } else { quitArm=false; toSetup(); } }
};
document.addEventListener('click',function(e){
  if(isTV)return; var b=e.target.closest('[data-act]'); if(!b||b.dataset.act==='name')return;
  ac(); var f=A[b.dataset.act]; if(f)f(b);
});
document.addEventListener('change',function(e){
  var el=e.target; if(!el||!el.dataset||el.dataset.act!=='vsel')return; S.vname=el.value; save();
  var o=S.voice; S.voice=true; speak(rand(TESTS)); S.voice=o;
});
document.addEventListener('input',function(e){
  var el=e.target; if(!el||!el.dataset||el.dataset.act!=='name')return;
  var i=+el.dataset.i; S.teams[i].n=el.value; save();
  document.querySelectorAll('[data-nm="'+i+'"]').forEach(function(n){ n.textContent=el.value; });
});
document.addEventListener('pointerdown',function(e){ if(e.target.closest&&e.target.closest('#peekBtn')){ var p=$('#peekbox'); if(p)p.style.display=''; } });
function unpeek(){ var p=$('#peekbox'); if(p)p.style.display='none'; }
document.addEventListener('pointerup',unpeek); document.addEventListener('pointercancel',unpeek);
document.addEventListener('contextmenu',function(e){ if(e.target.closest&&e.target.closest('#peekBtn'))e.preventDefault(); });

/* ---------- TIMER LOOP ---------- */
setInterval(function(){
  if(S.screen==='turn'&&S.phase==='live'&&S.timerEnd){
    var ms=Math.max(0,S.timerEnd-Date.now()),sec=Math.ceil(ms/1000),n=$('#tnum'),bar=$('#tbar');
    if(n){ n.textContent=sec; n.classList.toggle('hot',sec<=10); }
    if(bar){ bar.style.width=(ms/(S.timerSecs*1000)*100)+'%'; bar.classList.toggle('hot',sec<=10); }
    if(!isTV&&sec!==lastSec){ lastSec=sec; if(sec===10&&S.timerSecs>=30)emit('tick',rand(TEN)); else if(sec<=5&&sec>0)emit('tick'); if(sec===0&&!S.timeUp){ S.timeUp=true; push(); emit('buzz',rand(TIMEUP)); } }
  } else lastSec=-1;
  if(!isTV){ var c=tvConn(); if(c!==lastConn){ lastConn=c; render(); } }
},250);

/* ---------- BOOT ---------- */
load();
try{ if(window.speechSynthesis)speechSynthesis.onvoiceschanged=function(){ if(S.screen==='setup'&&!isTV)render(); }; }catch(e){}
if(isTV){
  document.title='Silly Showdown: TV view';
  var ov=$('#ov'); ov.style.display='flex'; ov.innerHTML='<div>📺 TV VIEW<small>Tap once to turn on sound</small></div>';
  ov.addEventListener('pointerdown',function(){ ov.style.display='none'; ac(); try{ speechSynthesis.speak(new SpeechSynthesisUtterance('')); }catch(e){} });
}
render();
})();
</script>
</body>
</html>
