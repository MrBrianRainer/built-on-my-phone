<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2a1408">
<title>Sleepy Dragon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#2a1408;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

/* =========================================================
   Sleepy Dragon — Lightboard kid game #6 (Don't Wake Daddy-style)
   A dragon snores on a mountain of treasure. Take turns tapping
   the pile to sneak treasure. His chest rises and falls: grabbing
   while he breathes OUT is safer. Every grab makes him stir
   a little more. A hidden wake-up count decides when he wakes:
   a big sneeze that blasts treasure everywhere!
   Board space 1600x900; input = normalized taps via TouchSource.
   ========================================================= */

const W = 1600, H = 900;
const FONT = '"Lilita One", "Trebuchet MS", "Segoe UI", system-ui, sans-serif';
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let dpr = 1, scale = 1, ox = 0, oy = 0, vw = 0, vh = 0;

/* ---------------- utils ---------------- */
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(60606);
const lerp = (a,b,t) => a + (b-a)*t;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const ease = {
  inOut: t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2,
  out: t => 1 - Math.pow(1-t, 3),
  in: t => t*t,
  lin: t => t,
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }
};
function hexRgb(h){ const n = parseInt(h.slice(1), 16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const [r,g,b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; }
function shade(h,f){ const [r,g,b] = hexRgb(h);
  const m = v => Math.round(clamp(f < 0 ? v*(1+f) : v + (255-v)*f, 0, 255));
  return `rgb(${m(r)},${m(g)},${m(b)})`; }
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function text(str,x,y,size,color,align='center'){
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color; ctx.fillText(str,x,y);
}
function outlined(str,x,y,size,fill,stroke,lw=6,align='center'){
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(str,x,y);
  ctx.fillStyle = fill; ctx.fillText(str,x,y);
}
function emoji(ch,x,y,size){
  ctx.font = `${size}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(ch,x,y);
}
const glowCache = {};
function glowSprite(color){
  if (glowCache[color]) return glowCache[color];
  const s = 128, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d'), gr = g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0, rgba(color,1)); gr.addColorStop(0.2, rgba(color,0.55)); gr.addColorStop(0.5, rgba(color,0.15)); gr.addColorStop(1, rgba(color,0));
  g.fillStyle = gr; g.fillRect(0,0,s,s); return glowCache[color] = c;
}
function glowTo(c,x,y,r,color,a){ if (a <= 0.003 || r <= 0) return; c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = clamp(a,0,1); c.drawImage(glowSprite(color), x-r, y-r, r*2, r*2); c.restore(); }
const glow = (x,y,r,color,a=1) => glowTo(ctx,x,y,r,color,a);
function starPath(c,x,y,r,rot,pts=4,inner=0.42){
  c.beginPath();
  for (let k = 0; k < pts*2; k++){ const a = rot + k*Math.PI/pts, rad = k % 2 ? r*inner : r; c.lineTo(x + Math.cos(a)*rad, y + Math.sin(a)*rad); }
  c.closePath();
}

/* ---------------- tweens ---------------- */
const tweens = [];
function tween(ms, fn, e = ease.inOut){ return new Promise(res => tweens.push({ start: performance.now(), ms, fn, e, res })); }
const wait = ms => tween(ms, () => {});
function updateTweens(now){
  for (let i = tweens.length - 1; i >= 0; i--){
    const tw = tweens[i]; const t = Math.min(1, (now - tw.start) / tw.ms);
    tw.fn(tw.e(t)); if (t >= 1){ tweens.splice(i,1); tw.res(); }
  }
}

/* ---------------- settings + audio ---------------- */
const settings = { slow: false, sound: true, voice: true, rounds: 3 };
const sfx = {
  ac: null, master: null,
  unlock(){
    try {
      if (!this.ac){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        this.ac = new AC(); this.master = this.ac.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ac.destination); }
      if (this.ac.state === 'suspended') this.ac.resume();
    } catch (e) {}
  },
  ok(){ return settings.sound && this.ac && this.ac.state === 'running'; },
  tone(f, dur=0.25, type='sine', vol=0.2, when=0, slide=1){
    if (!this.ok()) return;
    const a = this.ac, t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide !== 1) o.frequency.exponentialRampToValueAtTime(f*slide, t+dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.05);
  },
  noise(dur=0.3, vol=0.15, f0=800, f1=800, when=0, type='bandpass'){
    if (!this.ok()) return;
    const a = this.ac, len = Math.max(1, Math.floor(a.sampleRate*dur)), buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random()*2-1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type; f.Q.value = 0.9;
    const t = a.currentTime + when;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t+dur);
    const g = a.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+dur*0.35); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t+dur+0.05);
  },
  tap(){ this.tone(1000, 0.06, 'triangle', 0.06); },
  inhale(){ this.noise(1.25, 0.09, 200, 700, 0, 'lowpass'); this.tone(70, 1.2, 'sine', 0.05, 0, 1.4); },
  exhale(){ this.noise(1.55, 0.11, 700, 160, 0, 'lowpass'); this.tone(96, 1.4, 'sine', 0.06, 0, 0.6); },
  grab(){ for (let i = 0; i < 5; i++) this.tone(2200 + Math.random()*1600, 0.07, 'triangle', 0.06, i*0.04); this.tone(1100, 0.16, 'sine', 0.06); },
  clink(){ this.tone(2800 + Math.random()*1400, 0.09, 'triangle', 0.05, 0, 0.7); },
  greedy(){ this.tone(220, 0.2, 'sawtooth', 0.05, 0, 0.8); this.tone(180, 0.25, 'sawtooth', 0.05, 0.12, 0.8); },
  stir(){ this.tone(110, 0.3, 'sawtooth', 0.09, 0, 1.6); this.noise(0.4, 0.09, 400, 1400, 0, 'lowpass'); },
  gasp(){ this.noise(0.5, 0.15, 300, 2000, 0, 'bandpass'); },
  sneeze(){ this.noise(0.28, 0.2, 400, 2600, 0, 'bandpass'); this.noise(0.9, 0.42, 3200, 90, 0.34, 'lowpass'); this.tone(150, 0.7, 'sawtooth', 0.14, 0.34, 0.2);
    for (let i = 0; i < 16; i++) this.tone(1800 + Math.random()*2400, 0.16, 'triangle', 0.05, 0.4 + i*0.05); },
  snore(){ this.noise(0.55, 0.06, 140, 300, 0, 'lowpass'); },
  turn(){ this.tone(660, 0.14, 'triangle', 0.09); this.tone(990, 0.2, 'triangle', 0.08, 0.1); },
  coinsUp(){ [988, 1319, 1760].forEach((f,i) => this.tone(f, 0.16, 'triangle', 0.08, i*0.06)); },
  round(){ [523, 659, 784].forEach((f,i) => this.tone(f, 0.24, 'triangle', 0.09, i*0.09)); },
  win(){ const m = [523, 659, 784, 659, 784, 1047, 988, 1319];
    m.forEach((f,i) => { this.tone(f, 0.28, 'triangle', 0.12, i*0.12); this.tone(f/2, 0.28, 'sine', 0.08, i*0.12); });
    for (let i = 0; i < 12; i++) this.tone(1800 + Math.random()*2000, 0.16, 'sine', 0.04, 1.2 + i*0.07); },
  start(){ [262, 330, 392, 523].forEach((f,i) => this.tone(f, 0.28, 'triangle', 0.09, i*0.09)); },
  join(i){ this.tone([523, 659, 784, 988][i%4], 0.22, 'triangle', 0.12, 0, 1.4); }
};
let speechUnlocked = false;
function speak(str){
  if (!settings.voice || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(str); u.rate = 1.0; u.pitch = 1.15; speechSynthesis.speak(u); } catch (e) {}
}
function unlockAll(){
  sfx.unlock();
  if (!speechUnlocked && 'speechSynthesis' in window){ speechUnlocked = true;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {} }
}

/* ---------------- scene layout ---------------- */
const PILE = { x: 800, y: 760, rx: 640, ry: 150 };     // treasure mound (front)
const DRAGON = { x: 800, y: 520 };                     // chest center
const BREATH = 2.9;                                    // seconds per breath cycle: in (0..0.5) out (0.5..1)
const GEM_COLS = ['#ff5a7a', '#5ee6d0', '#6cb6ff', '#b98cff', '#7ee26b', '#ff9a3c'];
const coinsFar = [], gems = [], glints = [], embers = [], bats = [], dust = [];
for (let i = 0; i < 140; i++){
  const a = R()*Math.PI, r = R();
  coinsFar.push({ x: PILE.x + Math.cos(a)*PILE.rx*(0.15 + r*0.95)*(R() < 0.5 ? 1 : -1), y: PILE.y - Math.sin(a)*PILE.ry*(0.1 + r*0.9) + 20 + R()*40, rot: R()*3, s: 12 + R()*10, gold: R() < 0.85 });
}
for (let i = 0; i < 22; i++) gems.push({ x: 160 + R()*1280, y: 690 + R()*160, s: 10 + R()*12, col: pick(GEM_COLS), ph: R()*6.28 });
for (let i = 0; i < 40; i++) glints.push({ x: 100 + R()*1400, y: 660 + R()*220, ph: R()*6.28, sp: 0.8 + R()*2 });
for (let i = 0; i < 26; i++) embers.push({ x: R()*W, y: R()*H, ph: R()*6.28, sp: 10 + R()*24 });
for (let i = 0; i < 3; i++) bats.push({ x: R()*W, y: 100 + R()*160, ph: R()*6.28, sp: 30 + R()*30 });
for (let i = 0; i < 30; i++) dust.push({ x: R()*W, y: R()*H, ph: R()*6.28 });

/* ---------------- background prerender ---------------- */
const bg = document.createElement('canvas');
function buildBackground(){
  const k = scale*dpr;
  bg.width = Math.max(1, Math.round(W*k)); bg.height = Math.max(1, Math.round(H*k));
  const b = bg.getContext('2d'); b.setTransform(k,0,0,k,0,0);
  // cave walls
  let g = b.createRadialGradient(800, 420, 100, 800, 420, 1000);
  g.addColorStop(0, '#5a2e1c'); g.addColorStop(0.55, '#341a13'); g.addColorStop(1, '#170b0c');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  // rock texture blobs
  const rr_ = rng(7);
  for (let i = 0; i < 90; i++){
    const x = rr_()*W, y = rr_()*640, r = 30 + rr_()*90;
    b.fillStyle = `rgba(${rr_() < 0.5 ? '255,180,120' : '20,6,6'},${0.03 + rr_()*0.05})`;
    b.beginPath(); b.ellipse(x, y, r*1.4, r, rr_()*3, 0, Math.PI*2); b.fill();
  }
  // stalactites
  const sr = rng(11);
  for (let i = 0; i < 16; i++){
    const x = 30 + i*100 + sr()*40, h = 60 + sr()*130, w = 22 + sr()*30;
    b.fillStyle = '#2b150f'; b.beginPath(); b.moveTo(x - w, 0); b.lineTo(x + w, 0); b.lineTo(x + sr()*8 - 4, h); b.closePath(); b.fill();
    b.fillStyle = 'rgba(255,190,130,0.08)'; b.beginPath(); b.moveTo(x - w, 0); b.lineTo(x - w*0.2, 0); b.lineTo(x, h); b.closePath(); b.fill();
  }
  // cave mouth glow far left/right torches
  glowTo(b, 90, 380, 300, '#ff9a3c', 0.35); glowTo(b, 1510, 380, 300, '#ff9a3c', 0.35);
  // treasure glow behind dragon
  glowTo(b, 800, 640, 700, '#ffc24a', 0.30);
  // pile base
  b.fillStyle = '#7a4a10';
  b.beginPath(); b.moveTo(-40, H + 20); b.quadraticCurveTo(200, 690, 520, 650); b.quadraticCurveTo(800, 600, 1080, 650); b.quadraticCurveTo(1400, 690, 1640, H + 20); b.closePath(); b.fill();
  g = b.createLinearGradient(0, 620, 0, H); g.addColorStop(0, '#ffd45a'); g.addColorStop(0.5, '#e9a52c'); g.addColorStop(1, '#8a5310');
  b.fillStyle = g;
  b.beginPath(); b.moveTo(-40, H + 20); b.quadraticCurveTo(220, 700, 520, 662); b.quadraticCurveTo(800, 618, 1080, 662); b.quadraticCurveTo(1380, 700, 1640, H + 20); b.closePath(); b.fill();
  // coins baked into the pile
  for (const c of coinsFar){
    b.save(); b.translate(c.x, c.y); b.rotate(c.rot);
    b.fillStyle = c.gold ? '#ffcf3d' : '#dfe4ef'; b.beginPath(); b.ellipse(0, 0, c.s, c.s*0.55, 0, 0, Math.PI*2); b.fill();
    b.strokeStyle = c.gold ? '#b87a0e' : '#8a94ab'; b.lineWidth = 2; b.stroke();
    b.fillStyle = c.gold ? '#fff0a6' : '#ffffff'; b.beginPath(); b.ellipse(-c.s*0.25, -c.s*0.12, c.s*0.35, c.s*0.13, 0, 0, Math.PI*2); b.fill();
    b.restore();
  }
  // gems baked in
  for (const gm of gems){
    b.fillStyle = gm.col; b.beginPath(); b.moveTo(gm.x, gm.y - gm.s); b.lineTo(gm.x + gm.s*0.8, gm.y - gm.s*0.2); b.lineTo(gm.x + gm.s*0.5, gm.y + gm.s*0.8); b.lineTo(gm.x - gm.s*0.5, gm.y + gm.s*0.8); b.lineTo(gm.x - gm.s*0.8, gm.y - gm.s*0.2); b.closePath(); b.fill();
    b.fillStyle = 'rgba(255,255,255,0.55)'; b.beginPath(); b.moveTo(gm.x, gm.y - gm.s); b.lineTo(gm.x + gm.s*0.3, gm.y - gm.s*0.1); b.lineTo(gm.x - gm.s*0.2, gm.y - gm.s*0.1); b.closePath(); b.fill();
  }
  // vignette
  g = b.createRadialGradient(800, 470, 400, 800, 470, 1050); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(10,3,4,0.6)');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
}

/* ---------------- input: TouchSource ---------------- */
function toBoard(cx,cy){ return { x: (cx-ox)/scale, y: (cy-oy)/scale }; }
class PointerSource {
  constructor(el){
    this.el = el; this.slow = false; this.dwell = 650; this.active = new Map(); this.handlers = [];
    el.addEventListener('pointerdown', e => this.down(e));
    el.addEventListener('pointermove', e => this.move(e));
    el.addEventListener('pointerup', e => this.up(e));
    el.addEventListener('pointercancel', e => this.active.delete(e.pointerId));
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  onTap(fn){ this.handlers.push(fn); }
  emit(bx,by){ const ev = { x: bx/W, y: by/H, type: 'tap' }; for (const f of this.handlers) f(ev); }
  down(e){
    e.preventDefault(); unlockAll();
    const p = toBoard(e.clientX, e.clientY);
    this.active.set(e.pointerId, { x: p.x, y: p.y, sx: p.x, sy: p.y, start: performance.now(), fired: false, moved: false });
    try { this.el.setPointerCapture(e.pointerId); } catch (_) {}
  }
  move(e){
    const a = this.active.get(e.pointerId); if (!a) return;
    const p = toBoard(e.clientX, e.clientY); a.x = p.x; a.y = p.y;
    if (Math.hypot(a.x-a.sx, a.y-a.sy) > 30){
      if (this.slow){ a.sx = a.x; a.sy = a.y; a.start = performance.now(); a.fired = false; } else a.moved = true;
    }
  }
  up(e){ const a = this.active.get(e.pointerId); this.active.delete(e.pointerId); if (a && !this.slow && !a.moved) this.emit(a.sx, a.sy); }
  update(now){
    if (!this.slow) return;
    for (const a of this.active.values()) if (!a.fired && now - a.start >= this.dwell){ a.fired = true; this.emit(a.sx, a.sy); }
  }
}
const source = new PointerSource(cv);
source.onTap(handleTap);
window.Lightboard = { tap: (nx, ny) => handleTap({ x: nx, y: ny, type: 'tap' }) };

/* ---------------- game state ---------------- */
const HEROES = [
  { name: 'Mouse',  emoji: '🐭', color: '#ffb6c9' },
  { name: 'Fox',    emoji: '🦊', color: '#ff9a5c' },
  { name: 'Bunny',  emoji: '🐰', color: '#d9c2ff' },
  { name: 'Raccoon',emoji: '🦝', color: '#9fd6ff' }
];
const TILE_X = [440, 680, 920, 1160];
let joined = [true, true, false, false];
let screen = 'menu', paused = false, phase = 'idle';
let players = [], turn = 0, gameId = 0, round = 1, winners = [], statusMsg = '';
let wakeAt = 0, grabsThisRound = 0, flying = [], lastGrabQuality = '';
const dragon = { eye: 0, wake: 0, sneeze: 0, snoutY: 0, shake: 0, mood: 'sleep', jaw: 0, blink: 0, chest: 0 };
const coinsFly = [], puffs = [], zzz = [], sparks = [], taps = [], pops = [], confetti = [];
const spawned = [];               // scattered loose coins after a sneeze

/* Pure rules: wake threshold chosen once per round (hidden). Each grab adds "stir";
   grabbing on the exhale adds less, greedy inhale grabs add more. */
function rollWake(){ return 13 + Math.floor(Math.random()*9); }      // 13..21 stir points
function stirFor(phaseVal, greedy){
  // phaseVal 0..1 through breath cycle. 0..0.5 = inhale (chest rising), 0.5..1 = exhale
  const exhale = phaseVal >= 0.5;
  return exhale ? (greedy ? 1.3 : 0.55) : (greedy ? 3.0 : 1.5);
}
function breathPhase(t){ return ((t % BREATH) + BREATH) % BREATH / BREATH; }
function chestScale(t){ const p = breathPhase(t); return p < 0.5 ? ease.inOut(p*2) : 1 - ease.inOut((p - 0.5)*2); }

function startGame(){
  gameId++;
  players = HEROES.map((c,i) => ({ ...c, seat: i })).filter(c => joined[c.seat]).map(c => ({ ...c, treasure: 0, sneezes: 0, x: 0, y: 0 }));
  turn = 0; round = 1; winners = []; statusMsg = ''; flying = []; spawned.length = 0;
  newRound(); screen = 'play'; paused = false; phase = 'await';
  sfx.start(); setTimeout(() => announceTurn(true), 500);
}
function newRound(){ wakeAt = rollWake(); grabsThisRound = 0; stirTotal = 0; dragon.wake = 0; dragon.eye = 0; dragon.mood = 'sleep'; dragon.sneeze = 0; dragon.jaw = 0; }
let stirTotal = 0;
function toMenu(){ gameId++; screen = 'menu'; paused = false; phase = 'idle'; players = []; spawned.length = 0; }
function announceTurn(first){
  const p = players[turn]; if (!p || screen !== 'play') return;
  sfx.turn(); statusMsg = '';
  speak(first ? `${p.name}, sneak some treasure! Grab when he breathes out.` : `${p.name}'s turn!`);
}

let greedyHeld = 0;    // number of consecutive greedy grabs for this player this turn (visual)
async function grab(greedy){
  if (phase !== 'await' || screen !== 'play') return;
  phase = 'busy';
  const gid = gameId, pl = players[turn];
  const bp = breathPhase(performance.now()/1000);
  const exhale = bp >= 0.5;
  const amount = greedy ? 3 : 1;
  const st = stirFor(bp, greedy);
  stirTotal += st; grabsThisRound++;
  sfx.grab(); if (greedy) sfx.greedy();
  // treasure flies to the player's chip
  const target = chipPos(players.indexOf(pl));
  const startX = pl.tapX || PILE.x, startY = pl.tapY || PILE.y - 60;
  for (let k = 0; k < amount*3; k++){
    const isGem = greedy && k % 3 === 0;
    const c = { x: startX + (Math.random()-0.5)*50, y: startY + (Math.random()-0.5)*30, gem: isGem, col: pick(GEM_COLS), t: -k*0.04, sx: startX, sy: startY, tx: target.x - 40, ty: target.y, rot: Math.random()*6 };
    coinsFly.push(c);
  }
  pl.treasure += amount;
  quality(exhale, greedy);
  pops.push({ x: startX, y: startY - 30, str: `+${amount}`, t: 0, color: '#ffe27a' });
  // dragon reacts to the stir
  dragon.eye = clamp(stirTotal/wakeAt, 0, 1)*0.78;
  if (!exhale) { dragon.shake = 0.7; sfx.stir(); }
  await wait(650);
  if (gid !== gameId) return;
  if (stirTotal >= wakeAt){ await sneeze(pl, gid); return; }
  const frac = stirTotal/wakeAt;
  if (frac > 0.72) speak('He is stirring! Careful!');
  else if (!exhale) speak('Ooh! That was close!');
  else speak(pick(['Sneaky!', 'Nice!', 'Shhh!']));
  await wait(350);
  if (gid !== gameId) return;
  turn = (turn + 1) % players.length;
  phase = 'await';
  announceTurn(false);
}
function quality(exhale, greedy){
  statusMsg = greedy ? (exhale ? 'Big grab, sneaky timing!' : 'Greedy grab while he breathes in!') : (exhale ? 'Perfect timing!' : 'Risky: he was breathing in');
}

async function sneeze(pl, gid){
  phase = 'sneeze';
  speak('Uh oh! He is waking up!'); sfx.gasp();
  dragon.mood = 'wake';
  // eyes pop open
  await tween(600, t => { dragon.eye = lerp(dragon.eye, 1, t); dragon.shake = 1; }, ease.out);
  if (gid !== gameId) return;
  // wind-up: nose scrunches, head tilts back
  speak('Ah... ah...');
  await tween(1100, t => { dragon.sneeze = t*0.9; dragon.shake = 0.5 + t*0.6; }, ease.in);
  if (gid !== gameId) return;
  // ACHOO
  sfx.sneeze(); speak('Ah choo!');
  dragon.mood = 'sneeze'; dragon.jaw = 1;
  const sx = DRAGON.x + 20, sy = DRAGON.y - 120;
  puffs.push({ x: sx, y: sy, r: 30, life: 0, max: 1.4, fire: true });
  for (let i = 0; i < 60; i++){
    const a = -Math.PI/2 + (Math.random()-0.5)*2.6, v = 300 + Math.random()*900;
    spawned.push({ x: sx, y: sy, vx: Math.cos(a)*v, vy: Math.sin(a)*v, rot: Math.random()*6, vr: (Math.random()-0.5)*12, s: 12 + Math.random()*8, gem: Math.random() < 0.22, col: pick(GEM_COLS), rest: false, life: 0 });
  }
  for (let i = 0; i < 40; i++) sparks.push({ x: sx, y: sy, vx: (Math.random()-0.5)*1400, vy: -Math.random()*900, life: 0, max: 0.6 + Math.random()*0.6, s: 6 + Math.random()*10, col: pick(['#ffcf3d', '#ff9a3c', '#ff6a3d', '#fff0a6']) });
  await tween(400, t => { dragon.sneeze = 0.9 + t*0.1; dragon.shake = 1.6; }, ease.out);
  await wait(700);
  if (gid !== gameId) return;
  // everyone drops what they grabbed *this round* ... wait: only the sneezer loses a little (friendly)
  const loss = Math.min(pl.treasure, 3);
  pl.treasure -= loss; pl.sneezes++;
  pops.push({ x: chipPos(players.indexOf(pl)).x, y: 800, str: `−${loss}`, t: 0, color: '#ff8a8a' });
  speak(`${pl.name} woke the dragon! He sneezed ${loss} back!`);
  statusMsg = `${pl.name} woke him up!`;
  await wait(1700);
  if (gid !== gameId) return;
  // dragon settles back to sleep
  await tween(900, t => { dragon.jaw = 1 - t; dragon.sneeze = 1 - t; dragon.eye = 1 - t; dragon.shake = 0; }, ease.inOut);
  dragon.mood = 'sleep'; dragon.sneeze = 0; dragon.jaw = 0; dragon.eye = 0;
  round++;
  if (round > settings.rounds){ finish(); return; }
  sfx.round(); speak(`Round ${round}! The dragon fell back asleep.`);
  spawned.length = 0;
  newRound();
  await wait(1200);
  if (gid !== gameId) return;
  turn = (turn + 1) % players.length;
  phase = 'await'; announceTurn(false);
}

function finish(){
  const best = Math.max(...players.map(p => p.treasure));
  winners = players.filter(p => p.treasure === best);
  screen = 'win'; phase = 'win'; sfx.win();
  const names = winners.map(w => w.name);
  speak(names.length > 1 ? `${names.slice(0,-1).join(', ')} and ${names[names.length-1]} share the treasure! Hooray!` : `${names[0]} got the most treasure! Hooray!`);
  for (let i = 0; i < 80; i++) confetti.push({ x: Math.random()*W, y: -20 - Math.random()*400, vx: (Math.random()-0.5)*60, vy: 80 + Math.random()*140, rot: Math.random()*6, vr: (Math.random()-0.5)*8, col: pick(['#ffcf3d', '#ff9a3c', '#ffffff', '#5ee6d0', '#ff5a7a']), s: 8 + Math.random()*8 });
}

function chipPos(i){ const n = players.length, w = 270; return { x: 800 - (n-1)*w/2 + i*w, y: 858 }; }

/* ---------------- update ---------------- */
let T = 0, last = performance.now(), nextZ = 1, lastBreath = -1, nextAmb = 4;
function update(dt, now){
  T = now/1000;
  dragon.chest = chestScale(T);
  // breathing sounds (cycle transitions)
  const cyc = Math.floor(T/(BREATH/2));
  if (cyc !== lastBreath){ lastBreath = cyc; if (dragon.mood === 'sleep' && screen !== 'menu' || (screen === 'menu')){ if (cyc % 2 === 0) sfx.inhale(); else sfx.exhale(); } }
  dragon.shake *= Math.pow(0.02, dt);
  dragon.blink = (Math.sin(T*0.7) > 0.985) ? 1 : 0;
  // Zzz
  if (dragon.mood === 'sleep' && T > nextZ){ zzz.push({ x: DRAGON.x + 150, y: DRAGON.y - 200, life: 0, s: 0.7 + Math.random()*0.5 }); nextZ = T + 1.4 + Math.random(); }
  for (let i = zzz.length-1; i >= 0; i--){ const z = zzz[i]; z.life += dt; z.x += 22*dt; z.y -= 40*dt; if (z.life > 3) zzz.splice(i,1); }
  // flying coins
  for (let i = coinsFly.length-1; i >= 0; i--){ const c = coinsFly[i]; c.t += dt/0.85; if (c.t >= 1){ coinsFly.splice(i,1); sfx.clink(); continue; }
    if (c.t < 0) continue; const t = ease.inOut(c.t);
    c.x = lerp(c.sx, c.tx, t); c.y = lerp(c.sy, c.ty, t) - Math.sin(Math.PI*t)*160; c.rot += dt*10; }
  // spawned coins from sneeze
  for (const c of spawned){
    if (c.rest) continue; c.life += dt;
    c.vy += 1500*dt; c.x += c.vx*dt; c.y += c.vy*dt; c.rot += c.vr*dt;
    if (c.y > 640 + Math.random()*0 + (c.x - 800)*(c.x - 800)*0.00005 && c.vy > 0){ c.vy *= -0.32; c.vx *= 0.6; c.vr *= 0.5; if (Math.abs(c.vy) < 120){ c.rest = true; c.y = Math.min(c.y, 860); } }
    if (c.x < 20 || c.x > W - 20) c.vx *= -0.5;
    if (Math.random() < dt*0.3 && c.life < 3) sfx.clink();
  }
  for (let i = puffs.length-1; i >= 0; i--){ const p = puffs[i]; p.life += dt; p.r += 340*dt; if (p.life > p.max) puffs.splice(i,1); }
  for (let i = sparks.length-1; i >= 0; i--){ const s = sparks[i]; s.life += dt; s.vy += 900*dt; s.x += s.vx*dt; s.y += s.vy*dt; s.vx *= 0.98; if (s.life > s.max) sparks.splice(i,1); }
  for (let i = pops.length-1; i >= 0; i--){ pops[i].t += dt; if (pops[i].t > 1.1) pops.splice(i,1); }
  for (let i = taps.length-1; i >= 0; i--){ taps[i].t += dt; if (taps[i].t > 0.5) taps.splice(i,1); }
  for (let i = confetti.length-1; i >= 0; i--){ const c = confetti[i]; c.x += (c.vx + Math.sin(T*3 + c.rot)*30)*dt; c.y += c.vy*dt; c.rot += c.vr*dt; if (c.y > H + 30) confetti.splice(i,1); }
  if (screen === 'win' && Math.random() < dt*10) confetti.push({ x: Math.random()*W, y: -20, vx: 0, vy: 120 + Math.random()*120, rot: Math.random()*6, vr: 4, col: pick(['#ffcf3d', '#ff9a3c', '#ffffff', '#5ee6d0', '#ff5a7a']), s: 8 + Math.random()*8 });
  for (const e of embers){ e.y -= e.sp*dt; e.x += Math.sin(T + e.ph)*8*dt; if (e.y < -10){ e.y = H + 10; e.x = Math.random()*W; } }
  for (const b of bats){ b.x += b.sp*dt; b.y += Math.sin(T*1.3 + b.ph)*20*dt; if (b.x > W + 40){ b.x = -40; b.y = 100 + Math.random()*160; } }
  if (T > nextAmb){ if (dragon.mood === 'sleep'){ sfx.snore(); } else sfx.clink(); nextAmb = T + 2 + Math.random()*4; }
}

function drawParticles(){
  for (const p of puffs){ const k = p.life/p.max; if (p.fire){ glow(p.x, p.y, p.r*1.6, '#ffb04a', (1 - k)*0.8); ctx.fillStyle = `rgba(255,220,140,${(1-k)*0.5})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r*0.7, 0, Math.PI*2); ctx.fill(); } }
  for (const s of sparks){ const k = 1 - s.life/s.max; glow(s.x, s.y, s.s*2.4*k + 2, s.col, k*0.7); ctx.fillStyle = rgba('#ffffff', k*0.8); ctx.beginPath(); ctx.arc(s.x, s.y, 3*k + 1, 0, Math.PI*2); ctx.fill(); }
  for (const c of coinsFly){ if (c.t < 0) continue; ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    if (c.gem){ ctx.fillStyle = c.col; ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(11, -2); ctx.lineTo(7, 11); ctx.lineTo(-7, 11); ctx.lineTo(-11, -2); ctx.closePath(); ctx.fill(); }
    else { ctx.fillStyle = '#ffcf3d'; ctx.beginPath(); ctx.ellipse(0, 0, 14, 9*Math.abs(Math.cos(c.rot*2)) + 2, 0, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#b87a0e'; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.restore(); glow(c.x, c.y, 22, '#ffe27a', 0.5); }
  for (const q of pops){ const k = q.t/1.1, s = q.t < 0.15 ? ease.back(q.t/0.15) : 1;
    ctx.save(); ctx.globalAlpha = 1 - Math.max(0, (k - 0.6)/0.4); ctx.translate(q.x, q.y - k*40); ctx.scale(s, s); outlined(q.str, 0, 0, 58, '#ffffff', shade(q.color, -0.5), 10); ctx.restore(); }
  for (const c of confetti){ ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.scale(Math.cos(c.rot*1.7), 1); ctx.fillStyle = c.col; ctx.fillRect(-c.s/2, -c.s/3, c.s, c.s*0.66); ctx.restore(); }
}
function drawAmbient(){
  for (const e of embers){ const a = 0.3 + 0.4*Math.sin(T*2 + e.ph); glow(e.x, e.y, 10, '#ff9a3c', Math.max(0, a*0.7)); }
  for (const b of bats){ const f = Math.sin(T*10 + b.ph)*10;
    ctx.fillStyle = '#1a0d10'; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.quadraticCurveTo(b.x - 14, b.y - f, b.x - 26, b.y - 4 - f*0.4); ctx.quadraticCurveTo(b.x - 12, b.y + 4, b.x, b.y + 6);
    ctx.quadraticCurveTo(b.x + 12, b.y + 4, b.x + 26, b.y - 4 - f*0.4); ctx.quadraticCurveTo(b.x + 14, b.y - f, b.x, b.y); ctx.fill(); }
  for (const d of dust){ const a = 0.12 + 0.2*Math.sin(T*0.6 + d.ph); glow(d.x + Math.sin(T*0.3 + d.ph)*30, d.y + Math.cos(T*0.25 + d.ph)*20, 10, '#ffd9a0', Math.max(0, a)); }
}
function drawChips(){
  if (screen === 'menu') return;
  players.forEach((p, i) => {
    const { x, y } = chipPos(i), cur = i === turn && screen === 'play';
    rr(ctx, x - 122, y - 32, 244, 64, 32); ctx.fillStyle = cur ? rgba(p.color, 0.94) : 'rgba(30,14,10,0.84)'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = cur ? '#ffffff' : rgba(p.color, 0.8); ctx.stroke();
    emoji(p.emoji, x - 86, y, 38);
    emoji('💰', x - 34, y, 28);
    outlined(String(p.treasure), x + 6, y + 2, 36, '#ffffff', cur ? shade(p.color, -0.55) : '#2a120a', 6, 'left');
    if (p.sneezes){ emoji('🤧', x + 78, y, 26); outlined(String(p.sneezes), x + 104, y + 2, 24, '#ffffff', '#2a120a', 5, 'left'); }
  });
}
function drawBanner(){
  if (screen !== 'play') return;
  const p = players[turn]; if (!p) return;
  const w = 660, h = 80, x = 800 - w/2, y = 12;
  rr(ctx, x, y, w, h, 40); ctx.fillStyle = 'rgba(30,14,10,0.86)'; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = p.color; ctx.stroke();
  emoji(p.emoji, x + 48, y + h/2 + 2, 46);
  text(`${p.name}'s turn`, x + 92, y + 28, 32, '#ffffff', 'left');
  let sub = statusMsg;
  if (!sub) sub = phase === 'await' ? (settings.slow ? 'Hold the pile to sneak treasure' : 'Tap Sneak 1 or Grab 3') : phase === 'sneeze' ? 'ACHOO!' : 'Shhh…';
  text(sub, x + 92, y + 58, 21, p.color, 'left');
  outlined(`Round ${round} of ${settings.rounds}`, x + w + 22, y + h/2 + 2, 28, '#ffe6a0', '#2a120a', 6, 'left');
  ctx.fillStyle = 'rgba(30,14,10,0.86)'; ctx.beginPath(); ctx.arc(1540, 54, 34, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.fillRect(1528, 40, 8, 28); ctx.fillRect(1544, 40, 8, 28);
  // "how awake" mini meter: tiny sleepy->awake bar on left of banner
  const ax = 40, ay = 60;
  rr(ctx, ax, ay - 20, 26, 190, 13); ctx.fillStyle = 'rgba(30,14,10,0.8)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; ctx.stroke();
  const fr = clamp(stirTotal/wakeAt, 0, 1); ctx.save(); rr(ctx, ax + 3, ay - 17, 20, 184, 10); ctx.clip();
  const mg = ctx.createLinearGradient(0, ay + 170, 0, ay - 20); mg.addColorStop(0, '#7ee26b'); mg.addColorStop(0.6, '#ffe27a'); mg.addColorStop(1, '#ff5a5a');
  ctx.fillStyle = mg; ctx.fillRect(ax + 3, ay + 167 - 184*fr, 20, 184*fr + 4); ctx.restore();
  emoji(fr > 0.7 ? '😳' : '😴', ax + 13, ay + 196, 30);
}
function pill(x, y, w, h, label, color, on = true, big = false){
  rr(ctx, x - w/2, y - h/2, w, h, h/2);
  if (big){ glow(x, y, w*0.7, color, on ? 0.3 + 0.1*Math.sin(T*3) : 0.05);
    const g = ctx.createLinearGradient(0, y - h/2, 0, y + h/2); g.addColorStop(0, '#ffe9a0'); g.addColorStop(1, '#f2a83a');
    ctx.fillStyle = on ? g : 'rgba(120,100,90,0.5)'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#fff6d0'; ctx.stroke();
    outlined(label, x, y + 2, h*0.46, '#ffffff', '#8a4a10', 8); }
  else { ctx.fillStyle = on ? rgba(color, 0.28) : 'rgba(30,14,10,0.85)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = on ? color : 'rgba(255,255,255,0.25)'; ctx.stroke();
    text(label, x, y + 2, h*0.36, on ? '#ffffff' : 'rgba(255,255,255,0.55)'); }
}
const TOGGLES = [
  { key: 'rounds', x: 440 },
  { key: 'slow',  on: 'Slow touch: on', off: 'Slow touch: off', x: 680 },
  { key: 'sound', on: 'Sound: on',      off: 'Sound: off',      x: 920 },
  { key: 'voice', on: 'Voice: on',      off: 'Voice: off',      x: 1160 }
];
function drawToggles(y, withRounds){
  for (const t of TOGGLES){
    if (t.key === 'rounds'){ if (withRounds) pill(t.x, y, 220, 70, `Rounds: ${settings.rounds}`, '#ffd166', true); continue; }
    pill(t.x, y, 220, 70, settings[t.key] ? t.on : t.off, '#7ee26b', settings[t.key]);
  }
}
function drawMenu(){
  ctx.fillStyle = 'rgba(20,8,6,0.55)'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.font = `118px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = '#ff9a3c'; ctx.shadowBlur = 30; ctx.lineJoin = 'round'; ctx.lineWidth = 16; ctx.strokeStyle = '#5a2a0a'; ctx.strokeText('Sleepy Dragon', 800, 120);
  ctx.fillStyle = '#ffe27a'; ctx.fillText('Sleepy Dragon', 800, 120); ctx.restore();
  text('Who’s sneaking in? Tap to join.', 800, 226, 36, 'rgba(255,255,255,0.9)');
  HEROES.forEach((c, i) => {
    const x = TILE_X[i], y = 420, on = joined[i];
    if (on) glow(x, y, 170, c.color, 0.35);
    rr(ctx, x - 105, y - 118, 210, 236, 34); ctx.fillStyle = on ? 'rgba(46,22,14,0.94)' : 'rgba(26,12,8,0.72)'; ctx.fill();
    ctx.lineWidth = on ? 4 : 2; ctx.strokeStyle = on ? c.color : 'rgba(255,255,255,0.2)'; ctx.stroke();
    ctx.save(); ctx.globalAlpha = on ? 1 : 0.45;
    const b = on ? Math.abs(Math.sin(T*3 + i))*10 : 0; emoji(c.emoji, x, y - 20 - b, 108); ctx.restore();
    text(c.name, x, y + 70, 32, on ? '#ffffff' : 'rgba(255,255,255,0.7)');
    text(on ? 'Ready!' : 'Tap to join', x, y + 98, 20, on ? c.color : 'rgba(255,255,255,0.45)');
  });
  drawToggles(624, true);
  pill(800, 770, 340, 100, 'Sneak in!', '#ffd166', joined.some(Boolean), true);
  text(settings.slow ? 'Slow touch acts like the camera: hold still until the ring fills.' : 'Grab treasure while he breathes OUT. Wake him and he sneezes some back!', 800, 852, 22, 'rgba(255,255,255,0.7)');
}
function drawPause(){
  ctx.fillStyle = 'rgba(20,8,6,0.72)'; ctx.fillRect(0, 0, W, H);
  rr(ctx, 360, 190, 880, 520, 40); ctx.fillStyle = 'rgba(44,20,12,0.97)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,209,102,0.7)'; ctx.lineWidth = 4; ctx.stroke();
  outlined('Paused', 800, 262, 66, '#ffe27a', '#5a2a0a', 10);
  pill(800, 370, 380, 92, 'Keep playing', '#ffd166', true, true);
  for (const t of TOGGLES) if (t.key !== 'rounds') pill(t.x - 120, 490, 220, 70, settings[t.key] ? t.on : t.off, '#7ee26b', settings[t.key]);
  pill(800, 610, 380, 80, 'New game', '#ff8a6a', true);
}
function drawWin(){
  ctx.fillStyle = 'rgba(20,8,6,0.5)'; ctx.fillRect(0, 0, W, H);
  const n = winners.length;
  winners.forEach((p, i) => {
    const x = 800 - (n-1)*130 + i*260, b = Math.abs(Math.sin(T*3.4 + i))*30;
    glow(x, 320, 170, p.color, 0.5);
    ctx.fillStyle = rgba(p.color, 0.92); ctx.beginPath(); ctx.arc(x, 320, 108, 0, Math.PI*2); ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = '#ffffff'; ctx.stroke();
    emoji(p.emoji, x, 320 - b, n > 2 ? 110 : 140);
  });
  const names = winners.map(w => w.name);
  const line = n > 1 ? `${names.slice(0,-1).join(', ')} & ${names[n-1]} win!` : `${names[0]} wins!`;
  outlined(line, 800, 490, 72, '#ffffff', '#5a2a0a', 12);
  outlined(`${winners[0] ? winners[0].treasure : 0} treasures 💰`, 800, 566, 40, '#ffe27a', '#5a2a0a', 8);
  pill(640, 700, 300, 92, 'Play again', '#ffd166', true, true);
  pill(960, 700, 300, 92, 'Menu', '#7ee26b', true);
}
function drawTaps(now){
  for (const r of taps){ const k = r.t/0.5; ctx.strokeStyle = `rgba(255,255,255,${0.8*(1-k)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(r.x, r.y, 12 + k*46, 0, Math.PI*2); ctx.stroke(); }
  if (!source.slow) return;
  for (const a of source.active.values()){
    if (a.fired) continue;
    const k = clamp((now - a.start)/source.dwell, 0, 1);
    glow(a.sx, a.sy, 60, '#ffd166', 0.2 + k*0.4);
    ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(a.sx, a.sy, 42, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = '#ffd166'; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(a.sx, a.sy, 42, -Math.PI/2, -Math.PI/2 + k*Math.PI*2); ctx.stroke(); ctx.lineCap = 'butt';
  }
}

/* ---------------- buttons / taps ---------------- */
const GRAB1 = { x: 560, y: 790, w: 300, h: 104 }, GRAB3 = { x: 1040, y: 790, w: 300, h: 104 };
function buttons(){
  const B = [];
  if (screen === 'menu'){
    HEROES.forEach((c, i) => B.push({ x: TILE_X[i], y: 420, w: 214, h: 240, silent: true, on: () => {
      joined[i] = !joined[i]; if (joined[i]){ sfx.join(i); sparks.push(...Array.from({ length: 16 }, () => ({ x: TILE_X[i], y: 400, vx: (Math.random()-0.5)*500, vy: -Math.random()*500, life: 0, max: 0.8, s: 8, col: '#ffe27a' }))); } else sfx.tap(); } }));
    for (const t of TOGGLES) B.push({ x: t.x, y: 624, w: 220, h: 76, on: () => {
      if (t.key === 'rounds') settings.rounds = settings.rounds >= 5 ? 1 : settings.rounds + 1; else settings[t.key] = !settings[t.key]; applySettings(); } });
    B.push({ x: 800, y: 770, w: 350, h: 110, on: () => { if (joined.some(Boolean)) startGame(); } });
  } else if (paused){
    B.push({ x: 800, y: 370, w: 390, h: 100, on: () => { paused = false; } });
    for (const t of TOGGLES) if (t.key !== 'rounds') B.push({ x: t.x - 120, y: 490, w: 220, h: 76, on: () => { settings[t.key] = !settings[t.key]; applySettings(); } });
    B.push({ x: 800, y: 610, w: 390, h: 90, on: toMenu });
  } else if (screen === 'play'){
    B.push({ x: 1540, y: 54, w: 96, h: 96, on: () => { paused = true; } });
    if (phase === 'await'){
      B.push({ x: GRAB1.x, y: GRAB1.y, w: GRAB1.w + 20, h: GRAB1.h + 20, silent: true, on: () => { const p = players[turn]; p.tapX = GRAB1.x + 60; p.tapY = 700; grab(false); } });
      B.push({ x: GRAB3.x, y: GRAB3.y, w: GRAB3.w + 20, h: GRAB3.h + 20, silent: true, on: () => { const p = players[turn]; p.tapX = GRAB3.x - 60; p.tapY = 700; grab(true); } });
    }
  } else if (screen === 'win'){
    B.push({ x: 640, y: 700, w: 310, h: 100, on: startGame });
    B.push({ x: 960, y: 700, w: 310, h: 100, on: toMenu });
  }
  return B;
}
function handleTap(ev){
  const x = ev.x*W, y = ev.y*H;
  taps.push({ x, y, t: 0 });
  for (const b of buttons()){
    if (Math.abs(x - b.x) <= b.w/2 && Math.abs(y - b.y) <= b.h/2){ if (!b.silent) sfx.tap(); b.on(); return; }
  }
  // tapping the pile itself does a careful grab; tapping the dragon's nose is a tickle (funny!)
  if (screen === 'play' && !paused && phase === 'await' && y > 640 && y < 820){
    const p = players[turn]; p.tapX = x; p.tapY = y; grab(false); return;
  }
  if (screen === 'play' && !paused && phase === 'await' && Math.hypot(x - (DRAGON.x + 460), y - (DRAGON.y - 60)) < 90){
    sfx.stir(); dragon.shake = 0.6; speak('Shhh! Don’t tickle him!');
  }
}
function applySettings(){
  source.slow = settings.slow;
  if (!settings.voice && 'speechSynthesis' in window) try { speechSynthesis.cancel(); } catch (e) {}
}

/* ---------------- main loop ---------------- */
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth; vh = window.innerHeight;
  cv.width = Math.round(vw*dpr); cv.height = Math.round(vh*dpr);
  cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
  scale = Math.min(vw/W, vh/H); ox = (vw - W*scale)/2; oy = (vh - H*scale)/2;
  buildBackground();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  updateTweens(now);
  source.update(now);
  update(dt, now);

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#2a1408'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr*scale, 0, 0, dpr*scale, dpr*ox, dpr*oy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

  ctx.drawImage(bg, 0, 0, W, H);
  drawAmbient();
  drawDragon();
  drawZzz();
  drawTreasureFront();
  drawGrabTarget();
  drawParticles();
  drawChips();
  drawBanner();
  if (screen === 'menu') drawMenu();
  if (screen === 'win') drawWin();
  if (paused) drawPause();
  drawTaps(now);
  ctx.restore();

  if (vh > vw*1.05){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `16px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText('Turn your phone sideways for a bigger cave', vw/2, Math.max(24, oy/2));
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
