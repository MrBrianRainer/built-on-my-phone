<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<title>Monster Mechanics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

  html,body{margin:0;height:100%;background:#2b1b4a;overflow:hidden;touch-action:none;

  canvas{display:block;touch-action:none}

<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

/* =========================================================
   Monster Mechanics — Lightboard kid game #8 (Operation-inspired)
   Every monster builds a monster truck in four skill stations,
   then all the trucks race. Careful building makes a faster truck.
     1. Tighten wheels: HOLD the wrench on each bolt until the ring fills
     2. Pump tires: tap the pump, hit the number on the tire, don't pop it
     3. Pick parts: wings, turbo, spoiler, mud guards, springs, horn
     4. Weld: drag the torch along the seam, steady hands win
   Board space 1600x900; input = normalized taps via TouchSource.
   Hold and drag stations read the live finger position
   (source.active), which a camera source will expose too.
   ========================================================= */

const W = 1600, H = 900;
const FONT = 'Bangers, "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif';
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let dpr = 1, scale = 1, ox = 0, oy = 0, vw = 0, vh = 0;

/* ---------------- utils ---------------- */
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(88123);
const lerp = (a,b,t) => a + (b-a)*t;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const ease = {
  inOut: t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2,
  out: t => 1 - Math.pow(1-t, 3),
  in: t => t*t,
  lin: t => t,
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }
};
function hexRgb(h){ const n = parseInt(h.slice(1), 16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ const [r,g,b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; }
function shade(h,f){ const [r,g,b] = hexRgb(h);
  const m = v => Math.round(clamp(f < 0 ? v*(1+f) : v + (255-v)*f, 0, 255));
  return `rgb(${m(r)},${m(g)},${m(b)})`; }
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function text(str,x,y,size,color,align='center'){
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color; ctx.fillText(str,x,y);
}
function outlined(str,x,y,size,fill,stroke,lw=6,align='center'){
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(str,x,y);
  ctx.fillStyle = fill; ctx.fillText(str,x,y);
}
function emoji(ch,x,y,size){
  ctx.font = `${size}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(ch,x,y);
}
const glowCache = {};
function glowSprite(color){
  if (glowCache[color]) return glowCache[color];
  const s = 128, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d'), gr = g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0, rgba(color,1)); gr.addColorStop(0.2, rgba(color,0.55)); gr.addColorStop(0.5, rgba(color,0.15)); gr.addColorStop(1, rgba(color,0));
  g.fillStyle = gr; g.fillRect(0,0,s,s); return glowCache[color] = c;
}
function glowTo(c,x,y,r,color,a){ if (a <= 0.003 || r <= 0) return; c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = clamp(a,0,1); c.drawImage(glowSprite(color), x-r, y-r, r*2, r*2); c.restore(); }
const glow = (x,y,r,color,a=1) => glowTo(ctx,x,y,r,color,a);
function starPath(c,x,y,r,rot,pts=5,inner=0.45){
  c.beginPath();
  for (let k = 0; k < pts*2; k++){ const a = rot + k*Math.PI/pts, rad = k % 2 ? r*inner : r; c.lineTo(x + Math.cos(a)*rad, y + Math.sin(a)*rad); }
  c.closePath();
}

/* ---------------- tweens ---------------- */
const tweens = [];
function tween(ms, fn, e = ease.inOut){ return new Promise(res => tweens.push({ start: performance.now(), ms, fn, e, res })); }
const wait = ms => tween(ms, () => {});
function updateTweens(now){
  for (let i = tweens.length - 1; i >= 0; i--){
    const tw = tweens[i]; const t = Math.min(1, (now - tw.start) / tw.ms);
    tw.fn(tw.e(t)); if (t >= 1){ tweens.splice(i,1); tw.res(); }
  }
}

/* ---------------- settings + audio ---------------- */
const settings = { slow: false, sound: true, voice: true };
const sfx = {
  ac: null, master: null,
  unlock(){
    try {
      if (!this.ac){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        this.ac = new AC(); this.master = this.ac.createGain(); this.master.gain.value = 0.5; this.master.connect(this.ac.destination); }
      if (this.ac.state === 'suspended') this.ac.resume();
    } catch (e) {}
  },
  ok(){ return settings.sound && this.ac && this.ac.state === 'running'; },
  tone(f, dur=0.25, type='sine', vol=0.2, when=0, slide=1){
    if (!this.ok()) return;
    const a = this.ac, t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide !== 1) o.frequency.exponentialRampToValueAtTime(f*slide, t+dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.05);
  },
  noise(dur=0.3, vol=0.15, f0=800, f1=800, when=0, type='bandpass'){
    if (!this.ok()) return;
    const a = this.ac, len = Math.max(1, Math.floor(a.sampleRate*dur)), buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random()*2-1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type; f.Q.value = 1;
    const t = a.currentTime + when;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t+dur);
    const g = a.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t+dur+0.05);
  },
  tap(){ this.tone(1000, 0.06, 'square', 0.05); },
  ratchet(){ this.tone(1500, 0.03, 'square', 0.06); this.tone(1100, 0.03, 'square', 0.05, 0.05); },
  tight(){ this.tone(660, 0.1, 'triangle', 0.14); this.tone(990, 0.16, 'triangle', 0.12, 0.08); this.noise(0.08, 0.1, 3000, 1000); },
  loose(){ this.tone(300, 0.2, 'sawtooth', 0.08, 0, 0.6); },
  pump(){ this.noise(0.28, 0.14, 500, 2200, 0, 'bandpass'); this.tone(180, 0.12, 'triangle', 0.08, 0, 0.7); },
  hiss(){ this.noise(0.45, 0.1, 5000, 2500, 0, 'highpass'); },
  pop(){ this.noise(0.25, 0.3, 4000, 300, 0, 'lowpass'); this.tone(120, 0.2, 'sine', 0.25, 0, 0.4); },
  perfect(){ [784, 988, 1175, 1568].forEach((f,i) => this.tone(f, 0.22, 'triangle', 0.1, i*0.07)); },
  weld(){ this.noise(0.12, 0.09, 4000, 6000, 0, 'highpass'); },
  place(){ this.tone(330, 0.1, 'triangle', 0.14, 0, 1.6); this.noise(0.1, 0.08, 1200, 300); },
  clang(){ this.tone(520, 0.3, 'square', 0.07, 0, 0.7); this.tone(780, 0.25, 'triangle', 0.06); },
  turn(){ this.tone(660, 0.12, 'square', 0.06); this.tone(990, 0.18, 'square', 0.06, 0.09); },
  stage(){ [392, 523, 659, 784].forEach((f,i) => this.tone(f, 0.22, 'square', 0.07, i*0.09)); },
  done(){ [523, 659, 784].forEach((f,i) => this.tone(f, 0.2, 'triangle', 0.1, i*0.07)); },
  rev(){ this.tone(70, 0.9, 'sawtooth', 0.12, 0, 3); this.noise(0.9, 0.06, 200, 900, 0, 'lowpass'); },
  beep(){ this.tone(660, 0.22, 'square', 0.1); },
  go(){ this.tone(1320, 0.5, 'square', 0.12); this.rev(); },
  honk(){ this.tone(330, 0.25, 'sawtooth', 0.09); this.tone(415, 0.25, 'sawtooth', 0.08); },
  boost(){ this.noise(0.6, 0.14, 500, 4000, 0, 'bandpass'); this.tone(200, 0.5, 'sawtooth', 0.07, 0, 3); },
  jump(){ this.tone(300, 0.5, 'sine', 0.12, 0, 2.5); },
  land(){ this.noise(0.2, 0.18, 800, 200, 0, 'lowpass'); this.tone(90, 0.2, 'sine', 0.2, 0, 0.5); },
  splat(){ this.noise(0.35, 0.12, 300, 100, 0, 'lowpass'); },
  crowd(){ this.noise(1.2, 0.09, 700, 1400, 0, 'bandpass'); },
  win(){ const m = [523, 659, 784, 659, 784, 1047, 988, 1319];
    m.forEach((f,i) => { this.tone(f, 0.26, 'square', 0.07, i*0.11); this.tone(f/2, 0.26, 'triangle', 0.1, i*0.11); }); this.crowd(); },
  start(){ [262, 330, 392, 523].forEach((f,i) => this.tone(f, 0.26, 'square', 0.07, i*0.09)); },
  join(i){ this.tone([392, 494, 587, 698][i%4], 0.22, 'square', 0.07, 0, 1.5); }
};
let speechUnlocked = false;
function speak(str){
  if (!settings.voice || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(str); u.rate = 1.02; u.pitch = 1.1; speechSynthesis.speak(u); } catch (e) {}
}
function unlockAll(){
  sfx.unlock();
  if (!speechUnlocked && 'speechSynthesis' in window){ speechUnlocked = true;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {} }
}

/* ---------------- monsters, parts, car ---------------- */
const MONSTERS = [
  { name: 'Gloop', type: 0, color: '#5fe08a' },
  { name: 'Fuzz',  type: 1, color: '#b98cff' },
  { name: 'Spike', type: 2, color: '#ff9a4d' },
  { name: 'Zog',   type: 3, color: '#4cc9ff' }
];
const PARTS = {
  wings:   { name: 'Wings',      stat: { air: 2, speed: 0.5 } },
  turbo:   { name: 'Turbo',      stat: { speed: 2, grip: -0.5 } },
  spoiler: { name: 'Spoiler',    stat: { grip: 2, speed: 0.5 } },
  mud:     { name: 'Mud Guards', stat: { mud: 2, grip: 0.5 } },
  springs: { name: 'Springs',    stat: { air: 1.5, mud: 0.5 } },
  horn:    { name: 'Big Horn',   stat: { luck: 1.5, speed: 0.3 } }
};
const PART_IDS = Object.keys(PARTS);
const STAT_ICON = { speed: '⚡', grip: '🧲', air: '🦘', mud: '🏞️', luck: '🍀' };
const WORK = { x: 800, y: 520, s: 1.7 };
function wheelLocal(w){ return { x: w ? 108 : -108, y: 46 }; }
const BOLT_ANG = [-2.2, 0.9], BOLT_R = 24;
function boltScreen(i){ const w = i >> 1, a = BOLT_ANG[i % 2], wc = wheelLocal(w);
  return { x: WORK.x + (wc.x + Math.cos(a)*BOLT_R)*WORK.s, y: WORK.y + (wc.y + Math.sin(a)*BOLT_R)*WORK.s }; }
function seamLocal(u){ return { x: -150 + u*300, y: -38 + Math.sin(u*Math.PI*3)*14 }; }
function seamScreen(u){ const p = seamLocal(u); return { x: WORK.x + p.x*WORK.s, y: WORK.y + p.y*WORK.s }; }
const HOLD_T = 1.1, TOL = 40;

function newBuild(){ return { bolts: [0,0,0,0], loose: [false,false,false,false], wheelQ: 1, tireQ: [1,1], tireR: [1,1], parts: [], weldQ: 1, welded: false, weldProg: 0, burns: [], stages: 0 }; }
function carStats(b){
  const tq = (b.tireQ[0] + b.tireQ[1])/2;
  const s = { speed: (b.wheelQ - 0.5)*1.2, grip: tq*1.6, air: 0, mud: tq*0.6, luck: 0 };
  for (const id of b.parts){ const st = PARTS[id].stat; for (const k in st) s[k] += st[k]; }
  return s;
}

function drawMonster(x, y, r, type, col, mood, t){
  ctx.save(); ctx.translate(x, y);
  const dark = shade(col, -0.35), lite = shade(col, 0.45);
  ctx.fillStyle = col;
  if (type === 1){
    ctx.beginPath(); for (let k = 0; k < 28; k++){ const a = k*2*Math.PI/28, rad = r*(k % 2 ? 1.12 : 0.98); ctx.lineTo(Math.cos(a)*rad, Math.sin(a)*rad*0.95); } ctx.closePath(); ctx.fill();
    ctx.fillStyle = dark; ctx.beginPath(); ctx.moveTo(-r*0.6, -r*0.7); ctx.lineTo(-r*0.4, -r*1.25); ctx.lineTo(-r*0.15, -r*0.85); ctx.fill();
    ctx.beginPath(); ctx.moveTo(r*0.6, -r*0.7); ctx.lineTo(r*0.4, -r*1.25); ctx.lineTo(r*0.15, -r*0.85); ctx.fill();
  } else if (type === 2){
    ctx.fillStyle = dark; for (let k = -2; k <= 2; k++){ ctx.beginPath(); ctx.moveTo(k*r*0.36 - r*0.16, -r*0.8); ctx.lineTo(k*r*0.36, -r*(1.35 - Math.abs(k)*0.1)); ctx.lineTo(k*r*0.36 + r*0.16, -r*0.8); ctx.fill(); }
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
  } else if (type === 3){
    ctx.strokeStyle = dark; ctx.lineWidth = r*0.1; ctx.lineCap = 'round';
    for (const s of [-1, 1]){ ctx.beginPath(); ctx.moveTo(s*r*0.4, -r*0.8); ctx.quadraticCurveTo(s*r*0.7, -r*1.3, s*r*0.5 + Math.sin(t*4)*r*0.1, -r*1.5); ctx.stroke(); ctx.fillStyle = '#ffe27a'; ctx.beginPath(); ctx.arc(s*r*0.5 + Math.sin(t*4)*r*0.1, -r*1.5, r*0.16, 0, Math.PI*2); ctx.fill(); }
    ctx.lineCap = 'butt'; ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0, 0, r*1.05, r*0.95, 0, 0, Math.PI*2); ctx.fill();
  } else {
    const sq = 1 + Math.sin(t*3)*0.03;
    ctx.beginPath(); ctx.ellipse(0, r*0.05, r*1.08*sq, r*0.95/sq, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = dark; for (const dx of [-0.5, 0.15, 0.6]){ ctx.beginPath(); ctx.ellipse(r*dx, r*0.95, r*0.11, r*0.2 + Math.sin(t*2 + dx*5)*r*0.04, 0, 0, Math.PI*2); ctx.fill(); }
  }
  ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.beginPath(); ctx.ellipse(-r*0.3, -r*0.45, r*0.32, r*0.17, -0.5, 0, Math.PI*2); ctx.fill();
  const look = mood === 'wow' ? 0 : Math.sin(t*1.5)*r*0.05;
  const eye = (ex, ey, er) => { ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1e1630'; ctx.beginPath(); ctx.arc(ex + look, ey + (mood === 'oops' ? er*0.2 : 0), er*(mood === 'wow' ? 0.35 : 0.5), 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(ex + look - er*0.15, ey - er*0.2, er*0.16, 0, Math.PI*2); ctx.fill(); };
  if (type === 0) eye(0, -r*0.12, r*0.42); else { eye(-r*0.36, -r*0.15, r*0.27); eye(r*0.36, -r*0.15, r*0.27); }
  if (type === 3){ eye(0, -r*0.5, r*0.18); }
  ctx.strokeStyle = '#3a1f4a'; ctx.fillStyle = '#3a1f4a'; ctx.lineWidth = r*0.09; ctx.lineCap = 'round';
  const my = r*0.4;
  if (mood === 'wow'){ ctx.beginPath(); ctx.ellipse(0, my, r*0.16, r*0.22, 0, 0, Math.PI*2); ctx.fill(); }
  else if (mood === 'oops'){ ctx.beginPath(); for (let k = 0; k <= 6; k++){ const px = -r*0.3 + k*r*0.1, py = my + (k % 2 ? -1 : 1)*r*0.05; k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); } ctx.stroke(); }
  else if (mood === 'cheer'){ ctx.beginPath(); ctx.moveTo(-r*0.4, my - r*0.05); ctx.quadraticCurveTo(0, my + r*0.6, r*0.4, my - r*0.05); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#ff7a8a'; ctx.beginPath(); ctx.ellipse(0, my + r*0.2, r*0.2, r*0.1, 0, 0, Math.PI*2); ctx.fill(); }
  else { ctx.beginPath(); ctx.arc(0, my - r*0.1, r*0.3, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke(); if (type === 2){ ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(-r*0.18, my + r*0.14); ctx.lineTo(-r*0.09, my + r*0.3); ctx.lineTo(0, my + r*0.16); ctx.fill(); } }
  ctx.lineCap = 'butt';
  ctx.fillStyle = 'rgba(255,120,150,0.4)'; ctx.beginPath(); ctx.ellipse(-r*0.62, r*0.18, r*0.14, r*0.09, 0, 0, Math.PI*2); ctx.ellipse(r*0.62, r*0.18, r*0.14, r*0.09, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawPartShape(id, t, flame){
  ctx.save();
  if (id === 'wings'){
    const fl = Math.sin(t*6)*0.06;
    for (const s of [-1, 1]){ ctx.save(); ctx.rotate(s*fl); ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#7a6aa8'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(0, 8); ctx.quadraticCurveTo(s*44, -46, s*96, -34); ctx.quadraticCurveTo(s*70, -12, s*58, -6); ctx.quadraticCurveTo(s*46, 2, s*30, 6); ctx.quadraticCurveTo(s*18, 12, 0, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(122,106,168,0.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(s*10, 4); ctx.lineTo(s*70, -24); ctx.moveTo(s*10, 6); ctx.lineTo(s*50, -6); ctx.stroke(); ctx.restore(); }
  } else if (id === 'turbo'){
    if (flame > 0){ const f = 1 + Math.sin(t*50)*0.2; glow(-72, 0, 60, '#ff9a3c', 0.8*flame);
      ctx.fillStyle = '#ffd84d'; ctx.beginPath(); ctx.moveTo(-40, -10); ctx.lineTo(-40 - 66*f*flame, 0); ctx.lineTo(-40, 10); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff6a2a'; ctx.beginPath(); ctx.moveTo(-40, -5); ctx.lineTo(-40 - 40*f*flame, 0); ctx.lineTo(-40, 5); ctx.closePath(); ctx.fill(); }
    const g = ctx.createLinearGradient(0, -22, 0, 22); g.addColorStop(0, '#d8dbe6'); g.addColorStop(1, '#6a6f86');
    ctx.fillStyle = g; rr(ctx, -40, -22, 84, 44, 14); ctx.fill(); ctx.strokeStyle = '#3a3f56'; ctx.lineWidth = 4; ctx.stroke();
    ctx.fillStyle = '#3a3f56'; rr(ctx, -50, -14, 14, 28, 5); ctx.fill();
    ctx.fillStyle = '#ff5a5f'; ctx.fillRect(-10, -22, 8, 44); ctx.fillStyle = '#ffd23a'; ctx.fillRect(6, -22, 8, 44);
  } else if (id === 'spoiler'){
    ctx.fillStyle = '#3a3f56'; ctx.fillRect(-26, 4, 8, 34); ctx.fillRect(18, 4, 8, 34);
    ctx.fillStyle = '#ff5a5f'; rr(ctx, -50, -14, 100, 22, 8); ctx.fill(); ctx.strokeStyle = '#8a1f2a'; ctx.lineWidth = 4; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; rr(ctx, -44, -10, 70, 5, 3); ctx.fill();
  } else if (id === 'mud'){
    ctx.strokeStyle = '#2f9a4a'; ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, 0, 70, Math.PI*1.02, Math.PI*1.98); ctx.stroke();
    ctx.strokeStyle = '#7ee08a'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(0, 0, 73, Math.PI*1.1, Math.PI*1.6); ctx.stroke(); ctx.lineCap = 'butt';
    ctx.fillStyle = '#7a4a2a'; for (const [dx, dy] of [[-56, -34], [4, -66], [50, -42]]){ ctx.beginPath(); ctx.arc(dx, dy, 5, 0, Math.PI*2); ctx.fill(); }
  } else if (id === 'springs'){
    const sq = 1 + Math.sin(t*5)*0.08;
    ctx.strokeStyle = '#ffb02e'; ctx.lineWidth = 7; ctx.lineJoin = 'round'; ctx.beginPath();

/* ---------------- input: TouchSource ---------------- */
function toBoard(cx,cy){ return { x: (cx-ox)/scale, y: (cy-oy)/scale }; }
class PointerSource {
  constructor(el){
    this.el = el; this.slow = false; this.dwell = 650; this.active = new Map(); this.handlers = [];
    el.addEventListener('pointerdown', e => this.down(e));
    el.addEventListener('pointermove', e => this.move(e));
    el.addEventListener('pointerup', e => this.up(e));
    el.addEventListener('pointercancel', e => this.active.delete(e.pointerId));
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  onTap(fn){ this.handlers.push(fn); }
  emit(bx,by){ const ev = { x: bx/W, y: by/H, type: 'tap' }; for (const f of this.handlers) f(ev); }
  down(e){
    e.preventDefault(); unlockAll();
    const p = toBoard(e.clientX, e.clientY);
    this.active.set(e.pointerId, { x: p.x, y: p.y, sx: p.x, sy: p.y, start: performance.now(), fired: false, moved: false });
    try { this.el.setPointerCapture(e.pointerId); } catch (_) {}
  }
  move(e){
    const a = this.active.get(e.pointerId); if (!a) return;
    const p = toBoard(e.clientX, e.clientY); a.x = p.x; a.y = p.y;
    if (Math.hypot(a.x-a.sx, a.y-a.sy) > 30){
      if (this.slow){ a.sx = a.x; a.sy = a.y; a.start = performance.now(); a.fired = false; } else a.moved = true;
    }
  }
  up(e){ const a = this.active.get(e.pointerId); this.active.delete(e.pointerId); if (a && !this.slow && !a.moved) this.emit(a.sx, a.sy); }
  update(now){
    if (!this.slow) return;
    for (const a of this.active.values()) if (!a.fired && now - a.start >= this.dwell){ a.fired = true; this.emit(a.sx, a.sy); }
  }
}

function runTask(t){ return new Promise(res => { t.resolve = res; task = t; }); }

async function playBuild(gid){
  await wait(500);
  for (stage = 0; stage < 4; stage++){
    if (gid !== gameId) return;
    banner = { icon: STAGES[stage].icon, title: `Stage ${stage + 1} of 4`, sub: STAGES[stage].name, t: 0 };
    sfx.stage(); speak(STAGES[stage].say);
    await tween(3200, t => { banner.t = t; }, ease.lin); banner = null;
    for (cur = 0; cur < players.length; cur++){
      if (gid !== gameId) return;
      const p = players[cur];
      phase = 'busy'; sfx.turn();
      if (players.length > 1) { speak(`${p.name}, it is your turn!`); await wait(1300); if (gid !== gameId) return; }
      phase = 'task';
      if (stage === 0) await stageWheels(p); else if (stage === 1) await stageTires(p); else if (stage === 2) await stageParts(p); else await stageWeld(p);
      if (gid !== gameId) return;
      p.b.stages = stage + 1; p.mood = 'cheer'; sfx.done();
      sparkle(WORK.x, WORK.y - 60, p.color, 30, 300);
      await wait(1000); p.mood = 'happy';
    }
  }
  if (gid !== gameId) return;
  await beforeRace(gid);
}

/* ----- stage 1: wheels ----- */
async function stageWheels(p){
  const t = { kind: 'wheels', p, i: 0, hold: 0, held: false, cool: 0.4, shake: 0, tick: 0 };
  p.b.bolts = [0,0,0,0]; p.b.loose = [false,false,false,false];
  await runTask(t);
  const loose = p.b.loose.filter(Boolean).length;
  p.b.wheelQ = clamp(1 - loose*0.16, 0.4, 1);
  speak(loose === 0 ? 'All tight! Great job!' : loose === 1 ? 'One bolt is a bit loose. The wheel might wobble!' : 'Some bolts are loose. Your wheels will wobble!');
  task = null;
}
function finishBolt(t, state){
  const p = t.p; p.b.bolts[t.i] = state; if (state === 2) p.b.loose[t.i] = true;
  const bp = boltScreen(t.i);
  if (state === 1){ sfx.tight(); sparkle(bp.x, bp.y, '#ffd23a', 14, 200); pops.push({ x: bp.x, y: bp.y - 50, str: 'Tight!', t: 0, color: '#ffd23a' }); }
  else { sfx.loose(); pops.push({ x: bp.x, y: bp.y - 50, str: 'Loose!', t: 0, color: '#ff8a3d' }); }
  t.i++; t.hold = 0; t.held = false; t.cool = 0.4;
  if (t.i >= 4){ const r = t.resolve; t.resolve = null; task = Object.assign({}, t, { kind: 'wait' }); r(); }
}

/* ----- stage 2: tires ----- */
async function stageTires(p){
  for (let w = 0; w < 2; w++){
    const target = pick([24, 26, 28, 30, 32, 34]);
    const t = { kind: 'tires', p, w, target, psi: 0, pops: 0, needle: 0, pump: 0, result: null, lock: false };
    speak(w === 0 ? `Front tires. Pump to ${target}!` : `Back tires. Pump to ${target}!`);
    await runTask(t);
    const d = Math.abs(t.psi - target);
    const q = d <= 2 ? 1 : d <= 5 ? 0.7 : 0.4;
    p.b.tireQ[w] = q; p.b.tireR[w] = 1;
    if (q === 1){ sfx.perfect(); speak('Perfect pressure!'); pops.push({ x: 600, y: 380, str: 'Perfect!', t: 0, color: '#7ee26b' }); }
    else if (q === 0.7){ speak('Close enough!'); } else { speak('A little flat or squishy. It will slip!'); }
    await wait(1100);
  }
  task = null;
}
function pumpTap(t){
  if (t.lock || t.popping) return;
  const add = 3 + Math.floor(Math.random()*3);
  t.psi += add; t.pump = 1; sfx.pump();
  const px = 1130, py = 520;
  for (let k = 0; k < 4; k++) sparks.push({ x: px - 90, y: py - 40, vx: -120 - Math.random()*120, vy: -30 + Math.random()*60, life: 0, max: 0.45, s: 8, col: '#ffffff', puff: true });
  if (t.psi > t.target + 3) popTire(t);
}
async function popTire(t){
  t.popping = true; t.pops++; sfx.pop();
  sparkle(600, 520, '#ffffff', 40, 500); pops.push({ x: 600, y: 380, str: 'POP!', t: 0, color: '#ff5a5f' });
  speak('Pop! Too much air! New tire!');
  const g = gameId;
  await tween(700, tt => { t.burst = tt; });
  if (g !== gameId) return;
  t.psi = 0; t.burst = 0; t.popping = false;
}
function lockTire(t){
  if (t.lock || t.popping || t.psi < 6) return;
  t.lock = true; sfx.tap();
  const r = t.resolve; t.resolve = null; r();
}

const PART_CARD = id => { const i = PART_IDS.indexOf(id), col = i % 3, row = Math.floor(i/3); return { x: 800 + (col - 1)*270, y: 590 + row*205, w: 244, h: 186 }; };

  } else if (paused){

function handleTap(ev){
  const x = ev.x*W, y = ev.y*H;
  taps.push({ x, y, t: 0 });
  for (const b of buttons()){
    if (Math.abs(x - b.x) <= b.w/2 && Math.abs(y - b.y) <= b.h/2){ if (!b.silent) sfx.tap(); b.on(); return; }
  }
  if (screen !== 'build' || paused || !task) return;
  if (task.kind === 'tires'){
    if (Math.abs(x - PUMP.x) < 140 && Math.abs(y - PUMP.y) < 200) pumpTap(task);
    else if (Math.abs(x - 560) < 170 && Math.abs(y - 738) < 50) lockTire(task);

}

function resize(){

  vw = window.innerWidth; vh = window.innerHeight;
  cv.width = Math.round(vw*dpr); cv.height = Math.round(vh*dpr);
  cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
  scale = Math.min(vw/W, vh/H); ox = (vw - W*scale)/2; oy = (vh - H*scale)/2;
  buildBackground();
}

  if (!paused) update(dt, now); else T = now/1000;

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#2b1b4a'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr*scale, 0, 0, dpr*scale, dpr*ox, dpr*oy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

  if (screen === 'menu'){ ctx.drawImage(bgBuild, 0, 0, W, H); drawMenu(); }
  else if (screen === 'build') drawBuild();
  else if (screen === 'race') drawRace();
  else if (screen === 'results'){ drawRace(); drawResults(); }
  drawEffects();
  drawBanner();
  drawTopButtons();
  if (paused) drawPause();
  drawTaps(now);
  ctx.restore();

  if (vh > vw*1.05){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `20px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText('Turn your phone sideways for a bigger garage', vw/2, Math.max(24, oy/2));
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
